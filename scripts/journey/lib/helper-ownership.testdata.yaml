# Ownership inventory for every helper exported by scripts/journey/lib/.
#
# Exactly one owner per (file, symbol):
# - browser-neutral-core-policy: pure values with no browser, DOM, runner, or
#   app import. Only the two pinned constants qualify.
# - app-owned-host-runtime: browser/DOM behavior, Playwright wiring, and pure
#   app-side predicates with a single app-side owner. Browser code here is
#   never duplicated into the private child package.
# - compatibility-re-export: a re-export of a canonical pure value, never a
#   redefinition. Value identity with the canonical file is asserted.
#
# The legacy `theme` fixture (project-name inference for the broad catalog)
# rides with the `test` row: it is defined inside the extended test object,
# not as a module export, so export membership cannot name it separately.
# The row-scoped `resolveRowTheme` helper (explicit row key for Fairtest) is
# its own row. Both paths are app-owned and documented as separate paths in
# fixtures.mjs: neither silently replaces the other.
expectedCaseCount: 14
cases:
