      activeSection: {observed: true, observedAtMs: 2000}
      view: {observed: true, observedAtMs: 2000}
      theme: {expected: dark, observed: dark, source: 'component-target-fixture', observedAtMs: 2100}
    expectValid: false
    expectedErrorContains: ['at path', 'repair:']
