# Fairtrade product target cases: theme rows, route per theme, section
# selection, capability and cross-kind negatives, project-name inference
# rejection, and lifecycle traces. This record is the single source for the
# product adapter contract test; the test module owns no row data.
#
# The third family declares the app-owned product-view accessibility
# baseline (per observation point: clean at analytics, one pre-existing
# critical violation at map, observed in both themes) and probes the
# baseline-delta gate: at-baseline and improved measurements pass, while a
# new violation id, an increased node count, or an escalated impact fail.
#
# The second family covers the row-scoped theme setup descriptor, the
# normalized rendered-theme observation with its contradiction guard, the
# project-name inference rejection, the assembled product proof record
# with its per-part and action negatives, and the journey compatibility
# wrapper behavior.
#
# The fourth family names the eight negative product mutations
# (missing chrome/body/section/view, wrong theme, unregistered action,
# cross-kind proof, stale served asset). Each names its owning boundary and
# the diagnostic fragments the real producer path must fail with; the
# executable runners live in product-mutations.mjs, proven browser-free
# plus one real-DOM absence proof and one throwaway-copy stale-asset proof.
expectedCaseCount: 69
cases:
  - name: theme-row-dark-absent-passes
    check: theme-row
    theme: dark
    renderedAttribute: null
    expectTheme: dark
    expectValid: true
    expectFrozen: true
