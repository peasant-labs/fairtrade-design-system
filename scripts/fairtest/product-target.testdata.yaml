# Fairtrade product target cases: theme rows, route per theme, section
# selection, capability and cross-kind negatives, project-name inference
# rejection, and lifecycle traces. This record is the single source for the
# product adapter contract test; the test module owns no row data.
#
# The third family declares the app-owned product-view accessibility
# baseline (per observation point: clean at analytics, one pre-existing
# critical violation at map, observed in both themes) and probes the
# baseline-delta gate: at-baseline and improved measurements pass, while a
# new violation id, an increased node count, or an escalated impact fail.
#
# The second family covers the row-scoped theme setup descriptor, the
# normalized rendered-theme observation with its contradiction guard, the
# project-name inference rejection, the assembled product proof record
# with its per-part and action negatives, and the journey compatibility
# wrapper behavior.
#
# The fourth family names the nine negative product mutations
# (missing chrome/body/section/view, blank active view, wrong theme,
# unregistered action, cross-kind proof, stale served asset). Each names its
# owning boundary and the diagnostic fragments the real producer path must
# fail with; the executable runners live in product-mutations.mjs, proven
# browser-free plus real-DOM absence and blank-view proofs over the served
# bytes and one throwaway-copy stale-asset proof.
#
# The fifth family carries the record.json accessibility block as a
# verifier-facing reading: the verdict is read from the gate receipts over the
# gated product-view scope, the page-wide census stays nested and explicitly
# informational, and churning that informational count never moves the
# verdict. The unqualified page-wide shape, the missing gated scope, a
# mislabeled scope or root, a foreign gate policy, a mismatched gate point,
# and a scoped count contradicting its own gate receipt are held as refusals,
# not as passes.
#
# The sixth family carries the row observation times: real readings in
# observation order, never assembly-order offsets off the row start.
#
# The seventh family covers the two cheap pure guards that keep the run
# subtree immutable and the mounted command honest: the run-root resolver
# (missing, relative, absolute) and the mounted CLI target flag (missing,
# unknown). Both fail closed at their own boundary, and the CLI cases are run
# as real subprocesses of the shim.
#
# It also carries the real static driver's two fail-closed listener controls and
# the adapter's declared driver contract. The real driver is started on a
# scratch loopback port against a throwaway root whose parent holds a marker
# file, and every encoded traversal form must be refused with the declared
# status while the marker bytes stay out of the response; a non-loopback host
# must be refused at construction while the loopback host is still accepted. A
# fake driver whose stop rejects when it is not running must still leave the
# original start diagnostic as the failure a maintainer reads, and the adapter
# must declare that stop requirement on its driver surface.
