# Export-ownership inventory for the Fairtest host modules.
#
# Every export of the five host modules under scripts/fairtest/ is assigned to
# exactly one owner, so "app-owned registry" and "browser-bearing host runtime"
# are ENFORCED boundaries rather than described ones. The row set is the module
# export set: no export may be unclassified and no row may be a phantom.
#
# The four owners and what each one may do:
#
#   runtime-constants-owner        the loopback origin, the render viewport, and
#                                  the scratch-port range. Node builtins only,
#                                  no other host module, no browser or runner
#                                  material, and no filesystem or service.
#   app-owned-registry             the product route, selectors, labels,
#                                  actions, and accessibility policy. No
#                                  browser, DOM, or runner material in
#                                  executable code.
#   app-owned-adapter              the lifecycle adapter over an injected
#                                  driver. Same code-level restriction as the
#                                  registry: the browser never arrives through
#                                  an import here.
#   browser-bearing-host-runtime   the row producer and the negative mutations.
#                                  These MAY drive a page, and they must take
#                                  every route, selector, label, viewport, and
#                                  scratch port from an owner rather than
#                                  declaring one.
#
# Runs with node --test inside the declared Fairtest product-contract command.
expectedExportCount: 70
exports:
  - name: fairtest-runtime-fairtest_repo_root
    file: fairtest-runtime.mjs
    symbol: FAIRTEST_REPO_ROOT
    owner: runtime-constants-owner
  - name: fairtest-runtime-fairtest_app_host
