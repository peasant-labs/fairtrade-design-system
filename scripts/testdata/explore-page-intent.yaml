# Named permutations for the mounted commons Explore pagination-intent contract.
# Each case builds a payload (rowProviders -> transcript rows, total, limit,
# seedPage) and drives the real surface through steps. A step is one of:
#   seedCheck : assert the mounted seed without interacting (always the first step)
#   page      : click the pager control for `arg`
#   stale     : the host rerenders with response metadata page = `arg` (rows kept)
#   provider  : toggle the FacetRail provider named `arg`
# Every step asserts the pager's current-page marker (expectCurrent), the last
# emitted navigation intent (expectLastEmitted), and whether the step emitted a
# new intent (expectNewEmission).
cases:
  - name: stale response page cannot rewrite a newer user page
    rowProviders: [claude-code, gemini-cli, opencode, claude-code]
    total: 12
    limit: 4
    seedPage: 1
    steps:
      - {action: seedCheck, arg: none, expectCurrent: 1, expectLastEmitted: 1, expectNewEmission: true}
      - {action: page, arg: 2, expectCurrent: 2, expectLastEmitted: 2, expectNewEmission: true}
      - {action: stale, arg: 1, expectCurrent: 2, expectLastEmitted: 2, expectNewEmission: false}
  - name: late out-of-order responses never supersede the latest intent
    rowProviders: [claude-code, gemini-cli, opencode, claude-code]
    total: 12
    limit: 4
    seedPage: 1
    steps:
      - {action: seedCheck, arg: none, expectCurrent: 1, expectLastEmitted: 1, expectNewEmission: true}
      - {action: page, arg: 2, expectCurrent: 2, expectLastEmitted: 2, expectNewEmission: true}
      - {action: page, arg: 3, expectCurrent: 3, expectLastEmitted: 3, expectNewEmission: true}
      - {action: stale, arg: 2, expectCurrent: 3, expectLastEmitted: 3, expectNewEmission: false}
      - {action: stale, arg: 1, expectCurrent: 3, expectLastEmitted: 3, expectNewEmission: false}
  - name: payload seeds a non-first starting page exactly once
    rowProviders: [claude-code, gemini-cli, opencode, claude-code]
    total: 20
    limit: 4
    seedPage: 3
    steps:
      - {action: seedCheck, arg: none, expectCurrent: 3, expectLastEmitted: 3, expectNewEmission: true}
      - {action: stale, arg: 1, expectCurrent: 3, expectLastEmitted: 3, expectNewEmission: false}
      - {action: page, arg: 4, expectCurrent: 4, expectLastEmitted: 4, expectNewEmission: true}
  - name: absent payload page defaults to the first page
    rowProviders: [claude-code, gemini-cli, opencode, claude-code]
    total: 8
    limit: 4
    seedPage: 0
    steps:
      - {action: seedCheck, arg: none, expectCurrent: 1, expectLastEmitted: 1, expectNewEmission: true}
  - name: a filter change returns to the first page once
    rowProviders: [claude-code, gemini-cli, opencode, gemini-cli]
    total: 12
    limit: 4
    seedPage: 1
    steps:
      - {action: seedCheck, arg: none, expectCurrent: 1, expectLastEmitted: 1, expectNewEmission: true}
      - {action: page, arg: 3, expectCurrent: 3, expectLastEmitted: 3, expectNewEmission: true}
      - {action: provider, arg: gemini-cli, expectCurrent: 1, expectLastEmitted: 1, expectNewEmission: true}
facetCases:
  - {name: explicit-harness-facets-later-page, rowProviders: [codex, codex], harnessFacets: [codex:24, claude-code:3], action: mount, arg: none, response: {rowProviders: [codex, codex], total: 12}, expectedProviders: [all:27, codex:24, claude-code:3], expectedProvider: all, expectedPage: 2, expectedQuery: '', expectedOrder: recent, expectedTopics: [], expectTags: true}
  - {name: explicit-harness-facets-pagination, rowProviders: [codex, codex], harnessFacets: [codex:24, claude-code:3], action: page, arg: 3, response: {rowProviders: [claude-code], total: 12}, expectedProviders: [all:27, codex:24, claude-code:3], expectedProvider: all, expectedPage: 3, expectedQuery: '', expectedOrder: recent, expectedTopics: [], expectTags: true}
  - {name: explicit-harness-facets-sort, rowProviders: [codex, codex], harnessFacets: [codex:24, claude-code:3], action: order, arg: tokens, response: {rowProviders: [claude-code, codex], total: 12}, expectedProviders: [all:27, codex:24, claude-code:3], expectedProvider: all, expectedPage: 1, expectedQuery: '', expectedOrder: tokens, expectedTopics: [], expectTags: true}
  - {name: explicit-harness-facets-zero-results, rowProviders: [codex], harnessFacets: [codex:24, claude-code:3], action: search, arg: unmatched, response: {rowProviders: [], total: 0}, expectedProviders: [all:27, codex:24, claude-code:3], expectedProvider: all, expectedPage: 1, expectedQuery: unmatched, expectedOrder: recent, expectedTopics: [], expectTags: true}
  - {name: explicit-empty-harness-facets, rowProviders: [codex], harnessFacets: [], action: mount, arg: none, response: {rowProviders: [codex], total: 12}, expectedProviders: [all:0], expectedProvider: all, expectedPage: 2, expectedQuery: '', expectedOrder: recent, expectedTopics: [], expectTags: true}
  - {name: missing-harness-facets-compatibility, rowProviders: [codex, codex, claude-code], harnessFacets: absent, action: mount, arg: none, response: {rowProviders: [codex, codex, claude-code], total: 12}, expectedProviders: [all:3, codex:2, claude-code:1], expectedProvider: all, expectedPage: 2, expectedQuery: '', expectedOrder: recent, expectedTopics: [], expectTags: true}
  - {name: explicit-harness-facets-all-count, rowProviders: [codex], harnessFacets: [codex:24, claude-code:3], action: mount, arg: none, response: {rowProviders: [codex], total: 12}, expectedProviders: [all:27, codex:24, claude-code:3], expectedProvider: all, expectedPage: 2, expectedQuery: '', expectedOrder: recent, expectedTopics: [], expectTags: true}
  - {name: explicit-harness-facet-selection, rowProviders: [codex], harnessFacets: [codex:24, claude-code:3], action: provider, arg: claude-code, response: {rowProviders: [claude-code], total: 3}, expectedProviders: [all:27, codex:24, claude-code:3], expectedProvider: claude-code, expectedPage: 1, expectedQuery: '', expectedOrder: recent, expectedTopics: [], expectTags: true}
  - {name: explicit-harness-facets-preserve-tags, rowProviders: [codex], harnessFacets: [codex:24, claude-code:3], action: topic, arg: discovery, response: {rowProviders: [codex], total: 4}, expectedProviders: [all:27, codex:24, claude-code:3], expectedProvider: all, expectedPage: 1, expectedQuery: '', expectedOrder: recent, expectedTopics: [discovery], expectTags: true}
