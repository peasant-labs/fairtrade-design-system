expectedCaseCount: 4
expectedMutationCount: 2
componentCase: turn-override
cases:
  - name: turn-override
    payload:
      id: turn-override
      harness: claude-code
      startTime: '2026-08-11T08:00:00Z'
      endTime: '2026-08-11T08:01:00Z'
      durationMins: 1
      totalTokens: 20
      tokensIn: 12
      tokensOut: 8
      turnCount: 1
      toolCallCount: 0
      model: Session/Default-V1
      turns:
        - index: 0
          role: assistant
          content: explicit turn model
          timestamp: '2026-08-11T08:00:00Z'
          depth: 0
          model: Turn/Explicit-V2
    expected:
      models:
        - Turn/Explicit-V2
      modelProperties:
        - true
  - name: session-fallback
    payload:
      id: session-fallback
      harness: gemini-cli
      startTime: '2026-08-11T09:00:00Z'
      endTime: '2026-08-11T09:01:00Z'
      durationMins: 1
      totalTokens: 20
      tokensIn: 12
      tokensOut: 8
      turnCount: 1
      toolCallCount: 0
      model: Session/Default-V3
      turns:
        - index: 0
          role: assistant
          content: inherited session model
          timestamp: '2026-08-11T09:00:00Z'
          depth: 0
    expected:
      models:
        - Session/Default-V3
      modelProperties:
        - true
  - name: mixed-turns
    payload:
      id: mixed-turns
      harness: codex
      startTime: '2026-08-11T10:00:00Z'
      endTime: '2026-08-11T10:03:00Z'
      durationMins: 3
      totalTokens: 60
      tokensIn: 36
      tokensOut: 24
      turnCount: 3
      toolCallCount: 0
      model: Session/Fallback-V5
      turns:
        - index: 0
          role: user
          content: mixed model request
          timestamp: '2026-08-11T10:00:00Z'
          depth: 0
        - index: 1
          role: assistant
          content: explicit mixed response
          timestamp: '2026-08-11T10:01:00Z'
          depth: 0
          model: Turn/Explicit-V6
        - index: 2
          role: assistant
          content: fallback mixed response
          timestamp: '2026-08-11T10:02:00Z'
          depth: 0
    expected:
      models:
        - Session/Fallback-V5
        - Turn/Explicit-V6
        - Session/Fallback-V5
      modelProperties:
        - true
        - true
        - true
  - name: total-absence
    payload:
      id: total-absence
      harness: opencode
      startTime: '2026-08-11T11:00:00Z'
      endTime: '2026-08-11T11:01:00Z'
      durationMins: 1
      totalTokens: 20
      tokensIn: 12
      tokensOut: 8
      turnCount: 1
      toolCallCount: 0
      turns:
        - index: 0
          role: assistant
          content: no model metadata
          timestamp: '2026-08-11T11:00:00Z'
          depth: 0
    expected:
      models:
        - null
      modelProperties:
        - false
mutations:
  - name: explicit-turn-model-must-win
    find: const effectiveModel = t.model ?? payload.model
    replace: const effectiveModel = payload.model
    expectedError: 'turn-override: models'
  - name: session-model-must-fallback
    find: const effectiveModel = t.model ?? payload.model
    replace: const effectiveModel = t.model
    expectedError: 'session-fallback: models'
