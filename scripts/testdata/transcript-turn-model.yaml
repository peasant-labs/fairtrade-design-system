      id: sticky-carry-forward
      harness: claude-code
      startTime: '2026-08-12T08:00:00Z'
      endTime: '2026-08-12T08:04:00Z'
      durationMins: 4
      totalTokens: 40
      tokensIn: 20
      tokensOut: 20
      turnCount: 4
      toolCallCount: 0
      model: anthropic/claude-fable-5
      turns:
        - { index: 0, role: assistant, content: first A, timestamp: '2026-08-12T08:00:00Z', depth: 0, observedModel: anthropic/claude-fable-5 }
        - { index: 1, role: assistant, content: missing after A, timestamp: '2026-08-12T08:01:00Z', depth: 0 }
        - { index: 2, role: assistant, content: first B, timestamp: '2026-08-12T08:02:00Z', depth: 0, observedModel: anthropic/claude-opus-4-8 }
        - { index: 3, role: assistant, content: missing after B, timestamp: '2026-08-12T08:03:00Z', depth: 0 }
    options: null
    expect:
      indices: [0, 1, 2, 3]
      effectiveModels: [anthropic/claude-fable-5, anthropic/claude-fable-5, anthropic/claude-opus-4-8, anthropic/claude-opus-4-8]
      changedFrom: [null, null, anthropic/claude-fable-5, null]
      markerCount: 1
