# Required-NAME manifest for transcript-ledger-turns.yaml: deletion protection. The gate
# (scripts/transcript-ledger-turns.test.mjs) asserts each family's names equal these lists
# exactly, as sets, and each case's `kind` against `requiredCaseKinds`, so a case cannot be
# re-pointed at a cheaper assertion while its name stays in place. Membership is asserted,
# never a bare count.
requiredSummaryNames:
  - mixed work counts commands files edits failures and duration
  - singular counts read as one
  - a turn without counting tools falls back to its call count
  - one file touched twice counts once
  - a search scope contributes no files
  - a fetch scope contributes no files
  - a task scope contributes no files
  - a read and a search of the same path count one file
  - a read with a path keeps its call count in the meta
  - a non-zero bash exit counts as a failure
  - an errored read counts as a failure
  - two failed tools count two failures
  - a bash error at exit zero counts one failure
  - blank paths and unknown durations are left out
  - an empty tool list summarizes to nothing
requiredThinkingDurationNames:
  - thinking after a prompt takes the whole gap
  - the previous turn's tools run before the thinking starts
  - tools that outlast the gap leave the time out
  - an unrecorded tool duration adds nothing
  - an unknown previous time leaves the time out
  - a thinking entry with nothing before it has no time
requiredCaseNames:
  - classic keeps the turn's tools flat
  - ledger groups one turn's tools into one panel
  - ledger tool rows open and close
  - the system category hides and restores only system turns
  - compact mode collapses action lists without opening their contents
  - clicking prose selects that turn without making its action list a turn
  - rapid turn keys recover from both scroll limits
  - ledger renders a system turn as a row
  - the system row disclosure is controllable by the host
  - a search hit opens the system row
  - the system row preview reads plain text
  - ledger keeps a turn's thinking disclosure
  - a turn without tools has no work group
  - the ledger head carries only the role line and its controls
  - host turn actions survive on every role
  - a role change draws one rule and the first turn draws none
  - a user turn's actions share one block after its first prose turn
  - a turn with no words is inline detail, not a card
  - the system turn's heading follows the page level
requiredCaseKinds:
  classic keeps the turn's tools flat: classic
  ledger groups one turn's tools into one panel: ledger-panel
  ledger tool rows open and close: ledger-disclosure
  the system category hides and restores only system turns: system-filter
  compact mode collapses action lists without opening their contents: compact-actions
  clicking prose selects that turn without making its action list a turn: turn-selection
  rapid turn keys recover from both scroll limits: turn-keys
  ledger renders a system turn as a row: system
  the system row disclosure is controllable by the host: system-controlled
  a search hit opens the system row: system-reveal
  the system row preview reads plain text: system-preview
  ledger keeps a turn's thinking disclosure: thinking
  a turn without tools has no work group: no-tools
  the ledger head carries only the role line and its controls: ledger-head
  host turn actions survive on every role: host-actions
  a role change draws one rule and the first turn draws none: turn-rules
  a user turn's actions share one block after its first prose turn: model-actions
  a turn with no words is inline detail, not a card: detail-turns
  the system turn's heading follows the page level: heading-level

# Production mutations the gate must kill (scripts/parts-mutations.mjs).
requiredMutationNames:
  - rapid keys read a stale selection
  - scroll feedback overrides requested turns
  - clicking a turn no longer selects it
  - action lists start collapsed again
  - compact mode stops reaching action lists
  - the system category ignores its checkbox
  - Bash input regains its icon
  - the thinking time ignores the previous turn's tools
  - the thinking row loses its time
  - the ledger keeps the classic tool rows
  - the panel ignores a tool's open state
  - the system row ignores its disclosure
  - the system row ignores the search reveal
  - the system row prints its Markdown source
  - the ledger draws no role rule
  - the ledger head regains a collapse control
  - a wordless turn gets a card again
  - a folded turn keeps its own work beside the block
  - a user turn does not start a new block
  - the block sits on the group's last turn
  - the block header counts calls
  - one command is replaced by an equal-kind equal-duration command
  - hidden source boundaries are lost before grouping
  - stale open children override explicit parent collapse
  - relocated search returns to the source article
  - positioning-only action reveal selects its source
  - keyboard action sources lose their insertion position
mutations:
  - name: positioning-only action reveal selects its source
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "if (searchReveal.select) selectTurn(searchReveal.turn)"
    replace: "selectTurn(searchReveal.turn)"
    expectedDiagnostic: "positioning must not select"
  - name: keyboard action sources lose their insertion position
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "    if (cur < 0) {"
    replace: "    if (false) {"
    expectedDiagnostic: "selects directional eligible neighbor"
  - name: hidden source boundaries are lost before grouping
    file: src/ui/transcript/action-groups.js
    find: "for (const source of turns)"
    replace: "for (const source of visibleTurns)"
    expectedDiagnostic: "exact distinct action membership"
  - name: stale open children override explicit parent collapse
    file: src/ui/transcript/WorkGroup.jsx
    find: "  const tools = turns.flatMap((turn) => turn.toolCalls ?? [])\n  const shown = open\n"
    replace: "  const tools = turns.flatMap((turn) => turn.toolCalls ?? [])\n  const shown = open || tools.some(tool => openTools[tool.id])\n"
    expectedDiagnostic: "the head must close a block whose child is open"
  - name: relocated search returns to the source article
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "? actionRefs.current.get(`${searchReveal.turn}:${searchReveal.where}`)"
    replace: "? turnRefs.current[searchReveal.turn]"
    expectedDiagnostic: "actual rendered row destination"
  - name: rapid keys read a stale selection
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "const cur = ids.indexOf(activeTurnRef.current)"
    replace: "const cur = ids.indexOf(activeTurn)"
    expectedDiagnostic: "rapid turn keys recover from both scroll limits: the burst must select"
  - name: scroll feedback overrides requested turns
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "if (navigationTargetRef.current != null && visibleTurns.some(t => t.index === navigationTargetRef.current)) return"
    replace: "if (false) return"
    expectedDiagnostic: "rapid turn keys recover from both scroll limits: the burst must select"
  - name: clicking a turn no longer selects it
    file: src/ui/transcript/TurnCard.jsx
    find: "onClick={ledger && onSelect ? () => onSelect(turn.index) : undefined}"
    replace: "onClick={undefined}"
    expectedDiagnostic: "clicking the prose must select its own turn"
  - name: action lists start collapsed again
    file: src/ui/transcript/WorkGroup.jsx
    find: "  const [open, setOpen] = useState(!compact)"
    replace: "  const [open, setOpen] = useState(false)"
    expectedDiagnostic: "the action list starts expanded"
  - name: compact mode stops reaching action lists
    file: src/ui/transcript/TurnCard.jsx
    find: "expandAll={expandAll} compact={compact}"
    replace: "expandAll={expandAll} compact={false}"
    expectedDiagnostic: "compact mode must collapse the action list"
  - name: the system category ignores its checkbox
    file: src/ui/transcript/filters.js
    find: "  if (turn.role === 'system') return categories.system === false ? null : turn"
    replace: "  if (turn.role === 'system') return turn"
    expectedDiagnostic: "the unchecked system category must hide every system row"
  - name: Bash input regains its icon
    file: src/ui/transcript/ToolBody.jsx
    find: '<div className="txn-term">'
    replace: '<div className="txn-term"><svg aria-hidden="true" />'
    expectedDiagnostic: "Bash input must contain no icon"
  - name: the thinking time ignores the previous turn's tools
    file: src/ui/transcript/adapter.js
    find: "  const ms = Date.parse(turn.timestamp) - (Date.parse(previous.timestamp) + tools)"
    replace: "  const ms = Date.parse(turn.timestamp) - Date.parse(previous.timestamp)"
    expectedDiagnostic: "the previous turn's tools run before the thinking starts: the thinking time must be 3000"
  - name: the thinking row loses its time
    file: src/ui/transcript/Thinking.jsx
    find: "          {duration && <span className=\"tnum txn-tc-dur\">{duration}</span>}"
    replace: "          {null}"
    expectedDiagnostic: "the row must show the time spent"
  - name: a folded turn keeps its own work beside the block
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "const suppressWork = foldedWork.has(t.index)"
    replace: "const suppressWork = false"
    expectedDiagnostic: "no ledger turn keeps a work row of its own beside the block"
  - name: a user turn does not start a new block
    file: src/ui/transcript/action-groups.js
    find: "if (source.role === 'user') { flush(); continue }"
    replace: "if (source.role === 'user') continue"
    expectedDiagnostic: "a user turn starts a new block"
  - name: the block sits on the group's last turn
    file: src/ui/transcript/action-groups.js
    find: "const owner = anchor ?? work[0]"
    replace: "const owner = work[work.length - 1]"
    expectedDiagnostic: "the user turn's block must sit after its first prose turn"
  - name: one command is replaced by an equal-kind equal-duration command
    file: src/ui/transcript/WorkGroup.jsx
    find: "                  tool={tool}"
    replace: "                  tool={tools[0]}"
    expectedDiagnostic: "exact distinct action membership"
  - name: the block header counts calls
    file: src/ui/transcript/WorkGroup.jsx
    find: "const label = workActionsLabel(workSummary(tools))"
    replace: "const label = [workCountLabel(workSummary(tools)), workMetaLabel(workSummary(tools))].filter(Boolean).join(', ')"
    expectedDiagnostic: "the block header must read"
  - name: the ledger keeps the classic tool rows
    file: src/ui/transcript/TurnCard.jsx
    find: "  const workBlock = ledger && turn.role !== 'system' && !suppressWork && (hasWork || modelActions?.length) ? ("
    replace: "  const workBlock = false && (hasWork || modelActions?.length) ? ("
    expectedDiagnostic: "the turn with tools must carry one model-actions block"
  - name: the panel ignores a tool's open state
    file: src/ui/transcript/WorkGroup.jsx
    find: "                  showChevron={false}\n                  open={expandAll || !!openTools[tool.id]}"
    replace: "                  showChevron={false}\n                  open={false}"
    expectedDiagnostic: "ledger tool rows open and close: the clicked row must stay open"
  - name: the system row ignores its disclosure
    file: src/ui/transcript/SystemRow.jsx
    find: "onClick={() => setOpen(!open)}"
    replace: "onClick={() => {}}"
    expectedDiagnostic: "ledger renders a system turn as a row: clicking the row must reveal the recorded text"
  - name: the system row ignores the search reveal
    file: src/ui/transcript/SystemRow.jsx
    find: "    if (revealRequest) setOpen(true)"
    replace: "    if (false) setOpen(true)"
    expectedDiagnostic: "a search hit opens the system row: the revealed system row must open"
  - name: the system row prints its Markdown source
    file: src/ui/transcript/SystemRow.jsx
    find: "  const preview = plainTextPreview(content)"
    replace: "  const preview = String(content ?? '').replace(/\\s+/g, ' ').trim()"
    expectedDiagnostic: "the system row preview reads plain text: the preview must read the rendered words"
  - name: the ledger draws no role rule
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "{ledger && prev && prev.role !== t.role && <hr className=\"txn-turn-rule\" aria-hidden=\"true\" />}"
    replace: "{false && <hr className=\"txn-turn-rule\" aria-hidden=\"true\" />}"
    expectedDiagnostic: "a role change draws one rule and the first turn draws none: the ledger must draw one rule at each role change"
  - name: the ledger head regains a collapse control
    file: src/ui/transcript/TurnCard.jsx
    find: "          {anchorButton}\n          {renderActions ? renderActions(turn) : null}"
    replace: "          {anchorButton}<button type=\"button\" className=\"txn-turn-disclosure\" aria-expanded=\"true\">collapse</button>\n          {renderActions ? renderActions(turn) : null}"
    expectedDiagnostic: "the ledger head must omit the built-in"
  - name: a wordless turn gets a card again
    file: src/ui/transcript/TurnCard.jsx
    find: "  const ledgerDetail = ledger && !isUser && !hasProse"
    replace: "  const ledgerDetail = false"
    expectedDiagnostic: "a turn with no words is inline detail, not a card: a turn with no words must draw no card head"
