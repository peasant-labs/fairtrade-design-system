svgProps:
  - name: safe text and path presentation attributes
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50"><text font-style="normal" font-weight="400" alignment-baseline="middle" transform-origin="center">Label</text><path fill-rule="evenodd" clip-rule="evenodd" d="M0 0 L10 10"/></svg>'
    expectedAttributes:
      text: { font-style: normal, font-weight: '400', alignment-baseline: middle, transform-origin: center }
      path: { fill-rule: evenodd, clip-rule: evenodd }
rerender:
  - name: changed source never displays a previous diagram
    first: "flowchart LR\nA[First] --> B[End]"
    second: "flowchart LR\nA[Second] --> B[End]"
    unsafe: "flowchart LR\nA --> B\nclick A \"https://evil.example\""
accepted:
  - name: cmyk-user-flowchart
    source: |-
      flowchart TD
          A["Color panel: CMYK sliders<br/>apply_values(v)"] --> B["set_color(rgb)<br/>tools.foreground = sRGB"]
          B --> C{"remember_cmyk?"}
          C -->|"no (before #9037)"| D["sRGB only"]
          C -->|"yes (after #9037)"| E["cmyk_picks: rgb to C,M,Y,K"]
          D --> F["edit.fill: color_source"]
          E --> F
          F --> G{"picked_cmyk(rgb)?"}
          G -->|"hit"| H["Source::Cmyk<br/>rgba + inks"]
          G -->|"miss"| I["Source::Color<br/>rgba only"]
          H --> J["encode_color<br/>CMYK target: write inks"]
          I --> K["from_rgba_into<br/>rgb_to_cmyk(doc profile)"]
          J --> L["exact C0 M0 Y0 K100"]
          K --> M["rich black, profile-dependent<br/>(report: 60/51/53/59)"]
  - name: flowchart-linebreaks
    source: |-
      flowchart LR
      A["First<br/>Second"] --> B["Third<br>Fourth"]
  - name: flowchart
    source: |-
      flowchart LR
      A[Source Case] --> B[Destination]
  - name: sequence
    source: |-
      sequenceDiagram
      participant A as Alice
      participant B as Bob
      A->>B: Hello Bob
  - name: pie
    source: |-
      pie
      "dogs" : 3
  - name: class
    source: |-
      classDiagram
      Animal <|-- Cat
rejected:
  - name: cmyk-linebreak-event
    source: |-
      flowchart TD
          A["Color panel: CMYK sliders<br onload=malicious()>apply_values(v)"] --> B["set_color(rgb)<br/>tools.foreground = sRGB"]
  - name: cmyk-linebreak-script
    source: |-
      flowchart TD
          A["Color panel: CMYK sliders<br/><script>malicious()</script>apply_values(v)"] --> B["set_color(rgb)<br/>tools.foreground = sRGB"]
  - name: linebreak-event
    source: 'flowchart LR\nA["First<br onload=alert(1)>Second"] --> B'
  - name: linebreak-followed-by-script
    source: 'flowchart LR\nA["First<br/><script>alert(1)</script>"] --> B'
  - name: linebreak-attribute
    source: 'flowchart LR\nA["First<br/ onload=alert(1)>Second"] --> B'
  - name: prototype-metadata
    source: |-
      sequenceDiagram
      participant A@{ "__proto__": {"icon": "/mermaid-probe-image.png"} }
  - name: directive
    source: |-
      %%{init: {"securityLevel": "loose"}}%%
      flowchart LR
      A --> B
  - name: frontmatter
    source: |-
      ---
      config: evil
      ---
      flowchart LR
      A --> B
  - name: link
    source: |-
      flowchart LR
      A --> B
      click A "https://evil.example"
  - name: html
    source: |-
      flowchart LR
      A[<img src=https://evil.example>] --> B
  - name: entity
    source: |-
      flowchart LR
      A[&#60;script&#62;] --> B
  - name: styling
    source: |-
      flowchart LR
      A --> B
      style A fill:red
  - name: html-image
    source: |-
      flowchart LR
      A@{ img: "https://evil.example/a.png" }
  - name: callback
    source: |-
      flowchart LR
      A --> B
      click A call malicious()
badSvg:
  - name: script
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><script/></svg>'
  - name: foreign-object
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><foreignObject/></svg>'
  - name: image
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><image href="https://evil.example"/></svg>'
  - name: event
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><path onload="alert(1)"/></svg>'
  - name: external-reference
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><path marker-end="url(https://evil.example/a)"/></svg>'
  - name: missing-reference
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><path marker-end="url(#missing)"/></svg>'
  - name: external-style
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><path style="fill:url(https://evil.example/a)"/></svg>'
  - name: hostile-html-fallback
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><switch><foreignObject x="0" y="0" width="1" height="1"><div xmlns="http://www.w3.org/1999/xhtml"><script/></div></foreignObject><text>label</text></switch></svg>'
  - name: prototype-icon-model
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><path style="fill:url(//evil.example/a)"/></svg>'
