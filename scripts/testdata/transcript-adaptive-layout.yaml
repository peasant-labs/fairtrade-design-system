# The demo supplies 64px of page insets, so 1144px leaves the viewer 1080px.
cases:
  - {name: wide room for both rails, width: 1920, behavior: stable}
  - {name: intermediate room for one rail, width: 1440, behavior: intermediate}
  - {name: constrained reader, width: 1200, behavior: shrink}
  - {name: below adaptive breakpoint, width: 1023, behavior: boundary, rails: false}
  - {name: adaptive breakpoint, width: 1024, behavior: boundary, rails: false}
  - {name: below rail breakpoint, width: 1143, behavior: boundary, rails: false}
  - {name: rail breakpoint, width: 1144, behavior: boundary, rails: true}
  - {name: above rail breakpoint, width: 1145, behavior: boundary, rails: true}
  - {name: phone drawer, width: 390, behavior: drawer}
themes: [dark, light]
motion: [reduce, no-preference]

# The canonical ledger width range starts at this many pixels.
minimumReaderWidth: 600
