payload:
  id: action-ownership
  harness: claude-code
  startTime: '2026-10-01T10:00:00Z'
  turns:
    - {index: 0, role: user, content: First request, depth: 0}
    - index: 1
      role: assistant
      content: First owner prose
      depth: 0
      toolCalls:
        - {id: alpha, name: Bash, arguments: '{"command":"printf alpha-command"}', result: 'alpha-output', durationMs: 1000, isError: true}
    - index: 2
      role: assistant
      content: Later prose destination
      depth: 0
      toolCalls:
        - {id: beta, name: Bash, arguments: '{"command":"printf beta-command"}', result: 'beta-output', durationMs: 1000, isError: true}
    - index: 3
      role: assistant
      content: ''
      depth: 0
      toolCalls:
        - {id: gamma, name: Bash, arguments: '{"command":"printf gamma-command"}', result: 'gamma-output', durationMs: 1000, isError: true}
    - {index: 4, role: assistant, entryType: thinking, content: 'Distinct amber thinking evidence', depth: 0}
    - {index: 5, role: user, content: Second request, depth: 0}
    - index: 6
      role: assistant
      content: Second owner prose
      depth: 0
      toolCalls:
        - {id: delta, name: Bash, arguments: '{"command":"printf delta-command"}', result: 'delta-output', durationMs: 1000, isError: true}
    - index: 7
      role: assistant
      content: ''
      depth: 0
      toolCalls:
        - {id: epsilon, name: Bash, arguments: '{"command":"printf epsilon-command"}', result: 'epsilon-output', durationMs: 1000, isError: true}
    - {index: 8, role: user, content: Third request, depth: 0}
    - index: 9
      role: assistant
      content: ''
      depth: 0
      toolCalls:
        - {id: zeta, name: Bash, arguments: '{"command":"printf zeta-command"}', result: 'zeta-output', durationMs: 1000, isError: true}
    - index: 10
      role: assistant
      content: ''
      depth: 0
      toolCalls:
        - {id: eta, name: Bash, arguments: '{"command":"printf eta-command"}', result: 'eta-output', durationMs: 1000, isError: true}
groups:
  - {name: the first prose turn owns only its own work, owner: 1, tools: [alpha], thinking: []}
  - {name: the second prose turn owns the wordless work that follows it, owner: 2, tools: [beta, gamma], thinking: [Distinct amber thinking evidence]}
  - {name: second request keeps its own distinct work, owner: 6, tools: [delta, epsilon], thinking: []}
  - {name: third request anchors its wordless work, owner: 9, tools: [zeta, eta], thinking: []}
disclosures:
  - {name: parent hiding retains two tools and Think, mode: parent}
  - {name: compact hiding retains two tools and Think, mode: compact}
  - {name: explicit parent hiding wins over expand all, mode: expand-all}
filters:
  - {name: hidden prompts retain original action ownership, kind: categories, key: prompts}
  - {name: hidden responses project work without leaking prose, kind: categories, key: responses}
  - {name: tag-hidden boundaries retain original action ownership, kind: tags, key: errors}
navigation:
  - {name: later prose tool search reaches the rendered tool, turn: 2, where: beta, query: beta-output}
  - {name: wordless tool search reaches the rendered tool, turn: 3, where: gamma, query: gamma-output}
  - {name: thinking search reaches the rendered thinking, turn: 4, where: thinking, query: Distinct amber}
  - {name: ordinary prose search stays at the prose source, turn: 2, where: body, query: Later prose destination}
initial:
  - {name: wordless initial position reveals its relocated tool, turn: 3, where: gamma, activeTurn: 0, expectedCallbacks: [], expectedHistory: [], scrollBehavior: auto}
  - {name: wordless initial position reveals its relocated thinking, turn: 4, where: thinking, activeTurn: 0, expectedCallbacks: [], expectedHistory: [], scrollBehavior: auto}
  - {name: prose initial position preserves independent selection, turn: 2, where: body, activeTurn: 0, expectedCallbacks: [], expectedHistory: [], scrollBehavior: auto}
keyboard:
  - name: wordless tool search steps forward and reverses at the last card
    query: epsilon-output
    source: 7
    steps: [{key: j, expected: 8}, {key: j, expected: 8}, {key: k, expected: 6}, {key: k, expected: 5}, {key: j, expected: 6}]
  - name: wordless tool search steps backward and reverses
    query: epsilon-output
    source: 7
    steps: [{key: k, expected: 6}, {key: j, expected: 8}, {key: k, expected: 6}]
  - name: first group wordless tool steps to the next request
    query: gamma-output
    source: 3
    steps: [{key: ArrowDown, expected: 5}, {key: ArrowUp, expected: 2}, {key: ArrowDown, expected: 5}]
  - name: Think search steps backward through the first card and reverses
    query: Distinct amber
    source: 4
    steps: [{key: ArrowUp, expected: 2}, {key: k, expected: 1}, {key: k, expected: 0}, {key: k, expected: 0}, {key: j, expected: 1}]
  - name: Think search steps forward to the next request
    query: Distinct amber
    source: 4
    steps: [{key: j, expected: 5}, {key: k, expected: 2}]
  - name: filtered prompts remain excluded from action search stepping
    query: epsilon-output
    source: 7
    hidePrompts: true
    steps: [{key: ArrowUp, expected: 6}, {key: ArrowUp, expected: 2}, {key: ArrowDown, expected: 6}, {key: ArrowDown, expected: 6}]

# A leading wordless run has no prose of its own in the segment, so it anchors at its own first
# work turn and never moves forward into the prose turn that follows it.
leadingWordlessRuns:
  - name: a leading wordless run stays before the first prose turn
    payload:
      id: leading-wordless
      harness: claude-code
      startTime: '2026-10-01T10:00:00Z'
      turns:
        - {index: 0, role: user, content: Opening request, depth: 0}
        - index: 1
          role: assistant
          content: ''
          depth: 0
          toolCalls:
            - {id: w-one, name: Bash, arguments: '{"command":"printf w-one-command"}', result: 'w-one-output', durationMs: 1000}
        - index: 2
          role: assistant
          content: Prose after the leading work
          depth: 0
          toolCalls:
            - {id: w-two, name: Bash, arguments: '{"command":"printf w-two-command"}', result: 'w-two-output', durationMs: 1000}
        - index: 3
          role: assistant
          content: ''
          depth: 0
          toolCalls:
            - {id: w-three, name: Bash, arguments: '{"command":"printf w-three-command"}', result: 'w-three-output', durationMs: 1000}
    groups:
      - {name: the leading wordless run anchors at its own first work turn, owner: 1, tools: [w-one], thinking: []}
      - {name: the first prose turn owns only the work that follows it, owner: 2, tools: [w-two, w-three], thinking: []}

# The run boundary comes from the source prose, so hiding the responses leaves the hidden prose
# turn as the anchor of its own run. Its work must stay at the run's first visible work turn
# instead of moving forward into the later prose turn's run.
hiddenSourceProseRuns:
  - name: a hidden source-prose anchor hands its run to its first visible work turn
    payload:
      id: hidden-source-prose
      harness: claude-code
      startTime: '2026-10-01T10:00:00Z'
      turns:
        - {index: 0, role: user, content: Opening request, depth: 0}
        - {index: 1, role: assistant, content: Hidden anchor prose, depth: 0}
        - index: 2
          role: assistant
          content: ''
          depth: 0
          toolCalls:
            - {id: h-one, name: Bash, arguments: '{"command":"printf h-one-command"}', result: 'h-one-output', durationMs: 1000}
        - index: 3
          role: assistant
          content: Visible later prose
          depth: 0
          toolCalls:
            - {id: h-two, name: Bash, arguments: '{"command":"printf h-two-command"}', result: 'h-two-output', durationMs: 1000}
    visibleGroups:
      - {name: a renderable prose anchor owns its run, owner: 1, tools: [h-one], thinking: []}
      - {name: the later prose turn owns its own run, owner: 3, tools: [h-two], thinking: []}
    hiddenGroups:
      - {name: a hidden prose anchor hands its run to the first visible work turn, owner: 2, tools: [h-one], thinking: []}
      - {name: the later prose turn keeps its own work after a hidden anchor, owner: 3, tools: [h-two], thinking: []}

# The reported 55-turn session with 91 tool calls: three user segments that split into ten prose
# runs. The old rule drew three blocks (26, 26, 39); the new rule draws 1+25, 7+19, then
# 5+12+12+1+6+3, and the sum stays 91.
distributions:
  - name: the 91-tool session keeps ten runs
    segments:
      - [1, 25]
      - [7, 19]
      - [5, 12, 12, 1, 6, 3]
    expectedCounts: [1, 25, 7, 19, 5, 12, 12, 1, 6, 3]
    total: 91
