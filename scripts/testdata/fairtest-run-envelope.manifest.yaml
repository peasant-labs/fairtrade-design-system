# Required-name manifest for the Fairtest run-envelope fixture family.
# Every case below must appear exactly once in
# scripts/testdata/fairtest-run-envelope.yaml. The fixture-shape mutations
# protect the family record; the workflow mutations protect the CI guard by
# editing the real .github/workflows/ci.yml text and requiring the guard to
# fail for its intended field.
expectedCaseCount: 38
requiredCaseNames:
  - ci-key-set-is-exact
  - ci-key-set-equals-the-evidence-policy-rows
  - policy-rows-reject-a-dropped-required-row
  - ci-key-set-rejects-a-missing-key
  - ci-key-set-rejects-an-extra-key
  - ci-key-set-rejects-a-local-key
  - local-key-set-is-exact
  - local-key-set-rejects-a-ci-key
  - key-set-rejects-a-duplicate
  - key-set-rejects-an-unknown-mode
  - pre-service-flow-writes-every-owned-subtree
  - init-rejects-a-missing-root
  - init-rejects-a-wrong-root
  - init-rejects-a-prior-root
  - select-rejects-a-prior-selection
  - select-rejects-another-runs-envelope
  - receipt-rejects-a-missing-selection
  - receipt-rejects-a-tampered-envelope-binding
  - preflight-rejects-a-missing-root
  - preflight-rejects-a-missing-envelope
  - preflight-rejects-a-missing-inventory-receipt
  - preflight-rejects-a-missing-selection-receipt
  - preflight-rejects-a-missing-process-receipt
  - preflight-rejects-a-malformed-process-receipt
  - preflight-rejects-a-foreign-process-receipt
  - preflight-rejects-an-unbound-process-receipt
  - preflight-rejects-incomplete-evidence
  - preflight-rejects-a-tampered-selection-digest
  - preflight-rejects-a-local-mode-selection
  - preflight-rejects-an-undeclared-sibling
  - preflight-accepts-a-complete-run
  - verify-rejects-a-prior-evidence-report
  - verify-rejects-a-wrong-root
  - budget-stages-sum-to-the-declared-total
  - envelope-shape-is-pinned
  - workflow-declares-the-pinned-upload-and-always-preflight
  - workflow-orders-the-run-after-builds-and-before-existing-gates
  - workflow-declares-the-bounded-fairtest-budget
expectedMutationCount: 8
requiredMutationNames:
  - deleted-required-case
  - stale-case-name
  - duplicate-case-name
  - dropped-case-check
  - unknown-case-field
  - drifted-ci-key-set
  - drifted-local-key-set
  - trailing-document
mutations:
  - name: deleted-required-case
    kind: delete-record
    target: case:ci-key-set-is-exact
    expectedField: ci-key-set-is-exact
  - name: stale-case-name
    kind: stale-name
    target: case:ci-key-set-is-exact
    value: ci-key-set-renamed
    expectedField: ci-key-set-renamed
  - name: duplicate-case-name
    kind: duplicate-name
    target: case:pre-service-flow-writes-every-owned-subtree
    expectedField: pre-service-flow-writes-every-owned-subtree
  - name: dropped-case-check
    kind: delete-field
    target: case:ci-key-set-is-exact
    field: check
    expectedField: check
  - name: unknown-case-field
    kind: unknown-field
    target: case:ci-key-set-is-exact
    field: timeout
    value: 60
    expectedField: timeout
  - name: drifted-ci-key-set
    kind: bad-value
    target: keySet:ci
    field: keys
    value: [product-dark, product-light, component-dark]
    expectedField: keySets.ci.keys
  - name: drifted-local-key-set
    kind: bad-value
    target: keySet:local
    field: keys
    value: [product-dark]
    expectedField: keySets.local.keys
  - name: trailing-document
    kind: trailing-document
    target: document
    expectedField: document[1]
expectedWorkflowMutationCount: 55
requiredWorkflowMutationNames:
  - workflow-upload-pin-becomes-a-tag
  - workflow-upload-drops-no-files-error
  - workflow-upload-drops-always
  - workflow-upload-retention-unbounded
  - workflow-budget-env-drifts
  - workflow-mounted-target-drifts
  - workflow-mounted-workers-drift
  - workflow-drops-the-verification-step
  - workflow-drops-the-journey-gates
  - workflow-journey-unbounded-workers
  - workflow-journey-adds-filter
  - workflow-journey-drops-project-argument
  - workflow-gates-aggregator-drops-a-need
  - workflow-gates-aggregator-ignores-failure
  - workflow-journey-matrix-excludes-project
  - workflow-journey-skips-step
  - workflow-timeline-drops-mutation
  - workflow-gates-aggregator-suppresses-failure
  - workflow-gates-aggregator-always-passes
  - workflow-journey-drops-project
  - workflow-journey-duplicates-project
  - workflow-journey-skips-timeline
  - workflow-journey-limits-parallelism
  - workflow-journey-serializes-job
  - workflow-journey-duplicates-timeline
  - workflow-renames-fairtest-job
  - workflow-renames-gates-job
  - workflow-journeys-drops-build
  - workflow-fairtest-drops-storybook-build
  - workflow-journey-artifact-collides
  - workflow-drops-the-envelope-guard
  - workflow-drops-the-compat-gate
  - workflow-drops-the-type-program-gate
  - workflow-drops-the-type-coverage-gate
  - workflow-drops-the-paths-gate
  - workflow-drops-the-boundary-gate
  - workflow-drops-the-dispatch-gate
  - workflow-journey-screenshot-policy-drifts
  - workflow-drops-journey-facts
  - workflow-drops-fairtest-facts
  - workflow-drops-catalog-gate
  - workflow-journey-timing-upload-collides
  - workflow-journey-artifacts-upload-collides
  - workflow-fairtest-timing-not-always
  - workflow-router-reason-dropped
  - workflow-timing-merge-dropped
  - workflow-actions-read-dropped
  - workflow-recording-invariant-dropped
  - workflow-theme-fixture-guard-dropped
  - workflow-light-transparency-proof-dropped
  - workflow-facts-becomes-blocking
  - workflow-timing-upload-becomes-blocking
  - workflow-fairtest-timing-attempt-collides
  - workflow-journey-timing-project-collides
  - workflow-journey-artifact-project-collides
workflowMutations:
  - name: workflow-upload-pin-becomes-a-tag
    find: "      - name: Fairtest evidence upload\n        if: always()\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2\n"
    replace: "      - name: Fairtest evidence upload\n        if: always()\n        uses: actions/upload-artifact@v4 # v4.6.2\n"
    expectedField: upload-artifact
  - name: workflow-upload-drops-no-files-error
    find: "          path: ${{ env.FAIRTEST_RUN_ROOT }}\n          if-no-files-found: error\n"
    replace: "          path: ${{ env.FAIRTEST_RUN_ROOT }}\n"
    expectedField: if-no-files-found
  - name: workflow-upload-drops-always
    find: "      - name: Fairtest evidence preflight\n        if: always()\n"
    replace: "      - name: Fairtest evidence preflight\n"
    expectedField: always()
  - name: workflow-upload-retention-unbounded
    find: "          retention-days: 14\n"
    replace: "          retention-days: 90\n"
    expectedField: retention-days
  - name: workflow-budget-env-drifts
    find: "      FAIRTEST_BUDGET_MINUTES: \"12\"\n"
    replace: "      FAIRTEST_BUDGET_MINUTES: \"90\"\n"
    expectedField: FAIRTEST_BUDGET_MINUTES
  - name: workflow-mounted-target-drifts
    find: "        run: pnpm test:fairtest:mounted -- --target=all\n"
    replace: "        run: pnpm test:fairtest:mounted -- --target=product\n"
    expectedField: run
  - name: workflow-mounted-workers-drift
    find: "      FAIRTEST_MOUNTED_WORKERS: \"4\"\n"
    replace: "      FAIRTEST_MOUNTED_WORKERS: \"8\"\n"
    expectedField: FAIRTEST_MOUNTED_WORKERS
  - name: workflow-drops-the-verification-step
    find: "      - name: Fairtest evidence verification\n        run: pnpm test:fairtest:verify\n"
    replace: ''
    expectedField: Fairtest evidence verification
  - name: workflow-drops-the-journey-gates
    find: "      - name: Journey gates\n        run: pnpm journey:ci --workers=3 --project=${{ matrix.project }}\n"
    replace: ''
    expectedField: project
  - name: workflow-journey-unbounded-workers
    find: "        run: pnpm journey:ci --workers=3 --project=${{ matrix.project }}\n"
    replace: "        run: pnpm journey:ci --workers=100% --project=${{ matrix.project }}\n"
    expectedField: project
  - name: workflow-journey-adds-filter
    find: "        run: pnpm journey:ci --workers=3 --project=${{ matrix.project }}\n"
    replace: "        run: pnpm journey:ci --workers=3 --project=${{ matrix.project }} --grep=token\n"
    expectedField: project
  - name: workflow-journey-drops-project-argument
    find: "        run: pnpm journey:ci --workers=3 --project=${{ matrix.project }}\n"
    replace: "        run: pnpm journey:ci --workers=3 --project=dark\n"
    expectedField: project
  - name: workflow-gates-aggregator-drops-a-need
    find: "    needs: [fairtest, journeys]\n"
    replace: "    needs: [fairtest]\n"
    expectedField: needs
  - name: workflow-gates-aggregator-ignores-failure
    find: "          test \"${{ needs.journeys.result }}\" = \"success\"\n"
    replace: ''
    expectedField: needs.result
  - name: workflow-journey-matrix-excludes-project
    find: "        project: [dark, light]\n"
    replace: "        project: [dark, light]\n        exclude:\n          - project: light\n"
    expectedField: matrix.project
  - name: workflow-journey-skips-step
    find: "      - name: Journey gates\n        run:"
    replace: "      - name: Journey gates\n        if: matrix.project == 'dark'\n        run:"
    expectedField: project
  - name: workflow-timeline-drops-mutation
    find: "pnpm test:timeline-rendered && pnpm test:timeline-session-route:mutations"
    replace: "pnpm test:timeline-rendered"
    expectedField: pnpm test:timeline-rendered
  - name: workflow-gates-aggregator-suppresses-failure
    find: "      - name: Require both gate jobs\n        run:"
    replace: "      - name: Require both gate jobs\n        continue-on-error: true\n        run:"
    expectedField: needs.result
  - name: workflow-gates-aggregator-always-passes
    find: '          test "${{ needs.journeys.result }}" = "success"'
    replace: '          echo "${{ needs.journeys.result }}"'
    expectedField: needs.result
  - name: workflow-journey-drops-project
    find: '        project: [dark, light]'
    replace: '        project: [dark]'
    expectedField: matrix.project
  - name: workflow-journey-duplicates-project
    find: '        project: [dark, light]'
    replace: '        project: [dark, dark]'
    expectedField: matrix.project
  - name: workflow-journey-skips-timeline
    find: "        if: matrix.project == 'dark'\n"
    replace: "        if: false\n"
    expectedField: matrix.project
  - name: workflow-journey-limits-parallelism
    find: "      fail-fast: false\n      matrix:\n"
    replace: "      fail-fast: false\n      max-parallel: 1\n      matrix:\n"
    expectedField: journeys
  - name: workflow-journey-serializes-job
    find: "  journeys:\n    needs: determine-runner\n"
    replace: "  journeys:\n    concurrency: journeys\n    needs: determine-runner\n"
    expectedField: journeys
  - name: workflow-journey-duplicates-timeline
    find: "      - name: Timeline route gate (production build + source mutation)\n"
    replace: "      - name: Timeline route gate (production build + source mutation)\n        run: pnpm test:timeline-rendered\n      - name: Timeline route gate (production build + source mutation)\n"
    expectedField: pnpm test:timeline-rendered
  - name: workflow-renames-fairtest-job
    find: "  fairtest:\n    needs: determine-runner\n"
    replace: "  fairtest-renamed:\n    needs: determine-runner\n"
    expectedField: jobs.fairtest
  - name: workflow-renames-gates-job
    find: "  gates:\n    # The required check"
    replace: "  gates-renamed:\n    # The required check"
    expectedField: jobs.gates
  - name: workflow-journeys-drops-build
    find: "      # gate 1: contrast (pure JS, no browser) + production build -> dist/.\n      - name: Build (contrast gate + vite build)\n        run: pnpm build\n\n      - name: Build Storybook"
    replace: "      - name: Build Storybook"
    expectedField: Build (contrast gate + vite build)
  - name: workflow-fairtest-drops-storybook-build
    find: "      # gate 2: the component rows serve the built Storybook artifact.\n      - name: Build Storybook\n        run: pnpm build-storybook\n"
    replace: ''
    expectedField: Build Storybook
  - name: workflow-journey-artifact-collides
    find: '          name: storybook-static-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}'
    replace: '          name: storybook-static-${{ matrix.project }}-${{ github.run_id }}'
    expectedField: storybook-static
  - name: workflow-drops-the-envelope-guard
    find: "          pnpm test:fairtest:envelope\n"
    replace: ''
    expectedField: test:fairtest:envelope
  - name: workflow-drops-the-compat-gate
    find: "          pnpm test:fairtest:compat\n"
    replace: ''
    expectedField: test:fairtest:compat
  - name: workflow-drops-the-type-program-gate
    find: "          pnpm test:fairtest:types\n"
    replace: ''
    expectedField: test:fairtest:types
  - name: workflow-drops-the-type-coverage-gate
    find: "          pnpm test:fairtest:type-coverage\n"
    replace: ''
    expectedField: test:fairtest:type-coverage
  - name: workflow-drops-the-paths-gate
    find: "          pnpm test:fairtest:paths\n"
    replace: ''
    expectedField: test:fairtest:paths
  - name: workflow-drops-the-boundary-gate
    find: "          pnpm test:fairtest:boundary\n"
    replace: ''
    expectedField: test:fairtest:boundary
  - name: workflow-drops-the-dispatch-gate
    find: "          pnpm test:fairtest:dispatch\n"
    replace: ''
    expectedField: test:fairtest:dispatch
  - name: workflow-journey-screenshot-policy-drifts
    find: '      JOURNEY_SCREENSHOT: "off"'
    replace: '      JOURNEY_SCREENSHOT: "on"'
    expectedField: JOURNEY_SCREENSHOT
  - name: workflow-drops-journey-facts
    find: '          RUNNER_JOB_NAME: journeys (${{ matrix.project }})'
    replace: '          RUNNER_JOB_NAME: journeys'
    expectedField: Capture journey runner facts
  - name: workflow-drops-fairtest-facts
    find: '          RUNNER_JOB_NAME: fairtest'
    replace: '          RUNNER_JOB_NAME: wrong'
    expectedField: Capture Fairtest runner facts
  - name: workflow-drops-catalog-gate
    find: '          node scripts/journey/catalog-gate.mjs'
    replace: '          echo catalog'
    expectedField: catalog manifest
  - name: workflow-journey-timing-upload-collides
    find: '          name: journey-timing-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}'
    replace: '          name: journey-timing-${{ matrix.project }}-${{ github.run_id }}'
    expectedField: Upload journey timing report
  - name: workflow-journey-artifacts-upload-collides
    find: '          name: journey-artifacts-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}'
    replace: '          name: journey-artifacts-${{ matrix.project }}-${{ github.run_id }}'
    expectedField: journey artifacts
  - name: workflow-fairtest-timing-not-always
    find: "      - name: Upload Fairtest timing report\n        if: always()\n"
    replace: "      - name: Upload Fairtest timing report\n"
    expectedField: Upload Fairtest timing report
  - name: workflow-router-reason-dropped
    find: "          RUNNER_JOB_NAME: fairtest\n          ROUTER_REASON: ${{ needs.determine-runner.outputs.reason }}"
    replace: "          RUNNER_JOB_NAME: fairtest\n          ROUTER_REASON: unknown"
    expectedField: Capture Fairtest runner facts
  - name: workflow-timing-merge-dropped
    find: '          node scripts/journey/runner-facts.mjs merge scripts/journey/.artifacts/report.json'
    replace: '          echo missing'
    expectedField: timing merge
  - name: workflow-actions-read-dropped
    find: '  actions: read'
    replace: '  actions: none'
    expectedField: permissions.actions
  - name: workflow-recording-invariant-dropped
    find: 'scripts/journey/recording-policy.test.mjs'
    replace: 'scripts/journey/other.test.mjs'
    expectedField: catalog manifest
  - name: workflow-theme-fixture-guard-dropped
    find: 'scripts/journey/theme-rows.test.mjs'
    replace: 'scripts/journey/other.test.mjs'
    expectedField: catalog manifest
  - name: workflow-light-transparency-proof-dropped
    find: '        run: node scripts/journey/check-light-transparency.mjs'
    replace: '        run: echo skip'
    expectedField: light transparency
  - name: workflow-facts-becomes-blocking
    find: "      - name: Capture Fairtest runner facts\n        continue-on-error: true\n"
    replace: "      - name: Capture Fairtest runner facts\n"
    expectedField: Capture Fairtest runner facts
  - name: workflow-timing-upload-becomes-blocking
    find: "      - name: Upload Fairtest timing report\n        if: always()\n        continue-on-error: true\n"
    replace: "      - name: Upload Fairtest timing report\n        if: always()\n"
    expectedField: Upload Fairtest timing report
  - name: workflow-fairtest-timing-attempt-collides
    find: '          name: fairtest-timing-${{ github.run_id }}-${{ github.run_attempt }}'
    replace: '          name: fairtest-timing-${{ github.run_id }}'
    expectedField: Upload Fairtest timing report
  - name: workflow-journey-timing-project-collides
    find: '          name: journey-timing-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}'
    replace: '          name: journey-timing-${{ github.run_id }}-${{ github.run_attempt }}'
    expectedField: Upload journey timing report
  - name: workflow-journey-artifact-project-collides
    find: '          name: journey-artifacts-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}'
    replace: '          name: journey-artifacts-${{ github.run_id }}-${{ github.run_attempt }}'
    expectedField: journey artifacts
expectedSourceMutationCount: 5
requiredSourceMutationNames:
  - dropped-process-receipt-requirement
  - dropped-process-receipt-validation
  - dropped-process-receipt-run-binding
  - dropped-process-receipt-project-binding
  - dropped-process-receipt-owner
sourceMutations:
  - name: dropped-process-receipt-requirement
    source: scripts/fairtest/preflight-fairtest.mjs
    defect: missing
    find: "      PROCESS_CLEANUP_RECEIPT_REL,\n      EVIDENCE_REL,"
    replace: "      EVIDENCE_REL,"
    expectedField: ownedFiles
  - name: dropped-process-receipt-validation
    source: scripts/fairtest/preflight-fairtest.mjs
    defect: malformed
    find: "    validated = processContract.validateProcessCleanupReceipt(receipt, label)"
    replace: "    validated = receipt"
    expectedField: process.receipt
  - name: dropped-process-receipt-run-binding
    source: scripts/fairtest/preflight-fairtest.mjs
    defect: foreign
    find: "  if (receipt.runId !== runId) {\n    throw new Error(\n      `${label}: process cleanup receipt belongs to another run"
    replace: "  if (false) {\n    throw new Error(\n      `${label}: process cleanup receipt belongs to another run"
    expectedField: runId
  - name: dropped-process-receipt-project-binding
    source: scripts/fairtest/preflight-fairtest.mjs
    defect: unbound
    find: "  if (receipt.project !== FAIRTEST_PROJECT) {"
    replace: "  if (false) {"
    expectedField: project
  - name: dropped-process-receipt-owner
    source: scripts/fairtest/run-envelope-contract.mjs
    defect: ownership
    find: "  'process-cleanup.json': 'process-supervisor.mjs',"
    replace: "  'process-cleanup.json': 'init-fairtest.mjs',"
    expectedField: process-supervisor.mjs
