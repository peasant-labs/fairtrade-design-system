requiredCaseNames:
  - control_kind_present_renders_control_row
  - no_control_kind_renders_system_row
  - payload_without_control_kind_classifies_nothing
  - run_of_three_is_one_group
  - singleton_is_not_grouped
  - user_turn_splits_runs
  - hidden_turn_splits_runs
  - owner_renders_in_place
  - closed_group_members_are_inert
  - summary_mounted_head
  - search_hit_in_hidden_system_turn_reveals_without_writing_filters
  - initial_position_on_grouped_member_reveals
  - initial_turn_inside_closed_group_opens_before_scroll
  - closed_group_is_one_keyboard_stop
  - closed_group_is_one_minimap_tick_and_one_progress_count
  - control_row_draws_no_card
  - control_row_value_is_never_lowercased
  - control_row_drops_the_repeated_kind
  - control_row_single_line_boundary_at_160
  - owner_row_shares_the_folded_inset
  - rail_lists_only_conversation_turns
  - turn_counts_report_conversation_turns_only
  - empty_reading_state_names_hidden_system_records
  - empty_reading_state_names_one_hidden_system_record
  - nothing_hidden_shows_no_affordance

requiredControlValueNames:
  - a value that repeats the kind drops only the phrase
  - a value spelled with a space names the kind
  - a value equal to the kind prints once
  - a value that does not name the kind stays verbatim
  - a kind prefix that continues into another word is not a match

requiredSummaryNames:
  - summary_singular
  - summary_kinds_verbatim
  - summary_system_fallback
  - summary_plus_more

requiredMutationNames:
  - the default shows system entries again
  - groups are computed over every turn instead of the visible set
  - grouped members render alongside the owner
  - the control and system row branches are swapped
  - the closed group loses its inert wrapper
  - the empty reading state loses its reveal control
  - a grouped member landing scrolls to its owner
  - the group noun becomes system records
  - a closed group counts every member
  - the owner row loses its inset
  - the control row repeats the kind in its value
  - a bookkeeping-only span becomes a user turn again
  - a turn count counts every entry again

mutations:
  - name: the default shows system entries again
    file: src/ui/transcript/filters.js
    find: "toolcalls: true, system: false"
    replace: "toolcalls: true, system: true"
    expectedDiagnostic: "empty_reading_state_names_hidden_system_records"
  - name: groups are computed over every turn instead of the visible set
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "ledger ? groupSystemTurns(visibleTurns) : new Map()"
    replace: "ledger ? groupSystemTurns(turns) : new Map()"
    expectedDiagnostic: "hidden_turn_splits_runs"
  - name: grouped members render alongside the owner
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "if (group && group.owner.index !== t.index) return null"
    replace: "if (group && group.owner.index !== t.index) return renderTurn(t)"
    expectedDiagnostic: "owner_renders_in_place"
  - name: the control and system row branches are swapped
    file: src/ui/transcript/TurnCard.jsx
    find: "const controlRow = systemRow && !!turn.controlKind"
    replace: "const controlRow = systemRow && !turn.controlKind"
    expectedDiagnostic: "no_control_kind_renders_system_row"
  - name: the closed group loses its inert wrapper
    file: src/ui/transcript/SystemGroup.jsx
    find: "<Collapsible id={bodyId} open={shown} keepMounted animateSize={false}>"
    replace: "<Collapsible id={bodyId} open={shown} animateSize={false}>"
    expectedDiagnostic: "closed_group_members_are_inert"
  - name: the empty reading state loses its reveal control
    file: src/ui/transcript/TranscriptViewer.jsx
    find: 'className="txn-empty-show-system"'
    replace: 'className="txn-empty-show-system" hidden'
    expectedDiagnostic: "empty_reading_state_names_hidden_system_records"
  - name: a grouped member landing scrolls to its owner
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "        const memberEl = turnRefs.current[position.turnIndex]"
    replace: "        const memberEl = turnRefs.current[group.owner.index]"
    expectedDiagnostic: "initial_position_on_grouped_member_reveals: the landing must scroll to the member"
  - name: the group noun becomes system records
    file: src/ui/transcript/SystemGroup.jsx
    find: '<span className="txn-systemgroup-label">system entries</span>'
    replace: '<span className="txn-systemgroup-label">system records</span>'
    expectedDiagnostic: "summary_mounted_head: the group noun"
  - name: a closed group counts every member
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "      return group.owner.index === turn.index || openSystemGroups[group.id] === true"
    replace: "      return true"
    expectedDiagnostic: "closed_group_is_one_minimap_tick_and_one_progress_count"
  - name: the owner row loses its inset
    file: src/index.css
    find: ".txn-systemgroup-owner,\n.txn-systemgroup-rows { padding-inline-start: var(--sp-4); }"
    replace: ".txn-systemgroup-owner { padding-inline-start: 0; }\n.txn-systemgroup-rows { padding-inline-start: var(--sp-4); }"
    expectedDiagnostic: "owner_row_shares_the_folded_inset"
  - name: the control row repeats the kind in its value
    file: src/ui/transcript/ControlRow.jsx
    find: "const value = controlValueRemainder(kind, recorded)"
    replace: "const value = recorded"
    expectedDiagnostic: "control_row_drops_the_repeated_kind"
  - name: a bookkeeping-only span becomes a user turn again
    file: src/ui/transcript/analytics.js
    find: ".filter(({ tg }) => turns[tg.startIndex]?.role !== 'system')"
    replace: ".filter(() => true)"
    expectedDiagnostic: "rail_lists_only_conversation_turns"
  - name: a turn count counts every entry again
    file: src/ui/transcript/TranscriptViewer.jsx
    find: ": id === 'trace' ? conversationTurns.length"
    replace: ": id === 'trace' ? turns.length"
    expectedDiagnostic: "turn_counts_report_conversation_turns_only"
