# Cases for AppSidebar (src/ui/AppSidebar.jsx). scripts/app-sidebar.test.mjs mounts the REAL
# component for each case and checks what a user reaches: links and buttons with aria-current on the
# current item, an icon or a swatch, the external marker with its spoken suffix, the group labels,
# the app switcher, the collapse toggle, the remembered state, the keyboard resize, the account row
# and the narrow-viewport menu. Every case mounts `groups` below unless it says otherwise.
#
# `icon` names a lucide-react export; `onSelect: true` gives the item a recording handler.
groups:
  - id: main
    ariaLabel: peasant sections
    items:
      - {id: home, label: home, href: /home, icon: House}
      - {id: discover, label: discover, onSelect: true, icon: Compass}
      - {id: eval-crowd, label: eval-crowd, href: /c/eval-crowd, swatch: 'var(--olive)', depth: 1}
      - {id: collectives, label: collectives, href: 'https://online.invalid/collectives', icon: Users, external: true}
  - id: help
    label: help
    items:
      - {id: docs, label: docs, href: /docs, icon: BookOpen}
apps:
  - {id: online, label: online, href: 'https://online.invalid/'}
  - {id: local, label: local, href: 'http://localhost:8686/'}
  - {id: docs, label: docs}

cases:
  # Items: tag, aria-current, the leading glyph, the external marker and the accessible text
  # (textContent without aria-hidden nodes: the label plus any spoken suffix).
  - name: items render as links and buttons
    kind: items
    props: {app: online, currentId: home}
    expected:
      - {id: home, tag: A, current: page, leading: icon, external: false, text: home, depth: 0}
      - {id: discover, tag: BUTTON, current: null, leading: icon, external: false, text: discover, depth: 0}
      - {id: eval-crowd, tag: A, current: null, leading: swatch, external: false, text: eval-crowd, depth: 1}
      - {id: collectives, tag: A, current: null, leading: icon, external: true, text: 'collectives, opens outside this app', depth: 0}
      - {id: docs, tag: A, current: null, leading: icon, external: false, text: docs, depth: 0}
  - name: a button item reports its id
    kind: select
    props: {app: online, currentId: home}
    click: discover
    expectedSelected: [discover]
  # Groups: every nav landmark and its name, and which group labels show while expanded.
  - name: group labels and landmarks
    kind: groups
    props: {app: online}
    expected:
      navNames: [peasant sections, help, apps]
      visibleLabels: [help]
      asideName: peasant
  # One order for every app: the brand row (outside the scrolling nav), the app's nav groups,
  # search, the switcher to the other apps, then the footer row (outside the scrolling nav too):
  # the account on the left, the icon-only theme toggle on the right.
  - name: the sidebar keeps one order
    kind: structure
    props: {app: online, theme: light, account: {handle: mira}}
    search: {label: search, shortcut: '⌘K', keyShortcuts: Meta+K}
    expected: [top, 'nav:peasant sections', 'nav:help', search, apps, 'foot:account+theme']
  # The same slots in the same order in every app, whatever the app passes: each config below is
  # one app's data (its own groups, search, theme and account); the slot order must not differ.
  - name: every app gets the same slot order
    kind: slot-order
    configs:
      - {app: online, groups: [home, discover], search: true, account: mira}
      - {app: local, groups: [sessions, settings], search: true, account: mira}
      - {app: docs, groups: [overview, install, cli], search: true, account: mira}
    expected: [top, groups, search, apps, 'foot:account+theme']
    lastApp: community
  # The theme toggle names the theme it switches to, with that theme's icon, and reports it.
  - name: the theme toggle names the theme it switches to
    kind: theme
    props: {app: online, theme: light}
    expected:
      first: {name: switch to dark mode, tip: switch to dark mode, label: null, icon: lucide-moon}
      calls: [dark]
      after: {name: switch to light mode, tip: switch to light mode, label: null, icon: lucide-sun}
  # Search: one item after the nav groups, its key hint beside the label, opening the app's search.
  - name: search opens the app's search
    kind: search
    props: {app: online}
    search: {label: search, shortcut: '⌘K', keyShortcuts: Meta+K}
    expected:
      button: {name: search, title: search (⌘K), keys: Meta+K, hint: ⌘K}
  # The brand: the wheat mark alone in the top bar and in the column, its name kept as the
  # accessible name and the tooltip. The full logo with the wordmark belongs to the landing page.
  - name: the brand is the mark alone
    kind: brand
    props: {app: online, homeHref: /}
    expected:
      - {tag: A, name: peasant, title: peasant, mark: true, visibleText: ''}
      - {tag: A, name: peasant, title: peasant, mark: true, visibleText: ''}
  # The switcher: the app the reader is in is left out (it is not a destination), so is an app with
  # no href; every other app is a link that opens in a new tab unless its entry names a target.
  - name: the switcher leaves out the current app
    kind: switcher
    props: {app: local}
    expected:
      - {label: online, tag: A, current: null, target: _blank, rel: noopener noreferrer, text: 'online, opens in a new tab'}
      - {label: community, tag: SPAN, current: null, target: null, rel: null, text: community soon}
  - name: every other app with an address is listed
    kind: switcher
    props: {app: docs}
    expected:
      - {label: online, tag: A, current: null, target: _blank, rel: noopener noreferrer, text: 'online, opens in a new tab'}
      - {label: local, tag: A, current: null, target: _blank, rel: noopener noreferrer, text: 'local, opens in a new tab'}
      - {label: community, tag: SPAN, current: null, target: null, rel: null, text: community soon}
  - name: a tagged entry with no address is text
    kind: switcher
    props:
      app: online
      apps:
        - {id: docs, label: docs, href: 'https://docs.invalid/'}
        - {id: community, label: community, tag: soon}
    expected:
      - {label: docs, tag: A, current: null, target: _blank, rel: noopener noreferrer, text: 'docs, opens in a new tab'}
      - {label: community, tag: SPAN, current: null, target: null, rel: null, text: community soon}
  # Community: every switcher ends with it as a place that does not exist yet, text with a 'soon'
  # note, aria-disabled, not a link; an app that names its own community entry gets that instead.
  - name: every switcher ends with community as soon
    kind: soon
    props: {app: online}
    expected: {tag: SPAN, disabled: 'true', href: null, title: 'community, soon', text: community soon, last: true}
  - name: a community entry of the app's own replaces the soon one
    kind: switcher
    props:
      app: online
      apps:
        - {id: community, label: community, href: 'https://community.invalid/'}
    expected:
      - {label: community, tag: A, current: null, target: _blank, rel: noopener noreferrer, text: 'community, opens in a new tab'}
  - name: an entry's own target is kept
    kind: switcher
    props:
      app: docs
      apps:
        - {id: online, label: online, href: 'https://online.invalid/', target: _self}
    expected:
      - {label: online, tag: A, current: null, target: _self, rel: null, text: 'online, opens outside this app'}
      - {label: community, tag: SPAN, current: null, target: null, rel: null, text: community soon}
  # Collapse: the toggle flips aria-expanded and its name, the root is marked collapsed, the labels
  # stay in the DOM as accessible names, items carry title tooltips, and the separator leaves.
  - name: the toggle collapses to a rail
    kind: collapse
    props: {app: online, storageKey: null}
    expected:
      before: {expanded: 'true', name: collapse the sidebar, collapsed: 'false', separator: true, inBrandRow: true}
      after: {expanded: 'false', name: expand the sidebar, collapsed: 'true', separator: false, inBrandRow: true}
      titles: [home, discover, eval-crowd, collectives, docs]
      callbacks: [true]
  # Persistence: a toggle and a key resize write storage; a remount reads them back.
  - name: collapsed state and width persist
    kind: persist
    props: {app: online, storageKey: test.sidebar}
    keys: [ArrowRight]
    expected:
      storage: {test.sidebar.width: '264', test.sidebar.collapsed: 'true'}
      remount: {collapsed: 'true', width: 264px}
  - name: stored values are restored and clamped
    kind: restore
    props: {app: online, storageKey: test.sidebar}
    storage: {test.sidebar.collapsed: 'true', test.sidebar.width: '999'}
    expected: {collapsed: 'true', width: 360px}
  - name: a throwing localStorage still renders
    kind: throwing-storage
    props: {app: online}
    expected: {items: 5, collapsedAfterToggle: 'true'}
  - name: a null storage key writes nothing
    kind: no-storage
    props: {app: online, storageKey: null}
    keys: [ArrowRight]
    expected: {writes: 0}
  # Keyboard resize: each key's resulting aria-valuenow, clamped to min and max.
  - name: keyboard resize clamps to the bounds
    kind: resize
    props: {app: online, storageKey: null, defaultWidth: 248, minWidth: 200, maxWidth: 360}
    steps:
      - {key: ArrowRight, value: 264}
      - {key: ArrowLeft, value: 248}
      - {key: End, value: 360}
      - {key: ArrowRight, value: 360}
      - {key: Home, value: 200}
      - {key: ArrowLeft, value: 200}
    expected: {min: '200', max: '360', width: 200px}
  # Account row: the avatar initial, the @handle, and a link only when an href is given.
  - name: the account row links to the account
    kind: account
    props: {app: online, account: {handle: mira, href: /settings/account}}
    expected: {tag: A, initial: M, handle: '@mira', href: /settings/account}
  - name: the account row without an href is text
    kind: account
    props: {app: online, account: {handle: Bo}}
    expected: {tag: SPAN, initial: B, handle: '@Bo', href: null}
  - name: an account slot replaces the row
    kind: account-slot
    props: {app: online, account: {handle: mira}}
    slot: signed out
    expected: {text: signed out, handle: false}
  # The narrow-viewport menu: the button opens the drawer and then is its one close control; the
  # listed items carry their stagger order; the button, Escape and a nav link each close it.
  - name: the menu opens and closes the drawer
    kind: drawer
    props: {app: online, currentId: home}
    expected: {name: open the menu, closeName: close the menu, listed: 7}
  # One indicator marks the current item: placed without sliding at first, sliding to a new
  # current item, hidden when no item is current.
  - name: one indicator slides between current items
    kind: indicator
    props: {app: online, currentId: home}
    next: discover
    missing: nowhere
    expected:
      first: {count: 1, hidden: 'true', placed: 'true', slides: 'false', ready: ready}
      moved: {count: 1, hidden: 'true', placed: 'true', slides: 'true', ready: ready}
      none: {count: 1, hidden: 'true', placed: 'false', slides: 'false', ready: null}
  # A router link receives the same props an anchor would.
  - name: a link component receives the item props
    kind: link-component
    props: {app: online, currentId: home, homeHref: /}
    expected: {hrefs: [/, /, /home, /c/eval-crowd, 'https://online.invalid/collectives', /docs, 'http://localhost:8686/'], current: /home}
