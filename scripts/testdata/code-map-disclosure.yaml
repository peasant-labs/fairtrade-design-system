# Cases for the code map navigator's disclosures (scripts/code-map-disclosure.test.mjs). The gate
# mounts the REAL CodeMapNavigator with the payload below, presses the disclosures in `press` in order,
# and reads each folder's disclosure. A folder whose children the grain shows starts open (expanded,
# "hide children") and pressing it hides them and pressing again shows them; a folder past the grain's
# depth starts closed and its disclosure opens it; a file has none. While filtering the filter alone
# decides what shows, so no row has a disclosure: every chevron on screen changes what shows. `rows` is
# the visible rows in order, `disclosures` maps a row to [aria-expanded, aria-label] (null: none).
payload:
  repoFound: true
  structureEdges: []
  violations: []
  nodes:
    - {id: internal, name: internal, kind: module, loc: 820, recordedFiles: 5, totalFiles: 8, order: 0}
    - {id: internal/ingest, name: ingest, kind: package, parent: internal, loc: 510, recordedFiles: 3, totalFiles: 5, order: 0}
    - {id: internal/ingest/pipeline.go, name: pipeline.go, kind: file, parent: internal/ingest, loc: 220, recordedFiles: 1, totalFiles: 1, order: 0}
    - {id: web, name: web, kind: module, loc: 460, recordedFiles: 2, totalFiles: 6, order: 1}
cases:
  - name: a folder the grain opens starts open
    grain: file
    press: []
    rows: [internal, ingest, web]
    disclosures: {internal: ['true', hide children for internal], ingest: ['false', show children for ingest]}
  - name: pressing an open folder hides its children
    grain: file
    press: [internal]
    rows: [internal, web]
    disclosures: {internal: ['false', show children for internal]}
  - name: pressing it again shows them
    grain: file
    press: [internal, internal]
    rows: [internal, ingest, web]
    disclosures: {internal: ['true', hide children for internal], ingest: ['false', show children for ingest]}
  - name: a filtered folder has no chevron
    grain: file
    filter: pipeline
    press: []
    rows: [internal, ingest, pipeline.go]
    disclosures: {internal: null, ingest: null}
  - name: a folder past the grain opens on its disclosure
    grain: file
    press: [ingest]
    rows: [internal, ingest, pipeline.go, web]
    disclosures: {internal: ['true', hide children for internal], ingest: ['true', hide children for ingest]}
