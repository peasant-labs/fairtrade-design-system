# Cases for RepoPicker (src/ui/RepoPicker.jsx). scripts/repo-picker.test.mjs mounts the REAL
# popup with these owners and the starting selection, performs `steps`, and checks the visible
# repositories, the running count, the owner headings and, on save, the reported difference.
#   steps: search:<text> | toggle:<repo id> | select-all | clear | save
owners:
  - id: acme
    login: acme
    kind: org
    repos:
      - {id: acme/ingest-api, name: acme/ingest-api, private: true}
      - {id: acme/web, name: acme/web}
      - {id: acme/worker, name: acme/worker, note: 3 members publish from it}
      - {id: acme/sdk-js, name: acme/sdk-js}
      - {id: acme/sdk-go, name: acme/sdk-go}
      - {id: acme/infra, name: acme/infra, private: true}
  - id: vitor
    login: vitor
    kind: user
    repos:
      - {id: vitor/notes, name: vitor/notes}
      - {id: vitor/dotfiles, name: vitor/dotfiles}
initialSelected: [acme/ingest-api, acme/web]

cases:
  - name: the count
    steps: []
    expected: {visible: [acme/ingest-api, acme/web, acme/worker, acme/sdk-js, acme/sdk-go, acme/infra, vitor/notes, vitor/dotfiles], count: 2 of 8 selected, save: save}
  - name: search
    steps: [search:sdk]
    expected: {visible: [acme/sdk-js, acme/sdk-go], owners: [acme organisation], count: 2 of 8 selected}
  - name: select all on a filtered list
    steps: [search:sdk, select-all]
    expected: {visible: [acme/sdk-js, acme/sdk-go], count: 4 of 8 selected, save: 'save: link 2 repositories'}
  - name: clear
    steps: [search:acme/, clear]
    expected: {count: 0 of 8 selected, save: 'save: unlink 2'}
  - name: clear leaves the hidden selection alone
    steps: [toggle:vitor/notes, search:acme/, clear]
    expected: {count: 1 of 8 selected}
  - name: both identity kinds
    steps: []
    expected: {owners: [acme organisation, vitor personal], ownerMarks: [organisation icon, avatar]}
  - name: an empty search result
    steps: [search:zzz]
    expected: {visible: [], empty: no repository matches “zzz”.}
  - name: the saved difference
    steps: [toggle:acme/worker, toggle:acme/web, save]
    expected: {count: 2 of 8 selected, save: 'save: link 1 repository, unlink 1', saved: {add: [acme/worker], remove: [acme/web]}}

# GroupedMultiSelect with `searchable` (src/ui/GroupedMultiSelect.jsx): the search filters items,
# hides groups it leaves empty, opens the rest, and select all and clear act on visible items.
groupedGroups:
  - {id: ingest, label: ingest-pipeline, items: [{id: parse, label: parse raw events}, {id: backfill, label: backfill historical}]}
  - {id: auth, label: auth-service, items: [{id: tokens, label: rotate tokens}, {id: parse-jwt, label: parse jwt claims}]}
groupedCases:
  - name: without a search select all takes every item
    searchable: false
    steps: [select-all]
    expected: {groups: [ingest-pipeline, auth-service], selected: [parse, backfill, tokens, parse-jwt]}
  - name: the search filters items and opens their groups
    searchable: true
    steps: [search:parse]
    expected: {groups: [ingest-pipeline, auth-service], items: [parse raw events, parse jwt claims], selected: []}
  - name: the search hides groups it leaves empty
    searchable: true
    steps: [search:rotate]
    expected: {groups: [auth-service], items: [rotate tokens], selected: []}
  - name: select all takes only the visible items
    searchable: true
    steps: [search:parse, select-all]
    expected: {selected: [parse, parse-jwt]}
  - name: clear drops only the visible items
    searchable: true
    steps: [select-all, search:parse, clear]
    expected: {selected: [backfill, tokens]}
