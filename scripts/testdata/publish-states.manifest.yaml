# Required-NAME manifest for publish-states.yaml: deletion protection, one list per family.
requiredLabelNames:
  - not published
  - publishing
  - published and up to date
  - new turns
  - published without a count
  - auto-publish on
  - outside your saved lists
requiredPopupNames:
  - full scan count with representative examples
  - connect to village first
  - waiting for github
  - checking for sensitive content
  - the scan failed
  - not in a collective yet
  - ready to publish
  - ready with a match kept un-redacted
  - ready before any scan
  - publishing
  - stopped at a named step
  - done
  - waits for approval
  - stopped without an automatic recovery
  - update done without collective readers
  - done awaiting its only collective
  - first publish cannot remove its only collective
requiredUpdateNames:
  - update adds one collective
  - update removes one collective

  - update revokes its final collective
  - update without readers or removals remains off

  - revoke final collective still requires a successful scan
requiredTransitionNames:
  - keyboard focus remains inside during publish and success
  - keyboard focus remains inside during publish and pending approval

requiredMutationNames:
  - publishing invokes the publication callback again
  - published action reverts to manage
  - representative examples replace the full match count
  - final collective removal never invokes the update
  - a failed scan leaves publish on
  - a failed scan turns re-scan off
  - the remove button loses the collective's name
  - auto-publish claims how it was published
  - a kept match reads as all redacted
  - a missing scan leaves publish on
  - remove stays offered while publishing
  - publishing lets the popup close
  - re-scan calls nothing
  - a read-only card keeps its first decision
  - final collective removal stays blocked
  - re-scan stays live while publishing
  - a stopped publish claims no village changes
  - finished focus falls outside the popup
  - recovery ignores explicit review refusal
  - ambiguous recovery remains enabled
  - recovery retains an obsolete callback
mutations:
  - name: publishing invokes the publication callback again
    file: src/ui/Publish.jsx
    find: "if (latest?.open && latest.state === 'ready' && !latest.blocked) latest.onPublish?.()"
    replace: 'if (latest?.open) latest.onPublish?.()'
    expectedDiagnostic: 'publishing: publish to 2 collectives must call []'
  - name: recovery ignores explicit review refusal
    file: src/ui/Publish.jsx
    find: "const recoveryBlocked = reviewRefused(scan) || ambiguousRetry"
    replace: "const recoveryBlocked = ambiguousRetry"
    expectedDiagnostic: "recover explicit failure: actual recovery/retry button readiness"
  - name: ambiguous recovery remains enabled
    file: src/ui/Publish.jsx
    find: "const ambiguousRetry = !!onRecover && !!onRetry"
    replace: "const ambiguousRetry = false"
    expectedDiagnostic: "both callbacks before prerequisites: actual recovery/retry button readiness"
  - name: recovery retains an obsolete callback
    file: src/ui/Publish.jsx
    find: "if (latest?.open && latest.state === 'stopped' && !latest.recoveryBlocked) latest.onRecover?.()"
    replace: "if (latest?.open && latest.state === 'stopped' && !latest.recoveryBlocked) onRecover?.()"
    expectedDiagnostic: "stale recovery uses latest callback: old callback is never invoked"
  - name: published action reverts to manage
    file: src/ui/Publish.jsx
    find: "'up to date'].filter(Boolean).join(', '), action: 'update'"
    replace: "'up to date'].filter(Boolean).join(', '), action: 'manage'"
    expectedDiagnostic: "published and up to date: the bar's action must be"
  - name: a failed scan leaves publish on
    file: src/ui/Publish.jsx
    find: "const blocked = state === 'checking' || state === 'scan-failed' || "
    replace: "const blocked = state === 'checking' || "
    expectedDiagnostic: "the scan failed: the primary button must be disabled"
  - name: a failed scan turns re-scan off
    file: src/ui/Publish.jsx
    find: "onClick={onRescan} disabled={checking || state === 'publishing'}"
    replace: "onClick={onRescan} disabled={checking || failed || state === 'publishing'}"
    expectedDiagnostic: "the scan failed: re-scan must be enabled"
  - name: the remove button loses the collective's name
    file: src/ui/Publish.jsx
    find: "aria-label={`remove ${item.name}`}"
    replace: "aria-label=\"remove\""
    expectedDiagnostic: "every access row's remove button is named remove <collective>"
  - name: auto-publish claims how it was published
    file: src/ui/Publish.jsx
    find: "`auto-publish on, ${collective}`"
    replace: "`auto-published on git push, ${collective}`"
    expectedDiagnostic: "auto-publish on: the label must read"
  - name: a kept match reads as all redacted
    file: src/ui/Publish.jsx
    find: "const kept = matches.filter((match) => match?.kept).length"
    replace: "const kept = 0"
    expectedDiagnostic: "ready with a match kept un-redacted: the popup must read"
  - name: a missing scan leaves publish on
    file: src/ui/Publish.jsx
    find: "|| (readers.length === 0 && !(mode === 'update' && removes > 0)) || scan === undefined || reviewRefused(scan)"
    replace: "|| (readers.length === 0 && !(mode === 'update' && removes > 0))"
    expectedDiagnostic: "ready before any scan: the primary button must be disabled"
  - name: remove stays offered while publishing
    file: src/ui/Publish.jsx
    find: "onRemove={state === 'publishing' ? undefined : onRemove}"
    replace: "onRemove={onRemove}"
    expectedDiagnostic: "publishing: every access row's remove button is named remove <collective>"
  - name: publishing lets the popup close
    file: src/ui/Publish.jsx
    find: "const dismissible = state !== 'publishing'"
    replace: "const dismissible = true"
    expectedDiagnostic: "publishing: close dialog must call []"
  - name: re-scan calls nothing
    file: src/ui/Publish.jsx
    find: "onClick={onRescan} disabled={checking || state === 'publishing'}"
    replace: "onClick={() => {}} disabled={checking || state === 'publishing'}"
    expectedDiagnostic: "the scan failed: re-scan must call"
  - name: a read-only card keeps its first decision
    file: src/ui/Redaction.jsx
    find: "const kept = isControlled || readOnly ? Boolean(keptProp) : internalKept"
    replace: "const kept = isControlled ? Boolean(keptProp) : internalKept"
    expectedDiagnostic: "a read-only review follows a changed decision"
  - name: final collective removal stays blocked
    file: src/ui/Publish.jsx
    find: "(readers.length === 0 && !(mode === 'update' && removes > 0))"
    replace: "readers.length === 0"
    expectedDiagnostic: "update revokes its final collective: update primary must be enabled"
  - name: re-scan stays live while publishing
    file: src/ui/Publish.jsx
    find: "onClick={onRescan} disabled={checking || state === 'publishing'}"
    replace: "onClick={onRescan} disabled={checking}"
    expectedDiagnostic: "publishing: re-scan must be disabled"
  - name: a stopped publish claims no village changes
    file: src/ui/Publish.jsx
    find: ". review who can read it."
    replace: ". nothing changed on village."
    expectedDiagnostic: "stopped at a named step: the popup must not read"
  - name: finished focus falls outside the popup
    file: src/ui/Publish.jsx
    find: "if (!open) return"
    replace: "if (true) return"
    expectedDiagnostic: "finishing keeps focus inside the popup"
  - name: final collective removal never invokes the update
    file: src/ui/Publish.jsx
    find: "onClick={runPublish}"
    replace: "onClick={() => { if (mode !== 'update' || readers.length > 0) runPublish() }}"
    expectedDiagnostic: "update revokes its final collective: update activation must call onPublish 1 times"
  - name: representative examples replace the full match count
    file: src/ui/Publish.jsx
    find: "const matchCount = scan?.matchCount ?? matches.length"
    replace: "const matchCount = matches.length"
    expectedDiagnostic: "full scan count with representative examples: the popup must read"
