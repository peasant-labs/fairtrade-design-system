# Every publish state label value and every publish popup state (src/ui/Publish.jsx).
# scripts/publish-states.test.mjs mounts the REAL parts for each case: PublishBar for a label
# value (its words, its icon, and the one action), PublishDialog for a popup state (the heading,
# the primary button's label and whether it is enabled, the re-scan button, and the lines a user
# reads). The session, collectives and urls are demo data.
session: Fix flaky ingest test
access:
  - {id: platform, name: Acme Platform, members: 12, note: suggested · repo acme/ingest-api is linked}
  - {id: company, name: Acme Company, members: 87, note: suggested · github org acme}
scan:
  matches:
    - {id: m1, category: secrets, confidence: 0.99, before: AKIAIOSFODNN7EXAMPLE, after: <AWS_ACCESS_KEY>}
    - {id: m2, category: pii, confidence: 0.97, before: alice@acme.dev, after: <EMAIL>}
    - {id: m3, category: paths, confidence: 0.91, before: /Users/alice/work/acme/ingest-api, after: /Users/<USER>/work/acme/ingest-api}
done:
  url: https://village.peasantlabs.org/transcripts/3f9c0a17
  collectives: [Acme Platform, Acme Company]
  pullRequest: {number: 42, branch: fix/flaky-ingest}

labels:
  - {name: not published, state: not-published, props: {}, text: not published, icon: lucide-circle-dashed, action: publish}
  - {name: publishing, state: publishing, props: {collectives: 2}, text: publishing to 2 collectives, icon: lucide-loader, action: publish, busy: true}
  - {name: published and up to date, state: published, props: {collectives: 2}, text: published · 2 collectives · up to date, icon: lucide-circle-check, action: manage}
  - {name: new turns, state: new-turns, props: {collectives: 2, newTurns: 6}, text: published · 2 collectives · 6 new turns, icon: lucide-circle-fading-arrow-up, action: update}
  # a count the host does not give is left out, never stated as zero
  - {name: published without a count, state: published, props: {}, text: published · up to date, icon: lucide-circle-check, action: manage}
  - {name: auto-publish on, state: auto-publish, props: {collective: Acme Platform}, text: auto-publish on · Acme Platform, icon: lucide-repeat, action: manage}
  - {name: outside your saved lists, state: outside-lists, props: {}, text: not published · outside your saved lists, icon: lucide-list-x, action: publish}

# primary: the primary button's label and whether it is enabled (null: no primary button).
# rescan: whether a re-scan button renders and is enabled (null: none).
# lines: text that must appear in the popup; absent: text that must not; alert: text in a
# role=alert element. removeButtons: the access rows' remove buttons, exactly (none while
# publishing). kept: match ids the host marks kept (they leave un-redacted); unscanned: the host
# gives no scan yet. matchesOpen: whether the matches review is open on mount.
# steps: press a control by its accessible name or text (or a key), then the exact callbacks it
# made, as [name, ...arguments].
popup:
  - name: connect to village first
    state: connect
    heading: publish “Fix flaky ingest test”
    primary: null
    rescan: null
    lines: [connect this computer to village once to publish., continue with GitHub]
    removeButtons: []
    steps:
      - {press: continue with GitHub, calls: [[onConnect]]}
      - {press: cancel, calls: [[onClose]]}
  - name: waiting for github
    state: waiting-github
    heading: publish “Fix flaky ingest test”
    primary: null
    rescan: null
    lines: [waiting for github in your browser]
    removeButtons: []
    steps:
      - {key: Escape, calls: [[onClose]]}
  - name: checking for sensitive content
    state: checking
    heading: publish “Fix flaky ingest test”
    primary: {label: publish to 2 collectives, enabled: false}
    rescan: {enabled: false}
    lines: [checking for sensitive content, who can read it, nothing leaves your machine until you publish.]
    removeButtons: [remove Acme Platform, remove Acme Company]
    steps:
      - {press: publish to 2 collectives, calls: []}
  - name: the scan failed
    state: scan-failed
    heading: publish “Fix flaky ingest test”
    primary: {label: publish to 2 collectives, enabled: false}
    rescan: {enabled: true}
    alert: the scan failed, so publish is off. re-scan to try again.
    lines: [what leaves your machine]
    removeButtons: [remove Acme Platform, remove Acme Company]
    steps:
      - {press: re-scan, calls: [[onRescan]]}
      - {press: publish to 2 collectives, calls: []}
  - name: not in a collective yet
    state: no-collective
    access: []
    heading: publish “Fix flaky ingest test”
    primary: {label: publish, enabled: false}
    rescan: {enabled: true}
    lines: [you are not in a collective yet., create or join one on village]
    removeButtons: []
    steps:
      - {press: publish, calls: []}
  - name: ready to publish
    state: ready
    heading: publish “Fix flaky ingest test”
    primary: {label: publish to 2 collectives, enabled: true}
    rescan: {enabled: true}
    lines: [3 matches · all redacted, Acme Platform, Acme Company, publish this repo automatically on git push, same collectives · change it in settings]
    absent: [kept un-redacted, not scanned yet]
    matchesOpen: false
    removeButtons: [remove Acme Platform, remove Acme Company]
    steps:
      - {press: remove Acme Company, calls: [[onRemove, company]]}
      - {press: publish to 2 collectives, calls: [[onPublish]]}
      - {press: close dialog, calls: [[onClose]]}
  - name: ready with a match kept un-redacted
    state: ready
    kept: [m2]
    heading: publish “Fix flaky ingest test”
    primary: {label: publish to 2 collectives, enabled: true}
    rescan: {enabled: true}
    lines: [3 matches · 1 kept un-redacted, will be sent]
    absent: [all redacted]
    matchesOpen: true
    removeButtons: [remove Acme Platform, remove Acme Company]
    steps: []
  - name: ready before any scan
    state: ready
    unscanned: true
    heading: publish “Fix flaky ingest test”
    primary: {label: publish to 2 collectives, enabled: false}
    rescan: {enabled: true}
    lines: [not scanned yet, so publish is off. re-scan to check it.]
    absent: [nothing to redact, all redacted]
    removeButtons: [remove Acme Platform, remove Acme Company]
    steps:
      - {press: publish to 2 collectives, calls: []}
  - name: publishing
    state: publishing
    heading: publish “Fix flaky ingest test”
    primary: {label: publish to 2 collectives, enabled: false}
    rescan: {enabled: false}
    lines: [publishing to 2 collectives, sending your redacted transcript to village.]
    absent: [nothing leaves your machine until]
    removeButtons: []
    steps:
      - {press: close dialog, calls: []}
      - {key: Escape, calls: []}
      - {press: re-scan, calls: []}
      - {press: publish to 2 collectives, calls: []}
  - name: stopped at a named step
    state: stopped
    heading: publish “Fix flaky ingest test”
    primary: {label: retry, enabled: true}
    rescan: {enabled: true}
    alert: stopped while setting who can read it. review who can read it.
    lines: [review who can read it.]
    absent: [nothing leaves your machine until, nothing changed on village.]
    removeButtons: [remove Acme Platform, remove Acme Company]
    steps:
      - {press: retry, calls: [[onRetry]]}
  - name: done
    state: done
    heading: published to Acme Platform and Acme Company
    primary: {label: done, enabled: true}
    rescan: null
    lines: [village.peasantlabs.org/transcripts/3f9c0a17, is open for fix/flaky-ingest. comment /peasant attach on it to link this transcript.]
    removeButtons: []
    steps:
      - {press: done, calls: [[onClose]]}
  - name: waits for approval
    state: waits-approval
    heading: published to Acme Platform and Acme Company
    pending: [ML Reading Group]
    primary: {label: done, enabled: true}
    rescan: null
    lines: [ML Reading Group shows it once its owner approves.]
    removeButtons: []
    steps: []

  - name: stopped without an automatic recovery
    state: stopped
    noRetry: true
    heading: publish “Fix flaky ingest test”
    primary: null
    rescan: {enabled: true}
    lines: [review who can read it.]
    absent: [retry]
    removeButtons: [remove Acme Platform, remove Acme Company]
    steps: [{press: cancel, calls: [[onClose]]}]
  - name: update done without collective readers
    state: done
    mode: update
    doneCollectives: []
    heading: updated · no collective can read it
    primary: {label: done, enabled: true}
    rescan: null
    lines: [village.peasantlabs.org/transcripts/3f9c0a17]
    absent: [published to]
    removeButtons: []
    steps: [{press: done, calls: [[onClose]]}]
  - name: done awaiting its only collective
    state: waits-approval
    doneCollectives: []
    pending: [ML Reading Group]
    heading: submitted to ML Reading Group
    primary: {label: done, enabled: true}
    rescan: null
    lines: [ML Reading Group shows it once its owner approves.]
    removeButtons: []
    steps: []
  - name: first publish cannot remove its only collective
    state: ready
    access: [{id: platform, name: Acme Platform, pending: removal}]
    heading: publish “Fix flaky ingest test”
    primary: {label: publish, enabled: false}
    rescan: {enabled: true}
    lines: [who can read it]
    removeButtons: []
    steps: [{press: publish, calls: []}]

# The update popup keeps the audience unless the developer changes it there.
  - name: full scan count with representative examples
    state: ready
    matchCount: 9
    heading: publish “Fix flaky ingest test”
    primary: {label: publish to 2 collectives, enabled: true}
    rescan: {enabled: true}
    lines: [9 matches · all redacted, show 3 examples]
    absent: [nothing to redact]
    matchesOpen: false
    removeButtons: [remove Acme Platform, remove Acme Company]
    steps:
      - {press: show 3 examples, calls: []}
      - {press: hide examples, calls: []}

update:
  - name: update adds one collective
    access:
      - {id: platform, name: Acme Platform, members: 12}
      - {id: company, name: Acme Company, members: 87}
      - {id: ml, name: ML Reading Group, members: 21, pending: approval}
    primary: update and add 1 collective
    enabled: true
    publishCalls: 1
    lines: [6 new turns since you published · 1 new match, redacted, adding · waits for approval, removing a collective takes the transcript back from it.]
  - name: update removes one collective
    access:
      - {id: platform, name: Acme Platform, members: 12}
      - {id: company, name: Acme Company, members: 87, pending: removal}
    primary: update and remove 1 collective
    enabled: true
    publishCalls: 1
    lines: [removing · loses access when you update]
  - name: update revokes its final collective
    access: [{id: platform, name: Acme Platform, pending: removal}]
    primary: update and remove 1 collective
    enabled: true
    publishCalls: 1
    lines: [removing · loses access when you update]
  - name: update without readers or removals remains off
    access: []
    primary: update
    enabled: false
    publishCalls: 0
    lines: [who can read it]
  - name: revoke final collective still requires a successful scan
    state: scan-failed
    access: [{id: platform, name: Acme Platform, pending: removal}]
    primary: update and remove 1 collective
    enabled: false
    publishCalls: 0
    lines: [the scan failed, so publish is off. re-scan to try again.]

transitions:
  - name: keyboard focus remains inside during publish and success
    result: done
  - name: keyboard focus remains inside during publish and pending approval
    result: waits-approval
