# Fixture inventory for scripts/release-guard.test.mjs.
#
# The tag section pins the tag parser this script keeps for the tag-triggered
# workflows. The git section pins tag immutability, which release-batch.yml
# relies on when it pushes the computed tag. The workflow section pins the
# merge-queue contract of the four live workflows: exact triggers, the
# per-ref concurrency, the classify-only release-PR decision, the fail-closed
# group resolution, the gated release-batch write chain, and the dispatch-only
# cut-release button. The mutations section is the required-name inventory:
# each row breaks one contract row, and the test proves the matching assertion
# catches it. Deletion protection is by exact name set, never by count.
tags:
  valid:
    - {name: final, input: "fairtrade-v1.2.3"}
    - {name: candidate, input: "fairtrade-v1.2.3-rc4"}
    - {name: zero core, input: "fairtrade-v0.0.0"}
  invalid:
    - {name: missing namespace, input: "v1.2.3"}
    - {name: missing v, input: "fairtrade-1.2.3"}
    - {name: beta, input: "fairtrade-v1.2.3-beta1"}
    - {name: leading zero major, input: "fairtrade-v01.2.3"}
    - {name: leading zero minor, input: "fairtrade-v1.02.3"}
    - {name: leading zero patch, input: "fairtrade-v1.2.03"}
    - {name: rc zero, input: "fairtrade-v1.2.3-rc0"}
    - {name: rc padded, input: "fairtrade-v1.2.3-rc01"}
workflow:
  ci_pr_types: [opened, synchronize, reopened]
  ci_cancel: "${{ github.event_name == 'pull_request' }}"
  guard_pr_types: [opened, edited, synchronize, reopened]
  cut_levels: [patch, minor]
  mutations:
    - name: re-adding edited to ci.yml is rejected
      file: ci.yml
      find: "types: [opened, synchronize, reopened]"
      replace: "types: [opened, edited, synchronize, reopened]"
    - name: cancelling ci on every event is rejected
      file: ci.yml
      find: "cancel-in-progress: ${{ github.event_name == 'pull_request' }}"
      replace: "cancel-in-progress: true"
    - name: unconditional prepack is rejected
      file: ci.yml
      find: "        if: steps.kind.outputs.kind == 'release'\n        run: pnpm prepack"
      replace: "        run: pnpm prepack"
    - name: a branch literal in ci classify is rejected
      file: ci.yml
      find: "          echo \"kind=${kind}\" >> \"${GITHUB_OUTPUT}\""
      replace: "          # fallback automation/release\n          echo \"kind=${kind}\" >> \"${GITHUB_OUTPUT}\""
    - name: dropping edited from title-guard is rejected
      file: title-guard.yml
      find: "types: [opened, edited, synchronize, reopened]"
      replace: "types: [opened, synchronize, reopened]"
    - name: a job-level if on the guard job is rejected
      file: title-guard.yml
      find: "  title-guard:\n    runs-on: ubuntu-latest"
      replace: "  title-guard:\n    if: github.event_name == 'pull_request'\n    runs-on: ubuntu-latest"
    - name: warn-and-pass group resolution is rejected
      file: title-guard.yml
      find: "failing closed so an unidentified entry never lands unchecked.\"\n            exit 1"
      replace: "failing closed so an unidentified entry never lands unchecked.\"\n            exit 0"
    - name: a weakened release-batch verdict is rejected
      file: release-batch.yml
      find: "--verdict taggable"
      replace: "--verdict rejected"
    - name: arming without the gate is rejected
      file: release-batch.yml
      find: "steps.gate.outputs.gate == 'arm'"
      replace: "steps.replan.outputs.action == 'open-pr'"
    - name: a major cut-release level is rejected
      file: cut-release.yml
      find: "options: [patch, minor]"
      replace: "options: [patch, minor, major]"
    - name: a cut-release on any branch is rejected
      file: cut-release.yml
      find: "if: github.ref == 'refs/heads/main' && vars.RELEASE_BATCH_MODE == 'tag'"
      replace: "if: vars.RELEASE_BATCH_MODE == 'tag'"
git:
  # The release-tag invariant stated in AGENTS.md: never move or delete a
  # release tag. A plain push of an existing tag is refused by the receiver, so
  # the exact command the release job runs cannot rewrite a published tag.
  # The rows below are the controls that make that refusal specific: git moves
  # the very same tag the moment the guard is dropped, so a passing case is
  # observing immutability rather than an incidental push failure.
  tag: fairtrade-v1.2.3
  first_message: first release
  second_message: attempted replacement
  mutations:
    - {name: a forced push moves the release tag, operation: force_push}
    - {name: a delete and re-push moves the release tag, operation: delete_then_push}
