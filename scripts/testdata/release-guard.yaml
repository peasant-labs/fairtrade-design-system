permissions:
  allowed: [admin, maintain]
  denied: [write, triage, read, none]
reviews:
  - name: latest approval wins
    maintainers: [alice]
    reviews: [{user: alice, state: CHANGES_REQUESTED}, {user: alice, state: APPROVED}]
    approved: true
  - name: approval revoked
    maintainers: [alice]
    reviews: [{user: alice, state: APPROVED}, {user: alice, state: CHANGES_REQUESTED}]
    approved: false
  - name: non-maintainer ignored
    maintainers: [alice]
    reviews: [{user: bob, state: APPROVED}]
    approved: false
metadata:
  valid: {number: 16, state: closed, merged: true, title: "release(v0.0.11): publish final schema support", user: {login: alice}, base: {ref: main}, merge_commit_sha: abc123}
  invalid:
    - {name: unmerged, patch: {merged: false}}
    - {name: wrong base, patch: {base: {ref: develop}}}
    - {name: empty SHA, patch: {merge_commit_sha: ""}}
    - {name: malformed payload, payload: []}
github:
  resolve:
    responses:
      - {body: {number: 16, state: closed, merged: true, title: "release(v0.0.11): publish final schema support", user: {login: alice}, base: {ref: main}}}
      - {body: {permission: admin}}
      - body: [{event: merged, commit_id: cccccccccccccccccccccccccccccccccccccccc, commit_url: "https://api.github.com/repos/peasant-labs/fairtrade-design-system/commits/cccccccccccccccccccccccccccccccccccccccc"}]
      - {body: {status: identical, merge_base_commit: {sha: cccccccccccccccccccccccccccccccccccccccc}}}
    expected_merge_sha: cccccccccccccccccccccccccccccccccccccccc
    expected_paths: ["/pulls/16", "/collaborators/alice/permission", "/issues/16/timeline?per_page=100", "/compare/cccccccccccccccccccccccccccccccccccccccc...main"]
    invalid:
      - {name: missing merged timeline event, mutation: missing_merged}
      - {name: merged timeline repository differs, mutation: resolve_timeline_repository}
      - {name: merged commit is disconnected from main, mutation: resolve_disconnected_commit}
  malformed_response: {body: {}}
  native_stack:
    valid:
      name: merged member on main trunk
      responses:
        - body: {number: 78, state: closed, merged: true, title: "release(v0.0.19): render Pi transcripts", user: {login: alice}, base: {ref: feature, repo: {id: 42, full_name: peasant-labs/fairtrade-design-system}}, head: {repo: {id: 42}}, stack: {number: 79, base: {ref: main}}, merge_commit_sha: null}
        - {body: {permission: admin}}
        - body: {number: 79, open: false, base: {ref: main}, pull_requests: [{number: 77, state: closed, merged_at: "2026-09-08T06:37:10Z", head: {repo: {id: 42}}, base: {repo: {id: 42}}}, {number: 78, state: closed, merged_at: "2026-09-08T06:37:11Z", head: {repo: {id: 42}}, base: {repo: {id: 42}}}]}
        - body: [{event: merged, commit_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, commit_url: "https://api.github.com/repos/peasant-labs/fairtrade-design-system/commits/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}]
        - body: {status: identical, merge_base_commit: {sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}
      expected_paths: ["/pulls/78", "/collaborators/alice/permission", "/stacks/79", "/issues/78/timeline?per_page=100", "/compare/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa...main"]
      expected_merge_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    invalid:
      - {name: non-main stack trunk, mutation: stack_trunk}
      - {name: requested PR is not a member, mutation: wrong_member}
      - {name: member repository differs, mutation: wrong_repository}
      - {name: member is unmerged, mutation: unmerged_member}
      - {name: merged timeline SHA is missing, mutation: missing_sha}
      - {name: merged timeline repository differs, mutation: timeline_repository}
      - {name: merged commit is disconnected from main, mutation: disconnected_commit}
      - {name: ordinary non-main PR is rejected, mutation: direct_non_main}
    loader_invalid:
      - {name: deleting required trunk scenario is rejected, operation: delete, scenario: non-main stack trunk, replacement: null}
      - {name: replacing trunk scenario with duplicate mutation is rejected, operation: replace, scenario: non-main stack trunk, replacement: missing_sha}
      - {name: replacing trunk scenario with unknown mutation is rejected, operation: replace, scenario: non-main stack trunk, replacement: misspelled_mutation}
      - {name: mutation dispatcher rejects unknown discriminator, operation: unknown_dispatch, scenario: non-main stack trunk, replacement: misspelled_mutation}
  pagination:
    - name: page two revokes approval
      responses:
        - body: [{user: {login: alice}, state: APPROVED}]
          link: '<https://api.github.com/repos/peasant-labs/fairtrade-design-system/pulls/16/reviews?per_page=100&page=2>; rel="next"'
        - body: [{user: {login: alice}, state: CHANGES_REQUESTED}]
        - body: {permission: maintain}
      approved: false
      expected_paths: ["/pulls/16/reviews?per_page=100", "/pulls/16/reviews?per_page=100&page=2", "/collaborators/alice/permission"]
    - name: page two grants approval
      responses:
        - body: [{user: {login: alice}, state: CHANGES_REQUESTED}]
          link: '<https://api.github.com/repos/peasant-labs/fairtrade-design-system/pulls/16/reviews?per_page=100&page=2>; rel="next"'
        - body: [{user: {login: alice}, state: APPROVED}]
        - body: {permission: maintain}
      approved: true
      expected_paths: ["/pulls/16/reviews?per_page=100", "/pulls/16/reviews?per_page=100&page=2", "/collaborators/alice/permission"]
workflow:
  validate_if: "github.event_name == 'pull_request' && github.event.action != 'closed' && startsWith(github.event.pull_request.title, 'release(')"
  tag_if: "github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'release('))"
  release_needles:
    - "PEASANT_RELEASER_APP_ID"
    - "PEASANT_RELEASER_APP_PRIVATE_KEY"
    - "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1"
    - "owner: peasant-labs"
    - "repositories: fairtrade-design-system"
    - 'ref: ${{ steps.release.outputs.mergeSha }}'
    - 'git merge-base --is-ancestor "$MERGE_SHA" origin/main'
    - "node scripts/release-guard.mjs check-package package.json"
    - 'git tag -a "$TAG" "$MERGE_SHA" -m "$PR_TITLE"'
    - "git rev-parse -q --verify"
    - "git ls-remote --exit-code --tags"
  publish_needles:
    - 'node scripts/release-guard.mjs parse-tag "$TAG"'
    - "npm publish --access public"
  mutations:
    - {name: unconditional prefix, target: tag_if, replacement: "true || github.event_name == 'workflow_dispatch'"}
    - {name: missing merged condition, target: tag_if, replacement: "github.event_name == 'workflow_dispatch' || github.event.action == 'closed'"}
    - {name: weakened validate condition, target: validate_if, replacement: "true || github.event_name == 'pull_request'"}
git: {tag: fairtrade-v1.2.3, first_message: first release, second_message: attempted replacement}
