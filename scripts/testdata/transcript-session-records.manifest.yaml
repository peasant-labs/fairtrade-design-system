# Required-NAME manifest for transcript-session-records.yaml: deletion protection. The gate asserts
# the case names equal this list exactly, as a set, and parts-mutations.mjs proves each production
# mutation below turns the gate red for the named reason.
requiredCaseNames:
  - session metadata records are control records
  - a control record carries its producer kind
  - a short control record survives the short-banner prefilter
  - the same text without a producer kind stays an ordinary system turn
  - an unknown turn time is dropped
  - an unknown session time is empty
  - the meta row reads a short duration
  - a turn without a known time shows no time
  - the steps list leaves out a zero duration
  - a cursor prompt shows without its wrapper
  - an evidence-bearing cursor prompt shows without its wrapper
  - another harness shows its prompt as written
  - a prompt that mentions the tag stays as written

requiredMutationNames:
  - a control record loses its producer kind
  - every system turn becomes a control row
  - a short control record is dropped by the banner heuristic
  - an unknown turn time is kept
  - an unknown session time is kept
  - the meta row shows raw minutes
  - a zero step duration is shown
  - a user prompt keeps the cursor wrapper
  - the recorded content is rewritten
  - every harness is unwrapped
  - the trace outline shows the recorded prompt
mutations:
  - name: a control record loses its producer kind
    file: src/ui/transcript/adapter.js
    find: "    if (t.controlKind) {\n      turnVM.controlKind = t.controlKind\n      turnVM.isControl = true\n    }"
    replace: "    void t.controlKind"
    expectedDiagnostic: "a control record carries its producer kind: cooked controlKind"
  - name: every system turn becomes a control row
    file: src/ui/transcript/adapter.js
    find: "    if (t.controlKind) {\n      turnVM.controlKind = t.controlKind"
    replace: "    if (t.role === 'system' || t.controlKind) {\n      turnVM.controlKind = t.controlKind"
    expectedDiagnostic: "a control record carries its producer kind: turn"
  - name: a short control record is dropped by the banner heuristic
    file: src/ui/transcript/adapter.js
    find: "    if (t.controlKind) return true"
    replace: "    void t.controlKind"
    expectedDiagnostic: "a short control record survives the short-banner prefilter"
  - name: an unknown turn time is kept
    file: src/ui/transcript/adapter.js
    find: "      const copy = withKnownTime(turn)"
    replace: "      const copy = turn"
    expectedDiagnostic: "an unknown turn time is dropped: cooked times"
  - name: an unknown session time is kept
    file: src/ui/transcript/adapter.js
    find: "startTime: isKnownTime(payload.startTime) ? payload.startTime : '',"
    replace: "startTime: payload.startTime,"
    expectedDiagnostic: "an unknown session time is empty: session times"
  - name: the meta row shows raw minutes
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "<b className=\"tnum\">{formatDurationMins(session.durationMins)}</b>"
    replace: "<b className=\"tnum\">{session.durationMins}m</b>"
    expectedDiagnostic: "the meta row reads a short duration: meta duration"
  - name: a zero step duration is shown
    file: src/ui/StepsWaterfall.jsx
    find: "{durationLabel ? <span className=\"swf-dur tnum\">{durationLabel}</span> : null}"
    replace: "<span className=\"swf-dur tnum\">{durationLabel || '0s'}</span>"
    expectedDiagnostic: "the steps list leaves out a zero duration: step durations"
  - name: a user prompt keeps the cursor wrapper
    file: src/ui/transcript/adapter.js
    find: "    if (shown !== undefined) turnVM.displayContent = shown"
    replace: "    void shown"
    expectedDiagnostic: "a cursor prompt shows without its wrapper: the shown prompt"
  - name: the recorded content is rewritten
    file: src/ui/transcript/adapter.js
    find: "    if (shown !== undefined) turnVM.displayContent = shown"
    replace: "    if (shown !== undefined) { turnVM.displayContent = shown; turnVM.content = shown }"
    expectedDiagnostic: "an evidence-bearing cursor prompt shows without its wrapper: the recorded content"
  - name: every harness is unwrapped
    file: src/ui/transcript/adapter.js
    find: "  if (harness !== 'cursor' || role !== 'user') return undefined"
    replace: "  if (role !== 'user') return undefined"
    expectedDiagnostic: "another harness shows its prompt as written: the shown prompt"
  - name: the trace outline shows the recorded prompt
    file: src/ui/transcript/OutlineRail.jsx
    find: "prompt: t.displayPrompt ?? t.prompt,"
    replace: "prompt: t.prompt,"
    expectedDiagnostic: "a cursor prompt shows without its wrapper: the trace outline must not show"
