# Host-kind dispatch guard corpus.
#
# scripts/fairtest/assert-target-dispatch.mjs is the single place the rule "no
# app module outside the declaration and mounted-dispatcher modules branches on
# the host kind" is enforced. This file holds the guard's validation cases as
# data; the guard owns none.
#
# `detectionCases` feed the token detector a source snippet and expect either a
# detection naming the offending expression or a clean result. They pin the
# ordinary evasions a text match would miss: the reversed comparison, the
# bracket access, the switch over a kind, the array-membership test, and a
# comparison through an alias. A clean case proves a comment, a string, an
# unrelated switch, an assertion call, and an object literal do not trip it.
# The executable mutations live in the manifest beside this file; one plants a
# scratch module per evasion, and one removes the guard from the required-CI
# boundary chain.
detectionCases:
  - name: direct-equality
    source: |
      if (target.kind === 'product') return 1
    expect: detected
    expectedExpression: target.kind === 'product'
  - name: reversed-equality
    source: |
      if ('product' === target.kind) return 1
    expect: detected
    expectedExpression: "'product' === target.kind"
  - name: bracket-equality
    source: |
      if (target['kind'] === 'product') return 1
    expect: detected
    expectedExpression: "target['kind'] === 'product'"
  - name: switch-case
    source: |
      switch (target.kind) { case 'product': return 1; default: return 2 }
    expect: detected
    expectedExpression: "switch (target.kind) { case 'product'"
  - name: includes-array
    source: |
      if (['product', 'component'].includes(target.kind)) return 1
    expect: detected
    expectedExpression: "['product', 'component'].includes(target.kind)"
  - name: aliased-equality
    source: |
      const k = target.kind
      if (k === 'product') return 1
    expect: detected
    expectedExpression: k === 'product'
  - name: kind-read-clean
    source: |
      const kind = target.kind
    expect: clean
  - name: comment-mention-clean
    source: |
      // if (target.kind === 'product') return 1
    expect: clean
  - name: string-mention-clean
    source: |
      const message = "target.kind === 'product'"
    expect: clean
  - name: unrelated-switch-clean
    source: |
      switch (operation) { case 'product': return 1 }
    expect: clean
  - name: proof-assertion-clean
    source: |
      expect(summary.proof.kind).toBe('product')
    expect: clean
  - name: object-literal-clean
    source: |
      const target = { kind: 'product' }
    expect: clean
