    rejected: true
    source: 'const value = 1 // eslint-disable-line -- temporary exception'
  - name: bare-disable-next-line-with-reason
    rejected: true
    source: |
      // eslint-disable-next-line -- temporary exception
      const value = 1
  - name: bare-disable
    rejected: true
    source: '/* eslint-disable */'
  - name: bare-disable-line
    rejected: true
    source: 'const value = 1 // eslint-disable-line'
  - name: bare-disable-next-line
    rejected: true
    source: |
      // eslint-disable-next-line
      const value = 1
  - name: bare-block-multiline
