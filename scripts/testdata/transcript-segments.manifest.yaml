# Required-NAME manifest for transcript-segments.yaml: deletion protection. The gate
# (scripts/transcript-segments.test.mjs) asserts each family's names equal these lists
# exactly, as sets. Membership is asserted, never a bare count.
requiredDirectoryNames:
  - 32 mib session
  - 10000 turn directory
  - 10000 turn crowd directory
  - sparse 55 turn session
  - single segment session
  - empty session
requiredLoadCaseNames:
  - opening segment 0 leaves one newer boundary
  - loading the next segment keeps one boundary and appends
  - loading the final segment closes the newer boundary
  - two disjoint regions carry a gap boundary
  - a jump into the middle carries a boundary before and after
  - a 32 segment directory samples 32 ticks
  - a 200 segment directory samples 200 ticks
  - a 400 segment directory still samples 200 ticks
requiredWindowCaseNames:
  - a jump into an unloaded middle segment requests its covering run in order
  - a window whose segments are already loaded requests nothing
  - a window adjacent to a loaded segment merges into it
requiredMountCaseNames:
  - two loaded segments mount at most their own turns
  - a window in the middle mounts only its covering segments' turns
  - an oversized turn is alone, bounded and offers its full read
  - a region that starts wordless marks a continuing action run
  - two disjoint regions carry one gap boundary
  - a lone middle segment carries the older edge
  - a held window beside a disjoint region keeps its gap boundary
  - separated held segments keep their own ranges around a gap
  - a single segment directory draws no boundary
  - an empty directory is not indexed
requiredRecoveryCaseNames:
  - a rejected segment load enables retry
  - a void segment load remains retryable
  - clearing a failed window allows the same request again

# Production mutations the gate must kill (scripts/parts-mutations.mjs).
requiredMutationNames:
  - the scrubber mounts one tick per turn
  - the boundary drops its load control
  - the window renders partly loaded
  - a gap draws no continuation marker
  - the truncation notice ignores byteLength
  - the held window loses its caption
  - a held gap repeats its continuation marker
  - a failed boundary load stays disabled
  - clearing a window retains its request cache
mutations:
  - name: the scrubber mounts one tick per turn
    file: src/ui/transcript/segments.js
    find: "const sample = Math.min(SEGMENT_SCRUBBER_TICKS, total)"
    replace: "const sample = total"
    expectedDiagnostic: "10000 turn crowd directory mounted: 200 scrubber ticks on 400 segments"
  - name: the boundary drops its load control
    file: src/ui/transcript/TranscriptBoundary.jsx
    find: "onClick={() => onLoadMore?.(boundary.loadSegment)}"
    replace: "onClick={() => undefined}"
    expectedDiagnostic: "two loaded segments mount at most their own turns: the control loads segment 2"
  - name: the window renders partly loaded
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "const heldWindow = !!(segmentMode && coverage?.required && !coverage.complete)"
    replace: "const heldWindow = false"
    expectedDiagnostic: "a window adjacent to a loaded segment merges into it: no window turn renders before its covering run is complete"
  - name: a gap draws no continuation marker
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "isWordlessAssistant(firstVisibleAfter(internal.lastTurn))"
    replace: "false"
    expectedDiagnostic: "two disjoint regions carry one gap boundary: the continuation count must equal 1"
  - name: the truncation notice ignores byteLength
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "{t.truncated && ("
    replace: "{false && ("
    expectedDiagnostic: "an oversized turn is alone, bounded and offers its full read: the truncation notice must be present"
  - name: the held window loses its caption
    file: src/ui/transcript/TranscriptViewer.jsx
    find: 'while (heldPosition < heldRegions.length && heldRegions[heldPosition].firstTurn < turnIndex) {'
    replace: 'while (false) {'
    expectedDiagnostic: 'a held window beside a disjoint region keeps its gap boundary: the held range must be named'
  - name: a held gap repeats its continuation marker
    file: src/ui/transcript/TranscriptViewer.jsx
    find: '!internalBefore.has(firstRendered.index) && '
    replace: ''
    expectedDiagnostic: 'a held window beside a disjoint region keeps its gap boundary: the continuation count must equal 1'
  - name: a failed boundary load stays disabled
    file: src/ui/transcript/TranscriptViewer.jsx
    find: 'Promise.resolve(result).then(clear, clear)'
    replace: 'Promise.resolve(result).then(clear, () => {})'
    expectedDiagnostic: 'a rejected segment load enables retry: failed or untracked load permits retry'
  - name: clearing a window retains its request cache
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "windowRequestRef.current = { key: '', indexes: new Set() }"
    replace: 'void 0'
    expectedDiagnostic: 'clearing a failed window allows the same request again: the same missing segment is requested again'
