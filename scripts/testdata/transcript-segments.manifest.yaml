# Required-NAME manifest for transcript-segments.yaml: deletion protection. The gate
# (scripts/transcript-segments.test.mjs) asserts each family's names equal these lists
# exactly, as sets. Membership is asserted, never a bare count.
requiredDirectoryNames:
  - 32 mib session
  - 10000 turn directory
  - 10000 turn crowd directory
  - sparse 55 turn session
  - single segment session
  - empty session
requiredHistoryCaseNames:
  - migrated earlier history
  - earlier history with unresolved ownership
  - future history state remains unknown
  - prototype-looking history state remains unknown
requiredUnknownHistoryInvalidNames:
  - a future state does not excuse missing turns
requiredTypeMutationNames:
  - a new history state is missing from the ordered inventory
requiredLoadCaseNames:
  - opening segment 0 leaves one newer boundary
  - loading the next segment keeps one boundary and appends
  - loading the final segment closes the newer boundary
  - two disjoint regions carry a gap boundary
  - a jump into the middle carries a boundary before and after
  - a 32 segment directory samples 32 ticks
  - a 200 segment directory samples 200 ticks
  - a 400 segment directory still samples 200 ticks
requiredWindowCaseNames:
  - a jump into an unloaded middle segment requests its covering run in order
  - a window whose segments are already loaded requests nothing
  - a window adjacent to a loaded segment merges into it
requiredWordlessCaseNames:
  - an empty assistant turn continues an action run
  - an image-bearing assistant turn is content
  - prose is not an action continuation
requiredMountCaseNames:
  - two loaded segments mount at most their own turns
  - a window in the middle mounts only its covering segments' turns
  - an oversized turn is alone, bounded and offers its full read
  - a region that starts wordless marks a continuing action run
  - two disjoint regions carry one gap boundary
  - a lone middle segment carries the older edge
  - a held window beside a disjoint region keeps its gap boundary
  - separated held segments keep their own ranges around a gap
  - held window without a loader stays honest
  - a single segment directory draws no boundary
  - an empty directory is not indexed
requiredPhaseCaseNames:
  - phase starting at turn zero
  - phase starting mid transcript
  - precomputed phase without a count omits it
requiredPhaseCountCaseNames:
  - sparse phase counts conversation turns rather than indexes
requiredPositionDirectoryNames:
  - golden eighty rows
  - golden rows with identities from 500
  - one turn middle segment
  - no turn middle segment
  - empty third of five
  - six segments in two pages
  - five segments of seventy seven
  - twelve segments of seventy seven
requiredPositionCaseNames:
  - eighty rows with three system rows
  - a gap with one conversation turn
  - a gap with no conversation turns
  - a three segment gap with an empty middle
  - a directory holding only its second page
  - a gap that reaches into a page not received names no position
  - an older server sends no positions
  - the header keeps one unit while loading and when complete
  - a fully loaded session whose adapter dropped a duplicate
  - a fully loaded session with a filter on
  - scrubber ticks and the jump failure name positions
  - the slider names the active position
  - a tick without a span names its segment
  - the slider on a segment with no conversation turns names the segment
  - the files sentence counts conversation turns
  - a sparse directory never prints a turn id as a position
requiredCountCaseNames:
  - tool and thinking rows are not counted
  - a reply with prose and tool calls is counted
  - a thousand held turns group their digits
  - a filtered thousand groups both counts
requiredHeroCaseNames:
  - the hero prints the conversation count
  - the hero falls back to turnCount
requiredRecoveryCaseNames:
  - a host reported failure can retry without a window loader
  - a rejected covering load names the window and retries successfully
  - a rejected window request names the window and retries successfully
  - a host reported covering failure names the window and retries
  - a rejected segment load enables retry
  - a void segment load remains retryable
  - clearing a failed window allows the same request again

# Production mutations the gate must kill (scripts/parts-mutations.mjs).
requiredMutationNames:
  - a history label is dropped
  - the history state inventory omits a member
  - a failed covering load is silently dropped
  - a failed window request is silently dropped
  - the scrubber mounts one tick per turn
  - the boundary drops its load control
  - the window renders partly loaded
  - a gap draws no continuation marker
  - the truncation notice ignores byteLength
  - the held window loses its caption
  - a held gap repeats its continuation marker
  - a failed boundary load stays disabled
  - clearing a window retains its request cache
  - the phase range returns to one based indexes
  - the boundary falls back to raw indexes
  - the phase count includes an extra turn
  - an image turn is treated as a wordless continuation
  - a caption prints turn identities
  - a tick prints turn identities
  - a boundary with a missing span still names a position
  - the header compares its count with the total
  - the header ignores hidden turns
  - a tool row is counted
  - the header without a total prints raw digits
mutations:
  - name: the header without a total prints raw digits
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "? `${formatInteger(conversationTurns.length)} turns`"
    replace: "? `${conversationTurns.length} turns`"
    expectedDiagnostic: 'a thousand held turns group their digits: header'
  - name: a history label is dropped
    file: src/ui/transcript/earlier-history-state.js
    find: "'migrated history'"
    replace: "'history'"
    expectedDiagnostic: 'migrated earlier history: mounted history label'
  - name: the history state inventory omits a member
    file: src/ui/transcript/earlier-history-state.js
    find: '  EarlierHistoryState.Unresolved,'
    replace: ''
    expectedDiagnostic: 'history state inventory contains every member'
  - name: a failed window request is silently dropped
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "const result = onLoadWindow(anchor)\n      if (result && typeof result.then === 'function') Promise.resolve(result).catch(fail)"
    replace: "const result = onLoadWindow(anchor)\n      if (result && typeof result.then === 'function') Promise.resolve(result).catch(() => {})"
    expectedDiagnostic: 'a rejected window request names the window and retries successfully: rejection or host failure must be visible, not silently dropped'
  - name: a failed covering load is silently dropped
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "const result = onLoadSegment(index)\n        if (result && typeof result.then === 'function') Promise.resolve(result).catch(fail)"
    replace: "const result = onLoadSegment(index)\n        if (result && typeof result.then === 'function') Promise.resolve(result).catch(() => {})"
    expectedDiagnostic: 'a rejected covering load names the window and retries successfully: rejection or host failure must be visible, not silently dropped'
  - name: the phase range returns to one based indexes
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "`${formatInteger(phase.turnCount)} ${phase.turnCount === 1 ? 'turn' : 'turns'}`"
    replace: "`turns ${formatInteger(phase.from + 1)}–${formatInteger(phase.to + 1)}`"
    expectedDiagnostic: 'phase starting at turn zero: phase caption'
  - name: the boundary falls back to raw indexes
    file: src/ui/transcript/segments.js
    find: 'if (position == null) return extent'
    replace: 'if (position == null) return `turns ${boundary.firstTurn}–${boundary.lastTurn}, ${extent}`'
    expectedDiagnostic: 'boundary 0 caption'
  - name: the phase count includes an extra turn
    file: src/ui/transcript/analytics.js
    find: "turns.slice(seg.startTurn, seg.endTurn + 1).filter(isConversationTurn).length"
    replace: "turns.slice(seg.startTurn, seg.endTurn + 1).filter(isConversationTurn).length + 1"
    expectedDiagnostic: 'sparse phase counts conversation turns rather than indexes: phase count'
  - name: the scrubber mounts one tick per turn
    file: src/ui/transcript/segments.js
    find: "const sample = Math.min(SEGMENT_SCRUBBER_TICKS, total)"
    replace: "const sample = total"
    expectedDiagnostic: "10000 turn crowd directory mounted: 200 scrubber ticks on 400 segments"
  - name: the boundary drops its load control
    file: src/ui/transcript/TranscriptBoundary.jsx
    find: "onClick={() => onLoadMore?.(boundary.loadSegment)}"
    replace: "onClick={() => undefined}"
    expectedDiagnostic: "two loaded segments mount at most their own turns: the control loads segment 2"
  - name: the window renders partly loaded
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "const heldWindow = !!(segmentMode && coverage?.required && !coverage.complete)"
    replace: "const heldWindow = false"
    expectedDiagnostic: "a window adjacent to a loaded segment merges into it: no window turn renders before its covering run is complete"
  - name: a gap draws no continuation marker
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "isWordlessAssistant(firstVisibleAfter(internal.lastTurn))"
    replace: "false"
    expectedDiagnostic: "two disjoint regions carry one gap boundary: the continuation count must equal 1"
  - name: the truncation notice ignores byteLength
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "{t.truncated && ("
    replace: "{false && ("
    expectedDiagnostic: "an oversized turn is alone, bounded and offers its full read: the truncation notice must be present"
  - name: the held window loses its caption
    file: src/ui/transcript/TranscriptViewer.jsx
    find: 'while (heldPosition < heldRegions.length && heldRegions[heldPosition].firstTurn < turnIndex) {'
    replace: 'while (false) {'
    expectedDiagnostic: 'a held window beside a disjoint region keeps its gap boundary: the held range must be named'
  - name: a held gap repeats its continuation marker
    file: src/ui/transcript/TranscriptViewer.jsx
    find: '!internalBefore.has(firstRendered.index) && '
    replace: ''
    expectedDiagnostic: 'a held window beside a disjoint region keeps its gap boundary: the continuation count must equal 1'
  - name: a failed boundary load stays disabled
    file: src/ui/transcript/TranscriptViewer.jsx
    find: 'Promise.resolve(result).then(clear, clear)'
    replace: 'Promise.resolve(result).then(clear, () => {})'
    expectedDiagnostic: 'a rejected segment load enables retry: failed or untracked load permits retry'
  - name: clearing a window retains its request cache
    file: src/ui/transcript/TranscriptViewer.jsx
    find: "if (!segmentMode || !windowKey) {\n      windowRequestRef.current = { key: '', indexes: new Set() }"
    replace: "if (!segmentMode || !windowKey) {\n      void 0"
    expectedDiagnostic: 'clearing a failed window allows the same request again: the same missing segment is requested again'
  - name: an image turn is treated as a wordless continuation
    file: src/ui/transcript/segments.js
    find: "&& !hasImageParts(turn)"
    replace: ""
    expectedDiagnostic: "an image-bearing assistant turn is content: an image is content, not an action continuation"
  - name: a caption prints turn identities
    file: src/ui/transcript/segments.js
    find: 'position: positioned ? positionOf(conversationTurns, list) : null,'
    replace: 'position: positioned ? { before: first.firstTurn, count: last.lastTurn - first.firstTurn + 1, total: conversationTurns } : null,'
    expectedDiagnostic: 'a sparse directory never prints a turn id as a position: boundary captions'
  - name: a tick prints turn identities
    file: src/ui/transcript/segments.js
    find: 'hasSpan(ref) ? positionOf(conversationTurns, [ref]) : null'
    replace: 'hasSpan(ref) ? { before: ref.firstTurn, count: ref.lastTurn - ref.firstTurn + 1, total: conversationTurns } : null'
    expectedDiagnostic: 'a sparse directory never prints a turn id as a position: tick titles'
  - name: a boundary with a missing span still names a position
    file: src/ui/transcript/segments.js
    find: "      if (!hasSpan(ref)) positioned = false\n"
    replace: ''
    expectedDiagnostic: 'a tick without a span names its segment: boundary captions'
  - name: the header compares its count with the total
    file: src/ui/transcript/TranscriptViewer.jsx
    find: 'scope.complete && visibleConversationCount === conversationTurns.length'
    replace: 'visibleConversationCount === total'
    expectedDiagnostic: 'a fully loaded session whose adapter dropped a duplicate: header'
  - name: the header ignores hidden turns
    file: src/ui/transcript/TranscriptViewer.jsx
    find: 'scope.complete && visibleConversationCount === conversationTurns.length'
    replace: 'scope.complete'
    expectedDiagnostic: 'a fully loaded session with a filter on: header'
  - name: a tool row is counted
    file: src/ui/transcript/TranscriptViewer.jsx
    find: 'const conversationTurns = useMemo(() => turns.filter(isConversationTurn), [turns])'
    replace: "const conversationTurns = useMemo(() => turns.filter((turn) => turn.role !== 'system'), [turns])"
    expectedDiagnostic: 'tool and thinking rows are not counted: header'
