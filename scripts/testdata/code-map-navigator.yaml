expectedCaseCount: 6
expectedNodeCount: 11
expectedEdgeCount: 7
cases:
  - name: package grain is progressively disclosed
    grain: package
    expandedIds: [internal]
    expectedVisible: [internal, internal/ingest, web]
    expectedHidden: [internal/ingest/pipeline.go]
    focusedId: internal/ingest/pipeline.go
    selectedId: internal
    expectedTabbable: internal
    expectShowChildren: true
    expectMissingStatus: false
  - name: file grain reaches a selected file
    grain: file
    expandedIds: [internal, internal/ingest]
    selectedId: internal/ingest/pipeline.go
    expectedVisible: [internal, internal/ingest, internal/ingest/pipeline.go, web]
    expectedHidden: []
    focusedId: internal/ingest/pipeline.go
    expectedTabbable: internal/ingest/pipeline.go
    expectShowChildren: true
    expectMissingStatus: false
  - name: filter retains the matching path and its ancestors
    grain: file
    filter: pipeline
    expectedVisible: [internal, internal/ingest, internal/ingest/pipeline.go]
    expectedHidden: [web]
    focusedId: web
    selectedId: internal
    expectedTabbable: internal
    expectShowChildren: true
    expectMissingStatus: false
  - name: disconnected node remains a discoverable root
    grain: package
    filter: orphan
    selectedId: orphan
    focusedId: orphan
    expectedVisible: [orphan]
    expectedHidden: [internal, web]
    expectedTabbable: orphan
    expectShowChildren: false
    expectMissingStatus: false
  - name: stale URL selection offers explicit recovery
    grain: project
    selectedId: deleted/path
    focusedId: deleted/path
    expectedVisible: [internal, web, orphan]
    expectedHidden: [internal/ingest, web/src]
    expectedTabbable: internal
    expectShowChildren: false
    expectMissingStatus: true
  - name: dense file filter retains a deep matching ancestry
    grain: file
    filter: handler
    selectedId: web/src/app/handler.ts
    focusedId: web/src/app/handler.ts
    expectedVisible: [web, web/src, web/src/app, web/src/app/handler.ts]
    expectedHidden: [internal, orphan, web/src/app/page.tsx]
    expectedTabbable: web/src/app/handler.ts
    expectShowChildren: true
    expectMissingStatus: false
