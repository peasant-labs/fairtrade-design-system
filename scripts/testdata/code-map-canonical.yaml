    repoFound: true
    nodes:
      - {id: root, name: root, kind: module, loc: 100, recordedFiles: 1, totalFiles: 1, order: 0}
      - {id: child, name: child, kind: file, parent: root, loc: 80, recordedFiles: 1, totalFiles: 1, order: 0}
    structureEdges: []
    violations: []
  canonicalState:
    version: 1
    presentation: canvas
    selectedId: null
    grain: file
    expandedIds: []
    navigatorFilter: ''
    navigatorFocusedId: null
    viewport: null
  contradictoryLegacy:
    selectedId: child
    viewport: {scale: 1.4, panX: 18, panY: -9}
  expected:
    selectedMarkerAbsent: data-selected="true"
    automaticTransform: translate(0px, 0px) scale(1)
    legacyTransformAbsent: translate(18px, -9px) scale(1.4)
