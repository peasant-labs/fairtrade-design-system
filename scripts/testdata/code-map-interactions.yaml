    - &node_solo {id: solo, name: solo, kind: module, loc: 140, recordedFiles: 1, totalFiles: 2, order: 2}
    - &node_detached {id: detached-child, name: detached-child, kind: file, parent: solo, loc: 70, recordedFiles: 1, totalFiles: 1, order: 0}
