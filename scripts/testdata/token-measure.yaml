# Measurement probes for the global tokens, run on the built app in both themes by
# scripts/journey/token-measure.journey.mjs. Required names: token-measure.manifest.yaml.

# Real characters per line (spaces included) at each measure token, set in the body face at
# the body size with the prose tracking and word spacing the base layer gives a paragraph.
# The faces must have loaded; a fallback face would measure a different line.
measures:
  - name: prose measure
    token: --measure-prose
    maxChars: 80
  - name: reading measure
    token: --measure-read
    minChars: 45
    maxChars: 66
sampleTexts:
  - The agent read the configuration file, found that the retry budget was set too low for the flaky integration suite, and proposed raising it while keeping the overall timeout unchanged. It then ran the tests twice to confirm the failures were gone and summarised what it changed so the reviewer could check each step without opening the diff.
  - I checked the logs and the failing test only fails when the cache is cold, which means the fixture loads before the server is ready. A small wait in the setup fixes it, and I added a note in the readme explaining why the wait exists and when it can go.
  - Refactor the session list so it groups by repository, keeps the newest first, and shows how many tool calls each session made. Then make sure the empty state explains how to record a first session in plain words, with one primary action.

# Token values read back as computed lengths on a probe element, in px.
lengths:
  - name: emphasis stroke
    token: --stroke-emphasis
    px: 2
  - name: hairline stroke
    token: --stroke-hairline
    px: 1
  - name: small icon
    token: --ic-sm
    px: 14
  - name: medium icon
    token: --ic-md
    px: 16
  - name: large icon
    token: --ic-lg
    px: 18
  - name: minimum target
    token: --target-min
    px: 24
  - name: control height
    token: --control-h
    px: 36
  - name: comfortable target
    token: --target-comfortable
    px: 44
  - name: focus ring width
    token: --focus-ring-width
    px: 3
  - name: focus ring offset
    token: --focus-ring-offset
    px: 2
  - name: inset focus ring offset
    token: --focus-ring-offset-inset
    px: -3

# Every Lucide icon the app mounts renders at least this many px wide and tall (--ic-sm),
# except the named ornaments below, which are drawn inside a marker rather than read as icons.
iconFloorPx: 14
iconFloorExempt:
  - name: commit dot star
    iconClass: cg-spark
    reason: the star is painted inside the 9px commit dot as part of the marker, never as a standalone icon

# The overlay shadow per theme: dark lifts overlays, light stays flat.
overlayShadow:
  dark: lifted
  light: none

# Named mutations: the probe re-measures with one token overridden and must report the breach.
mutations:
  - name: the reading measure widens past 66 characters
    token: --measure-read
    value: 60ch
    expectedDiagnostic: reading measure holds
  - name: the prose measure widens past 80 characters
    token: --measure-prose
    value: 66ch
    expectedDiagnostic: prose measure holds
