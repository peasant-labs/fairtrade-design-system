hollowTail:
  partial: { sourceBytesLoaded: 512, sourceBytesTotal: 1024, loadedPct: '50%', valueTextSuffix: '50% of source loaded' }
  appended: { sourceBytesLoaded: 768, sourceBytesTotal: 1024, loadedPct: '75%', valueTextSuffix: '75% of source loaded' }
  complete: { sourceBytesLoaded: 1024, sourceBytesTotal: 1024 }
  invalidDirectories:
    - { name: half-loaded-only, sourceBytesLoaded: 512 }
    - { name: half-total-only, sourceBytesTotal: 1024 }
    - { name: loaded-exceeds-total, sourceBytesLoaded: 1025, sourceBytesTotal: 1024 }
    - { name: negative-loaded, sourceBytesLoaded: -1, sourceBytesTotal: 1024 }
    - { name: non-integer-loaded, sourceBytesLoaded: 12.5, sourceBytesTotal: 1024 }
    - { name: null-loaded, sourceBytesLoaded: null, sourceBytesTotal: 1024 }
