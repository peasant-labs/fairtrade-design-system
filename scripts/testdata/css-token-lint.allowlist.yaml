# Known exceptions to scripts/css-token-lint.mjs, one per (file, selector, prop, value, check).
# The list only shrinks: when a literal is fixed the lint fails until its entry is deleted.
# Each value here has no exact token (tokenising it changes the rendering), so it waits for
# a reviewed change to its component rather than a silent restyle.
