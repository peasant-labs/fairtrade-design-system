requiredCaseNames:
  - text and image parts round-trip in source order
  - an image-only turn is retained with no text
  - an unknown part kind is dropped without inventing evidence
  - a missing image object is dropped
  - an omitted image keeps its reason
  - a cursor image prompt loses its user_query wrapper
  - a cursor wrapper spanning an image keeps both text blocks
  - a cursor wrapper keeps the follow-up after its close
  - a turn without parts has no cooked parts
  - an empty parts list falls back to the text
  - rendered order follows the recorded order
  - two images render in the order they were recorded
  - alt text names one image's recorded facts
  - alt text places an image among its siblings
  - alt text never comes back empty for a bare part
requiredResolverCaseNames:
  - image-url-resolves-a-present-image
  - deprecated-attachment-url-still-resolves
  - null-image-prop-uses-the-deprecated-resolver
  - neither-resolver-fetches-an-image
  - undefined-image-url-renders-unavailable
  - conflict-is-silent-in-production
  - image-url-wins-when-both-are-passed
  - unresolved-image-url-does-not-fall-back
  - standalone-turn-card-accepts-the-deprecated-resolver
  - standalone-image-accepts-the-deprecated-resolver
  - standalone-turn-card-accepts-image-url
  - standalone-image-accepts-image-url
requiredMutationNames:
  - the alt text drops its recorded facts
  - the cursor wrapper survives on image-bearing parts
  - the deprecated resolver overrides imageUrl
  - the deprecated resolver no longer works
  - resolver conflicts warn repeatedly
  - resolver conflicts warn in production
mutations:
  - name: the alt text drops its recorded facts
    file: src/ui/transcript/image-parts.js
    find: "  return metadata === '' ? where : `${where}, ${metadata}`"
    replace: "  return where"
    expectedDiagnostic: "alt text names one image's recorded facts"
  - name: the cursor wrapper survives on image-bearing parts
    file: src/ui/transcript/adapter.js
    find: "    const contentParts = shown !== undefined ? stripUserQueryParts(parts) : parts"
    replace: "    const contentParts = parts"
    expectedDiagnostic: "a cursor image prompt loses its user_query wrapper"
  - name: the deprecated resolver overrides imageUrl
    file: src/ui/transcript/image-url.js
    find: "  return imageUrl ?? attachmentUrl"
    replace: "  return attachmentUrl ?? imageUrl"
    expectedDiagnostic: image-url-wins-when-both-are-passed
  - name: the deprecated resolver no longer works
    file: src/ui/transcript/image-url.js
    find: "  return imageUrl ?? attachmentUrl"
    replace: "  return imageUrl"
    expectedDiagnostic: deprecated-attachment-url-still-resolves
  - name: resolver conflicts warn repeatedly
    file: src/ui/transcript/image-url.js
    find: "      warnedAboutBothResolvers = true"
    replace: "      warnedAboutBothResolvers = false"
    expectedDiagnostic: unresolved-image-url-does-not-fall-back
  - name: resolver conflicts warn in production
    file: src/ui/transcript/image-url.js
    find: "development = process.env.NODE_ENV !== 'production'"
    replace: "development = true"
    expectedDiagnostic: conflict-is-silent-in-production
