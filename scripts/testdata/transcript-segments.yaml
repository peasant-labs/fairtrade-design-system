# Transcript segment viewer fixtures: the loaded-region model, the boundary, the
# scrubber sample, the window descriptor and the mounted card bound.
#
# Large sessions are described by parameters, never by a turn list: `totalTurns`,
# `totalSegments` and `segmentTurns` generate the same directory and segment shape
# the producer emits (clean turn ranges, about the byte budget per segment), so the
# 10,000-turn and 32 MiB cases stay cheap while asserting the real mounted counts.
#
# Turn roles follow one formula so continuation and filter cases are deterministic:
# identity % 6 == 0 is a user turn, % 7 == 0 is a system turn, every other turn is an
# assistant turn with one tool call. `oversizedTurn` marks a single bounded turn.
# `wordlessCases` name which turns are action continuations: an image is content.

vitestSelection:
  heldWindow: a held window beside a disjoint region keeps its gap boundary
  failedWindow: a rejected covering load names the window and retries successfully
  phase: phase starting mid transcript
  positions: eighty rows with three system rows
typeMutations:
  - name: a new history state is missing from the ordered inventory
    find: "  Unresolved: closed('uncertain_unresolved'"
    replace: "  Future: closed('future_history_state', 'future history', { explanation: 'future' }),\n  Unresolved: closed('uncertain_unresolved'"

directories:
  - name: 32 mib session
    totalTurns: 1312
    totalSegments: 32
    firstTurn: 0
    segmentTurns: 41
    segmentBytes: 1048576
  - name: 10000 turn directory
    totalTurns: 10000
    totalSegments: 200
    firstTurn: 0
    segmentTurns: 50
    segmentBytes: 1572864
  - name: 10000 turn crowd directory
    totalTurns: 10000
    totalSegments: 400
    firstTurn: 0
    segmentTurns: 25
    segmentBytes: 786432
  - name: sparse 55 turn session
    totalTurns: 55
    totalSegments: 4
    firstTurn: 4
    segmentTurns: 14
    segmentBytes: 4096
  - name: single segment session
    totalTurns: 10
    totalSegments: 1
    firstTurn: 0
    segmentTurns: 10
    segmentBytes: 1024
  - name: empty session
    totalTurns: 0
    totalSegments: 0
    firstTurn: 0
    segmentTurns: 0
    segmentBytes: 0

historyPayload: {id: history-fixture, harness: claude-code, startTime: '2026-09-20T10:00:00Z', endTime: '2026-09-20T10:01:00Z', durationMins: 1, totalTokens: 0, tokensIn: 0, tokensOut: 0, turnCount: 0, toolCallCount: 0, turns: []}
historyCases:
  - name: migrated earlier history
    state: uncertain_migrated
    label: migrated history
    explanation: this earlier history was retained during migration. its ownership is uncertain, so it is separate from current turns and input submissions.
  - name: earlier history with unresolved ownership
    state: uncertain_unresolved
    label: ownership unresolved
    explanation: the ownership of this earlier history could not be resolved. it is retained separately from current turns and input submissions.
  - name: future history state remains unknown
    state: future_history_state
    label: unknown history state
    explanation: the ownership of this earlier history is not known. it is retained separately from current turns and input submissions.
  - name: prototype-looking history state remains unknown
    state: __proto__
    label: unknown history state
    explanation: the ownership of this earlier history is not known. it is retained separately from current turns and input submissions.
unknownHistoryInvalidCases:
  - name: a future state does not excuse missing turns
    section: {state: future_history_state, turns: null}

loadCases:
  - name: opening segment 0 leaves one newer boundary
    directory: sparse 55 turn session
    loaded: [0]
    expect:
      boundarySides: [newer]
      loadSegments: [1]
      ticks: 4
      boundaryCount: 1
  - name: loading the next segment keeps one boundary and appends
    directory: sparse 55 turn session
    loaded: [0, 1]
    expect:
      boundarySides: [newer]
      loadSegments: [2]
      ticks: 4
      boundaryCount: 1
  - name: loading the final segment closes the newer boundary
    directory: sparse 55 turn session
    loaded: [0, 1, 2, 3]
    expect:
      boundarySides: []
      loadSegments: []
      ticks: 4
      boundaryCount: 0
  - name: two disjoint regions carry a gap boundary
    directory: sparse 55 turn session
    loaded: [0, 3]
    expect:
      boundarySides: [between]
      loadSegments: [1]
      ticks: 4
      boundaryCount: 1
  - name: a jump into the middle carries a boundary before and after
    directory: sparse 55 turn session
    loaded: [2]
    expect:
      boundarySides: [older, newer]
      loadSegments: [1, 3]
      ticks: 4
      boundaryCount: 2
  - name: a 32 segment directory samples 32 ticks
    directory: 32 mib session
    loaded: [0]
    expect:
      boundarySides: [newer]
      loadSegments: [1]
      ticks: 32
      boundaryCount: 1
  - name: a 200 segment directory samples 200 ticks
    directory: 10000 turn directory
    loaded: [0]
    expect:
      boundarySides: [newer]
      loadSegments: [1]
      ticks: 200
      boundaryCount: 1
  - name: a 400 segment directory still samples 200 ticks
    directory: 10000 turn crowd directory
    loaded: [0]
    expect:
      boundarySides: [newer]
      loadSegments: [1]
      ticks: 200
      boundaryCount: 1

windowCases:
  - name: a jump into an unloaded middle segment requests its covering run in order
    directory: sparse 55 turn session
    loaded: [0]
    window:
      requestedAnchor: 30
      anchorTurn: 30
      span: 10
      firstTurn: 18
      lastTurn: 43
      segments: [1, 2]
      hasOlder: true
      hasNewer: true
    expect:
      missing: [1, 2]
      requests: [1, 2]
      complete: false
      regionCount: 1
  - name: a window whose segments are already loaded requests nothing
    directory: sparse 55 turn session
    loaded: [0, 1, 2]
    window:
      requestedAnchor: 30
      anchorTurn: 30
      span: 10
      firstTurn: 18
      lastTurn: 43
      segments: [1, 2]
      hasOlder: true
      hasNewer: true
    expect:
      missing: []
      requests: []
      complete: true
      regionCount: 1
  - name: a window adjacent to a loaded segment merges into it
    directory: sparse 55 turn session
    loaded: [0, 1]
    window:
      requestedAnchor: 30
      anchorTurn: 30
      span: 10
      firstTurn: 18
      lastTurn: 43
      segments: [1, 2]
      hasOlder: true
      hasNewer: true
    expect:
      missing: [2]
      requests: [2]
      complete: false
      regionCount: 1

mountCases:
  - name: two loaded segments mount at most their own turns
    directory: 32 mib session
    loaded: [0, 1]
    expect:
      maxCards: 82
      boundaryCount: 1
      boundarySides: [newer]
      captions:
        - 30 segments, 30 MiB
      filesScope: derived from 82 of 1312 turns, 2 of 32 segments loaded
      continuationCount: 0
      truncation: false
      notIndexed: false
  - name: a window in the middle mounts only its covering segments' turns
    directory: sparse 55 turn session
    loaded: [1, 2]
    window:
      requestedAnchor: 30
      anchorTurn: 30
      span: 10
      firstTurn: 18
      lastTurn: 43
      segments: [1, 2]
      hasOlder: true
      hasNewer: true
    expect:
      maxCards: 28
      boundaryCount: 2
      boundarySides: [older, newer]
      captions:
        - 1 segment, 4 KiB
        - 1 segment, 4 KiB
      filesScope: derived from 28 of 55 turns, 2 of 4 segments loaded
      continuationCount: 0
      truncation: false
      notIndexed: false
  - name: an oversized turn is alone, bounded and offers its full read
    directory: sparse 55 turn session
    loaded: [0]
    oversizedTurn: 9
    expect:
      maxCards: 14
      boundaryCount: 1
      boundarySides: [newer]
      captions:
        - 3 segments, 12 KiB
      filesScope: derived from 14 of 55 turns, 1 of 4 segments loaded
      continuationCount: 0
      truncation: true
      truncationCopy: 4 MiB
      notIndexed: false
  - name: a region that starts wordless marks a continuing action run
    directory: 32 mib session
    loaded: [1]
    expect:
      maxCards: 41
      boundaryCount: 2
      boundarySides: [older, newer]
      captions:
        - 1 segment, 1 MiB
        - 30 segments, 30 MiB
      filesScope: derived from 41 of 1312 turns, 1 of 32 segments loaded
      continuationCount: 1
      truncation: false
      notIndexed: false
  - name: two disjoint regions carry one gap boundary
    directory: sparse 55 turn session
    loaded: [0, 3]
    expect:
      maxCards: 27
      boundaryCount: 1
      boundarySides: [between]
      captions:
        - 2 segments, 8 KiB
      filesScope: derived from 27 of 55 turns, 2 of 4 segments loaded
      continuationCount: 1
      truncation: false
      notIndexed: false
  - name: a lone middle segment carries the older edge
    directory: sparse 55 turn session
    loaded: [2]
    expect:
      maxCards: 14
      boundaryCount: 2
      boundarySides: [older, newer]
      captions:
        - 2 segments, 8 KiB
        - 1 segment, 4 KiB
      filesScope: derived from 14 of 55 turns, 1 of 4 segments loaded
      continuationCount: 1
      truncation: false
      notIndexed: false
  - name: a held window beside a disjoint region keeps its gap boundary
    directory: sparse 55 turn session
    loaded: [1, 3]
    window:
      requestedAnchor: 30
      anchorTurn: 30
      span: 10
      firstTurn: 18
      lastTurn: 43
      segments: [1, 2]
      hasOlder: true
      hasNewer: true
    expect:
      maxCards: 27
      boundaryCount: 2
      boundarySides: [older, between]
      captions:
        - 1 segment, 4 KiB
        - 1 segment, 4 KiB
      filesScope: derived from 27 of 55 turns, 2 of 4 segments loaded
      heldCaptions: ['these turns are hidden because surrounding turns are not loaded']
      heldOrder: [boundary, held, boundary]
      continuationCount: 1
      truncation: false
      notIndexed: false
  - name: separated held segments keep their own ranges around a gap
    directory: sparse 55 turn session
    loaded: [0, 2, 3]
    window:
      requestedAnchor: 30
      anchorTurn: 30
      span: 10
      firstTurn: 4
      lastTurn: 45
      segments: [0, 1, 2]
      hasOlder: false
      hasNewer: true
    expect:
      maxCards: 41
      boundaryCount: 1
      boundarySides: [between]
      captions:
        - 1 segment, 4 KiB
      filesScope: derived from 41 of 55 turns, 3 of 4 segments loaded
      heldCaptions:
        - these turns are hidden because surrounding turns are not loaded
        - these turns are hidden because surrounding turns are not loaded
      heldOrder: [held, boundary, held]
      continuationCount: 1
      truncation: false
      notIndexed: false
  - name: held window without a loader stays honest
    directory: sparse 55 turn session
    loaded: [1, 3]
    noLoader: true
    window:
      requestedAnchor: 30
      anchorTurn: 30
      span: 10
      firstTurn: 18
      lastTurn: 43
      segments: [1, 2]
      hasOlder: true
      hasNewer: true
    expect:
      maxCards: 27
      boundaryCount: 2
      boundarySides: [older, between]
      captions: ['1 segment, 4 KiB', '1 segment, 4 KiB']
      filesScope: derived from 27 of 55 turns, 2 of 4 segments loaded
      heldCaptions: ['these turns are hidden because surrounding turns are not loaded']
      heldOrder: [boundary, held, boundary]
      continuationCount: 1
      truncation: false
      notIndexed: false
  - name: a single segment directory draws no boundary
    directory: single segment session
    loaded: [0]
    expect:
      maxCards: 10
      boundaryCount: 0
      boundarySides: []
      captions: []
      filesScope: derived from all 10 loaded turns
      continuationCount: 0
      truncation: false
      notIndexed: false
  - name: an empty directory is not indexed
    directory: empty session
    loaded: []
    expect:
      maxCards: 0
      boundaryCount: 0
      boundarySides: []
      captions: []
      filesScope: derived from 0 of 0 turns, 0 of 0 segments loaded
      continuationCount: 0
      truncation: false
      notIndexed: true

phaseCases:
  - name: phase starting at turn zero
    directory: single segment session
    loaded: [0]
    phase: {id: exploration, label: exploration, from: 0, to: 9, turnCount: 9}
    caption: 9 turns
  - name: phase starting mid transcript
    directory: sparse 55 turn session
    loaded: [2]
    phase: {id: implementation, label: implementation, from: 32, to: 45, errors: 1, turnCount: 13}
    caption: 13 turns, 1 error
  - name: precomputed phase without a count omits it
    directory: single segment session
    loaded: [0]
    phase: {id: exploration, label: exploration, from: 0, to: 9, errors: 1}
    caption: 1 error

phaseCountCases:
  - name: sparse phase counts conversation turns rather than indexes
    turns:
      - {index: 10, role: user, entryType: text, depth: 0, content: hello}
      - {index: 31, role: assistant, entryType: thinking, depth: 0, content: ''}
      - {index: 40, role: assistant, entryType: tool_use, depth: 0, content: ''}
      - {index: 55, role: assistant, entryType: text, depth: 0, content: done}
      - {index: 79, role: system, depth: 0, content: notice}
    expectedCount: 2
    expectedFrom: 10
    expectedTo: 79

recoveryCases:
  - name: a host reported failure can retry without a window loader
    mode: host-segment-only
    directory: sparse 55 turn session
    loaded: [1, 3]
    requests: [2, 2]
    restoredTurn: 18
    failureCopy: could not load that part of the transcript.
    retryCopy: try again
    window: {requestedAnchor: 30, anchorTurn: 30, span: 10, firstTurn: 18, lastTurn: 43, segments: [1, 2], hasOlder: true, hasNewer: true}
  - name: a rejected covering load names the window and retries successfully
    mode: covering-rejected
    directory: sparse 55 turn session
    loaded: [1, 3]
    requests: [2, 2]
    restoredTurn: 18
    failureCopy: could not load that part of the transcript.
    retryCopy: try again
    window: {requestedAnchor: 30, anchorTurn: 30, span: 10, firstTurn: 18, lastTurn: 43, segments: [1, 2], hasOlder: true, hasNewer: true}
  - name: a rejected window request names the window and retries successfully
    mode: window-rejected
    directory: sparse 55 turn session
    loaded: [0]
    requests: [30, 30]
    restoredTurn: 30
    failureCopy: could not load that part of the transcript.
    retryCopy: try again
    window: {requestedAnchor: 30, anchorTurn: 30, span: 10, firstTurn: 18, lastTurn: 43, segments: [1, 2], hasOlder: true, hasNewer: true}
  - name: a host reported covering failure names the window and retries
    mode: host-reported
    directory: sparse 55 turn session
    loaded: [1, 3]
    requests: [30]
    restoredTurn: 18
    failureCopy: could not load that part of the transcript.
    retryCopy: try again
    window: {requestedAnchor: 30, anchorTurn: 30, span: 10, firstTurn: 18, lastTurn: 43, segments: [1, 2], hasOlder: true, hasNewer: true}
  - name: a rejected segment load enables retry
    mode: rejected
    directory: sparse 55 turn session
    loaded: [0]
    requests: [1, 1]
  - name: a void segment load remains retryable
    mode: void
    directory: sparse 55 turn session
    loaded: [0]
    requests: [1, 1]
  - name: clearing a failed window allows the same request again
    mode: clear-window
    directory: sparse 55 turn session
    loaded: [1, 3]
    restoredTurn: 18
    requests: [2, 2]
    window:
      requestedAnchor: 30
      anchorTurn: 30
      span: 10
      firstTurn: 18
      lastTurn: 43
      segments: [1, 2]
      hasOlder: true
      hasNewer: true
# An empty assistant turn can continue model actions from an unloaded segment.
# An image is content of its own, so it is not that continuation even when its text is empty.
wordlessCases:
  - name: an empty assistant turn continues an action run
    turn:
      role: assistant
      content: ""
    wordless: true
  - name: an image-bearing assistant turn is content
    turn:
      role: assistant
      content: ""
      contentParts:
        - type: image
          image:
            ref: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    wordless: false
  - name: prose is not an action continuation
    turn:
      role: assistant
      content: a reply
    wordless: false

# Directories that carry conversation-turn positions. Every ref, span and total is a
# literal, as a producer sends them; nothing in the gate computes one. A row is a plain
# assistant reply unless it is listed: `userTurns` are prompts, `systemTurns` harness
# notices, `toolTurns` assistant rows holding only a tool call, `thinkingTurns` rows
# holding only thinking. Only prompts and replies are conversation turns.
positionDirectories:
  # 80 folded rows, 3 of them system rows: 77 conversation turns in 4 segments.
  - name: golden eighty rows
    totalTurns: 80
    totalConversationTurns: 77
    userTurns: [0, 20, 45, 62, 70]
    systemTurns: [5, 30, 66]
    segments:
      - {index: 0, firstTurn: 0, lastTurn: 19, byteLength: 1048576, conversationTurns: {before: 0, count: 19}}
      - {index: 1, firstTurn: 20, lastTurn: 44, byteLength: 1048576, conversationTurns: {before: 19, count: 24}}
      - {index: 2, firstTurn: 45, lastTurn: 61, byteLength: 1048576, conversationTurns: {before: 43, count: 17}}
      - {index: 3, firstTurn: 62, lastTurn: 79, byteLength: 1048576, conversationTurns: {before: 60, count: 17}}
  # The same session with turn identities that start at 500.
  - name: golden rows with identities from 500
    totalTurns: 80
    totalConversationTurns: 77
    userTurns: [500, 520, 545, 562, 570]
    systemTurns: [505, 530, 566]
    segments:
      - {index: 0, firstTurn: 500, lastTurn: 519, byteLength: 1048576, conversationTurns: {before: 0, count: 19}}
      - {index: 1, firstTurn: 520, lastTurn: 544, byteLength: 1048576, conversationTurns: {before: 19, count: 24}}
      - {index: 2, firstTurn: 545, lastTurn: 561, byteLength: 1048576, conversationTurns: {before: 43, count: 17}}
      - {index: 3, firstTurn: 562, lastTurn: 579, byteLength: 1048576, conversationTurns: {before: 60, count: 17}}
  # The middle segment holds one reply and one tool row.
  - name: one turn middle segment
    totalTurns: 80
    totalConversationTurns: 77
    userTurns: [0, 22]
    systemTurns: [5, 40]
    toolTurns: [21]
    segments:
      - {index: 0, firstTurn: 0, lastTurn: 19, byteLength: 1048576, conversationTurns: {before: 0, count: 19}}
      - {index: 1, firstTurn: 20, lastTurn: 21, byteLength: 4096, conversationTurns: {before: 19, count: 1}}
      - {index: 2, firstTurn: 22, lastTurn: 79, byteLength: 1048576, conversationTurns: {before: 20, count: 57}}
  # The middle segment holds two tool rows and one thinking row: no conversation turn.
  - name: no turn middle segment
    totalTurns: 82
    totalConversationTurns: 77
    userTurns: [0, 23]
    systemTurns: [5, 40]
    toolTurns: [20, 21]
    thinkingTurns: [22]
    segments:
      - {index: 0, firstTurn: 0, lastTurn: 19, byteLength: 1048576, conversationTurns: {before: 0, count: 19}}
      - {index: 1, firstTurn: 20, lastTurn: 22, byteLength: 12288, conversationTurns: {before: 19, count: 0}}
      - {index: 2, firstTurn: 23, lastTurn: 81, byteLength: 1048576, conversationTurns: {before: 19, count: 58}}
  # Five segments; the third holds two tool rows and no conversation turn.
  - name: empty third of five
    totalTurns: 32
    totalConversationTurns: 30
    userTurns: [0, 24]
    toolTurns: [15, 16]
    segments:
      - {index: 0, firstTurn: 0, lastTurn: 9, byteLength: 4096, conversationTurns: {before: 0, count: 10}}
      - {index: 1, firstTurn: 10, lastTurn: 14, byteLength: 4096, conversationTurns: {before: 10, count: 5}}
      - {index: 2, firstTurn: 15, lastTurn: 16, byteLength: 4096, conversationTurns: {before: 15, count: 0}}
      - {index: 3, firstTurn: 17, lastTurn: 23, byteLength: 4096, conversationTurns: {before: 15, count: 7}}
      - {index: 4, firstTurn: 24, lastTurn: 31, byteLength: 4096, conversationTurns: {before: 22, count: 8}}
  # Six segments read three refs to a page.
  - name: six segments in two pages
    totalTurns: 77
    totalConversationTurns: 77
    userTurns: [0, 43]
    segments:
      - {index: 0, firstTurn: 0, lastTurn: 11, byteLength: 1048576, conversationTurns: {before: 0, count: 12}}
      - {index: 1, firstTurn: 12, lastTurn: 24, byteLength: 1048576, conversationTurns: {before: 12, count: 13}}
      - {index: 2, firstTurn: 25, lastTurn: 42, byteLength: 1048576, conversationTurns: {before: 25, count: 18}}
      - {index: 3, firstTurn: 43, lastTurn: 52, byteLength: 1048576, conversationTurns: {before: 43, count: 10}}
      - {index: 4, firstTurn: 53, lastTurn: 64, byteLength: 1048576, conversationTurns: {before: 53, count: 12}}
      - {index: 5, firstTurn: 65, lastTurn: 76, byteLength: 1048576, conversationTurns: {before: 65, count: 12}}
  - name: five segments of seventy seven
    totalTurns: 77
    totalConversationTurns: 77
    userTurns: [0, 19, 40, 52, 65]
    segments:
      - {index: 0, firstTurn: 0, lastTurn: 18, byteLength: 4096, conversationTurns: {before: 0, count: 19}}
