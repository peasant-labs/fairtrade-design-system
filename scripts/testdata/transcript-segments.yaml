# What a reader sees for a position directory and a set of loaded segments. Optional
# inputs: `refs` keeps one received directory page, `withoutPositions` is a server older
# than the position fields, `dropSpans` removes single spans, `dropTurns` removes turns
# the adapter merged away, `hiddenCategories` turns filter categories off, `thenLoaded`
# rerenders with more segments, and `jump` rejects a window request for a turn that is
# not held. `sliderAt` states the slider's value text with a given segment active.
# Every expected string is the literal copy; `absent` lists numbers that must not appear.
positionCases:
  - name: eighty rows with three system rows
    directory: golden eighty rows
    loaded: [0, 2, 3]
    expect:
      header: 53 of 77 turns
      captions: ['turns 20–43 of 77']
      labels: ['load more, segment, turns 20–43 of 77']
      filesScope: derived from 53 of 77 turns, 3 of 4 segments loaded
      tickTitles: ['turns 1–19', 'turns 20–43', 'turns 44–60', 'turns 61–77']
      absent: ['55', '79']
  - name: a gap with one conversation turn
    directory: one turn middle segment
    loaded: [0, 2]
    expect:
      header: 76 of 77 turns
      captions: ['turn 20 of 77']
      labels: ['load more, segment, turn 20 of 77']
      filesScope: derived from 76 of 77 turns, 2 of 3 segments loaded
      tickTitles: ['turns 1–19', 'turn 20', 'turns 21–77']
  - name: a gap with no conversation turns
    directory: no turn middle segment
    loaded: [0, 2]
    expect:
      header: 77 of 77 turns
      captions: ['no conversation turns, 1 segment, 12 KiB']
      labels: ['load more, segment, no conversation turns, 1 segment, 12 KiB']
      loads: 1
      filesScope: derived from 77 of 77 turns, 2 of 3 segments loaded
      tickTitles: ['turns 1–19', 'no conversation turns', 'turns 20–77']
  - name: a three segment gap with an empty middle
    directory: empty third of five
    loaded: [0, 4]
    expect:
      header: 18 of 30 turns
      captions: ['turns 11–22 of 30']
      labels: ['load more, 3 segments, turns 11–22 of 30']
      filesScope: derived from 18 of 30 turns, 2 of 5 segments loaded
      tickTitles: ['turns 1–10', 'turns 11–15', 'no conversation turns', 'turns 16–22', 'turns 23–30']
  - name: a directory holding only its second page
    directory: six segments in two pages
    refs: [3, 4, 5]
    loaded: [3]
    expect:
      header: 10 of 77 turns
      captions: ['turns 54–77 of 77']
      labels: ['load more, 2 segments, turns 54–77 of 77']
      filesScope: derived from 10 of 77 turns, 1 of 6 segments loaded
  - name: a gap that reaches into a page not received names no position
    directory: six segments in two pages
    refs: [3, 4, 5]
    loaded: [4]
    expect:
      header: 12 of 77 turns
      captions: ['1 segment, 1 MiB', 'turns 66–77 of 77']
      labels: ['load more, segment, 1 segment, 1 MiB', 'load more, segment, turns 66–77 of 77']
      filesScope: derived from 12 of 77 turns, 1 of 6 segments loaded
  - name: an older server sends no positions
    directory: golden eighty rows
    withoutPositions: true
    loaded: [0, 2, 3]
    jump: {turn: 30}
    expect:
      header: 53 of 80 turns
      captions: ['1 segment, 1 MiB']
      labels: ['load more, segment, 1 segment, 1 MiB']
      filesScope: derived from 55 of 80 turns, 3 of 4 segments loaded
      tickTitles: ['segment 1 of 4', 'segment 2 of 4', 'segment 3 of 4', 'segment 4 of 4']
      valueText: segment 3 of 4
      failure: could not load that part of the transcript.
      silent: true
  - name: the header keeps one unit while loading and when complete
    directory: five segments of seventy seven
    loaded: [0, 1]
    thenLoaded: [0, 1, 2, 3, 4]
    expect:
      header: 40 of 77 turns
      thenHeader: 77 turns
      captions: ['turns 41–77 of 77']
      labels: ['load more, 3 segments, turns 41–77 of 77']
      filesScope: derived from 40 of 77 turns, 2 of 5 segments loaded
  - name: a fully loaded session whose adapter dropped a duplicate
    directory: golden eighty rows
    loaded: [0, 1, 2, 3]
    dropTurns: [10]
    expect:
      header: 77 turns
      captions: []
      labels: []
      filesScope: derived from all 77 loaded turns
  - name: a fully loaded session with a filter on
    directory: golden eighty rows
    loaded: [0, 1, 2, 3]
    hiddenCategories: [prompts]
    expect:
      header: 72 of 77 turns
      captions: []
      labels: []
      filesScope: derived from all 77 loaded turns
  - name: scrubber ticks and the jump failure name positions
    directory: twelve segments of seventy seven
    loaded: [0]
    jump: {turn: 40}
    expect:
      header: 20 of 77 turns
      captions: ['turns 21–77 of 77']
      labels: ['load more, 11 segments, turns 21–77 of 77']
      filesScope: derived from 20 of 77 turns, 1 of 12 segments loaded
      tickTitles: ['turns 1–20', 'turns 21–35', 'turns 36–60', 'turns 61–62', 'turns 63–64', 'turns 65–66', 'turns 67–68', 'turns 69–70', 'turns 71–72', 'turns 73–74', 'turns 75–76', 'turn 77']
      valueText: turns 1–20 of 77
      failure: could not load the window around turns 36–60.
  - name: the slider names the active position
    directory: twelve segments of seventy seven
    loaded: [2]
    expect:
      header: 25 of 77 turns
      captions: ['turns 1–35 of 77', 'turns 61–77 of 77']
      labels: ['load more, 2 segments, turns 1–35 of 77', 'load more, 9 segments, turns 61–77 of 77']
      filesScope: derived from 25 of 77 turns, 1 of 12 segments loaded
      valueText: turns 36–60 of 77
      sliderAt: {segment: 11, valueText: turn 77 of 77}
  - name: a tick without a span names its segment
    directory: twelve segments of seventy seven
    dropSpans: [2]
    loaded: [0]
    jump: {turn: 40}
    expect:
      header: 20 of 77 turns
      captions: ['11 segments, 44 KiB']
      labels: ['load more, 11 segments, 11 segments, 44 KiB']
      filesScope: derived from 20 of 77 turns, 1 of 12 segments loaded
      tickTitles: ['turns 1–20', 'turns 21–35', 'segment 3 of 12', 'turns 61–62', 'turns 63–64', 'turns 65–66', 'turns 67–68', 'turns 69–70', 'turns 71–72', 'turns 73–74', 'turns 75–76', 'turn 77']
      valueText: turns 1–20 of 77
      failure: could not load that part of the transcript.
  - name: the slider on a segment with no conversation turns names the segment
    directory: no turn middle segment
    loaded: [1]
    expect:
      header: 0 of 77 turns
      captions: ['turns 1–19 of 77', 'turns 20–77 of 77']
      labels: ['load more, segment, turns 1–19 of 77', 'load more, segment, turns 20–77 of 77']
      filesScope: derived from 0 of 77 turns, 1 of 3 segments loaded
      sliderAt: {segment: 1, valueText: 'no conversation turns, segment 2 of 3'}
  - name: the files sentence counts conversation turns
    directory: five segments of seventy seven
    loaded: [0, 1]
    expect:
      header: 40 of 77 turns
      captions: ['turns 41–77 of 77']
      labels: ['load more, 3 segments, turns 41–77 of 77']
      filesScope: derived from 40 of 77 turns, 2 of 5 segments loaded
  - name: a sparse directory never prints a turn id as a position
    directory: golden rows with identities from 500
    loaded: [0, 2, 3]
    jump: {turn: 530}
    expect:
      header: 53 of 77 turns
      captions: ['turns 20–43 of 77']
      labels: ['load more, segment, turns 20–43 of 77']
      filesScope: derived from 53 of 77 turns, 3 of 4 segments loaded
      tickTitles: ['turns 1–19', 'turns 20–43', 'turns 44–60', 'turns 61–77']
      failure: could not load the window around turns 20–43.
      absent: ['500', '520', '544', '579']

# A whole transcript, with no directory: the header counts conversation turns among the
# turns it holds. Each row lists cooked turns and the literal header.
countCases:
  - name: tool and thinking rows are not counted
    turns:
      - {index: 0, role: user, entryType: text, depth: 0, content: fix the build}
      - {index: 1, role: assistant, entryType: thinking, depth: 0, content: '', thinking: {text: read the log first, words: 4}}
      - {index: 2, role: assistant, entryType: tool_use, depth: 0, content: '', tool: true}
      - {index: 3, role: system, depth: 0, content: mode changed}
      - {index: 4, role: assistant, entryType: text, depth: 1, content: a helper reply}
      - {index: 5, role: assistant, entryType: text, depth: 0, content: the build passes}
    header: 2 turns
  - name: a reply with prose and tool calls is counted
    turns:
      - {index: 0, role: user, entryType: text, depth: 0, content: fix the build}
      - {index: 1, role: assistant, entryType: text, depth: 0, content: reading the log, tool: true}
      - {index: 2, role: user, entryType: image, depth: 0, content: ''}
    header: 3 turns
  # No directory total: the header still groups digits. `generated` appends that many
  # alternating user and assistant text turns after `turns`.
  - name: a thousand held turns group their digits
    turns: []
    generated: 1200
    header: 1,200 turns
  - name: a filtered thousand groups both counts
    turns: []
    generated: 2400
    hiddenCategories: [prompts]
    header: 1,200 of 2,400 turns

# The hero prints the count a reader is shown, and the folded count only when the
# producer measured no conversation count.
heroCases:
  - name: the hero prints the conversation count
    turnCount: 80
    conversationTurnCount: 77
    hero: 77 turns
  - name: the hero falls back to turnCount
    turnCount: 80
    hero: 80 turns
