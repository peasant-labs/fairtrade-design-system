# Required-NAME manifest for card-insets.yaml: deletion protection for the screens and viewports
# the card inset gate measures.
requiredScreenNames:
  - local settings
  - account settings
  - collective settings
requiredViewportNames:
  - desktop
  - phone
requiredMutationNames:
  - the card padding shrinks
  - a row loses its side padding
  - an idle status reserves room after the control
  - a control overflows its row
  - the help line is indented
  - a long value sits in a column of its own
  - a divider stops short of the card
  - a phone text value is indented under its label
