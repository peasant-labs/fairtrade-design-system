# Required-NAME manifest for app-sidebar.yaml: deletion protection. The gate asserts the case names
# equal this list exactly, as a set, and parts-mutations.mjs proves each production mutation below
# turns the gate red for the named reason.
requiredCaseNames:
  - items render as links and buttons
  - a button item reports its id
  - group labels and landmarks
  - the sidebar keeps one order
  - the theme toggle names the theme it switches to
  - search opens the app's search
  - the brand is the mark alone
  - the switcher leaves out the current app
  - every other app with an address is listed
  - every switcher ends with community as soon
  - a community entry of the app's own replaces the soon one
  - an entry's own target is kept
  - every app gets the same slot order
  - a tagged entry with no address is text
  - the toggle collapses to a rail
  - collapsed state and width persist
  - stored values are restored and clamped
  - a throwing localStorage still renders
  - a null storage key writes nothing
  - keyboard resize clamps to the bounds
  - the account row links to the account
  - the account row without an href is text
  - an account slot replaces the row
  - the menu opens and closes the drawer
  - one indicator slides between current items
  - a link component receives the item props

requiredMutationNames:
  - the current item loses aria-current
  - the width is not clamped
  - the collapsed state is not written
  - the external suffix is dropped
  - the switcher lists apps it cannot reach
  - the switcher lists the current app
  - another app opens in the same tab
  - the brand shows the wordmark
  - the collapse handle leaves the brand row
  - the footer loses the theme toggle
  - search leaves the sidebar
  - the theme toggle names the current theme
  - community is not marked disabled
  - the switcher drops community
  - escape does not close the drawer
  - a storage read can throw
  - the indicator slides on its first placement
  - the menu button never becomes the close control
  - the drawer items lose their stagger order
mutations:
  - name: the current item loses aria-current
    file: src/ui/AppSidebar.jsx
    find: "const ariaCurrent = current ? 'page' : undefined"
    replace: "const ariaCurrent = undefined"
    expectedDiagnostic: "items render as links and buttons: home aria-current"
  - name: the width is not clamped
    file: src/ui/AppSidebar.jsx
    find: "const clampWidth = (value, min, max) => Math.min(max, Math.max(min, value))"
    replace: "const clampWidth = (value) => value"
    expectedDiagnostic: "keyboard resize clamps to the bounds: after End then ArrowRight"
  - name: the collapsed state is not written
    file: src/ui/AppSidebar.jsx
    find: "if (storageKey) writeStored(`${storageKey}.collapsed`, String(next))"
    replace: "void next"
    expectedDiagnostic: "collapsed state and width persist: storage"
  - name: the external suffix is dropped
    file: src/ui/AppSidebar.jsx
    find: '<span className="asb-sr">{suffix}</span>'
    replace: 'null'
    expectedDiagnostic: "items render as links and buttons: collectives text"
  - name: the switcher lists apps it cannot reach
    file: src/ui/AppSidebar.jsx
    find: "const shown = withCommunity.filter((entry) => entry.id !== app && (entry.href || entry.tag || entry.soon))"
    replace: "const shown = withCommunity.filter((entry) => entry.id !== app)"
    expectedDiagnostic: "the switcher leaves out the current app: switcher entries"
  - name: the switcher lists the current app
    file: src/ui/AppSidebar.jsx
    find: "const shown = withCommunity.filter((entry) => entry.id !== app && (entry.href || entry.tag || entry.soon))"
    replace: "const shown = withCommunity.filter((entry) => entry.href || entry.tag || entry.soon)"
    expectedDiagnostic: "the switcher leaves out the current app: switcher entries"
  - name: another app opens in the same tab
    file: src/ui/AppSidebar.jsx
    find: "const target = entry.target ?? '_blank'"
    replace: "const target = entry.target"
    expectedDiagnostic: "every other app with an address is listed: switcher entries"
  - name: the brand shows the wordmark
    file: src/ui/AppSidebar.jsx
    find: '<span className="asb-sr">{brand}</span>'
    replace: '<span className="asb-wordmark">{brand}</span>'
    expectedDiagnostic: "the brand is the mark alone: the brand is the mark alone"
  - name: the collapse handle leaves the brand row
    file: src/ui/AppSidebar.jsx
    find: '<div className="asb-top">'
    replace: '<div className="asb-head">'
    expectedDiagnostic: "the toggle collapses to a rail: before the toggle"
  - name: escape does not close the drawer
    file: src/ui/AppSidebar.jsx
    find: "if (e.key === 'Escape') {"
    replace: "if (e.key === 'Esc') {"
    expectedDiagnostic: "the menu opens and closes the drawer: Escape"
  - name: a storage read can throw
    file: src/ui/AppSidebar.jsx
    find: "return globalThis.localStorage?.getItem(key) ?? null\n  } catch {\n    return null\n  }"
    replace: "return globalThis.localStorage?.getItem(key) ?? null\n  } finally {\n    void 0\n  }"
    expectedDiagnostic: "a throwing localStorage still renders"
  - name: the indicator slides on its first placement
    file: src/ui/AppSidebar.jsx
    find: "const animate = placedForRef.current !== null && placedForRef.current !== currentId"
    replace: "const animate = true"
    expectedDiagnostic: "one indicator slides between current items: the first placement"
  - name: the menu button never becomes the close control
    file: src/ui/AppSidebar.jsx
    find: "aria-label={drawerOpen ? 'close the menu' : 'open the menu'}"
    replace: "aria-label=\"open the menu\""
    expectedDiagnostic: "the menu opens and closes the drawer: the open menu button"
  - name: the drawer items lose their stagger order
    file: src/ui/AppSidebar.jsx
    find: "<li key={item.id} style={{ '--asb-i': listIndex++ }}>"
    replace: "<li key={item.id} style={{ '--asb-i': 0 }}>"
    expectedDiagnostic: "the menu opens and closes the drawer: the"
  - name: the footer loses the theme toggle
    file: src/ui/AppSidebar.jsx
    find: "{showTheme ? <ThemeItem theme={theme} onThemeChange={onThemeChange} /> : null}"
    replace: "null"
    expectedDiagnostic: "the sidebar keeps one order: the sidebar order"
  - name: search leaves the sidebar
    file: src/ui/AppSidebar.jsx
    find: "{search ? <SearchItem search={search} onNavigate={onNavigate} index={listIndex++} /> : null}"
    replace: "{null}"
    expectedDiagnostic: "the sidebar keeps one order: the sidebar order"
  - name: the theme toggle names the current theme
    file: src/ui/AppSidebar.jsx
    find: "const next = theme === 'light' ? 'dark' : 'light'"
    replace: "const next = theme"
    expectedDiagnostic: "the theme toggle names the theme it switches to: the toggle must read"
  - name: community is not marked disabled
    file: src/ui/AppSidebar.jsx
    find: 'className="asb-item asb-item-soon" aria-disabled="true"'
    replace: 'className="asb-item asb-item-soon"'
    expectedDiagnostic: "every switcher ends with community as soon: the soon entry"
  - name: the switcher drops community
    file: src/ui/AppSidebar.jsx
    find: "? apps : [...apps, COMMUNITY_SOON]"
    replace: "? apps : apps"
    expectedDiagnostic: "every app gets the same slot order: the last switcher entry"
