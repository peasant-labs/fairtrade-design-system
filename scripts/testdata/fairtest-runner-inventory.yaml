# Required Fairtest command, runner, and guidance inventory.
# Static, deterministic, and browser-free. This file declares the command names,
# runner sources, and contributor guidance that later package and CI work must
# implement. It starts no service and requires no browser.
# Child contract commands run as pnpm --filter @peasant-labs/fairtest <name>.
# The local bridge command never enters required CI.
commands:
  - name: test:fairtest:promotion
    invocation: pnpm test:fairtest:promotion
    owner: promotion-guardrails
    stage: browser-free
    runner: none
  - name: test:core
    invocation: pnpm --filter @peasant-labs/fairtest test:core
    owner: fairtest-core
    stage: browser-free
    runner: child-contract
  - name: test:adapter
    invocation: pnpm --filter @peasant-labs/fairtest test:adapter
    owner: fairtest-core
    stage: browser-free
    runner: child-contract
  - name: test:evidence
    invocation: pnpm --filter @peasant-labs/fairtest test:evidence
    owner: fairtest-core
    stage: browser-free
    runner: child-contract
  - name: test:bridge-contract
    invocation: pnpm --filter @peasant-labs/fairtest test:bridge-contract
    owner: fairtest-core
    stage: browser-free
    runner: child-contract
  - name: test:fairtest:init
    invocation: pnpm test:fairtest:init
    owner: evidence-ci
    stage: pre-service
    runner: none
  - name: test:fairtest:inventory
    invocation: pnpm test:fairtest:inventory
    owner: promotion-guardrails
    stage: pre-service
    runner: none
  # REQUIRED-CI MOUNT: ENFORCED. The Fairtest required-CI job runs this cheap
  # browser-free guard in its contracts step before any service starts, so the
  # pinned upload SHA, the always-run preflight/upload, the bounded retention,
  # and the 24-minute budget are guarded in required CI rather than merely
  # declared.
  - name: test:fairtest:envelope
    invocation: pnpm test:fairtest:envelope
    owner: promotion-guardrails
    stage: browser-free
    runner: none
  - name: test:fairtest:list:ci
    invocation: pnpm test:fairtest:list:ci
    owner: evidence-ci
    stage: pre-service
    runner: none
  - name: test:fairtest:list:local
    invocation: pnpm test:fairtest:list:local
    owner: evidence-ci
    stage: pre-service
    runner: none
  - name: test:fairtest:select
    invocation: pnpm test:fairtest:select
    owner: evidence-ci
    stage: pre-service
    runner: none
  - name: test:fairtest:selection-receipt
    invocation: pnpm test:fairtest:selection-receipt
    owner: evidence-ci
    stage: pre-service
    runner: none
  - name: test:fairtest:process
    invocation: pnpm test:fairtest:process
    owner: local-bridge
    stage: process
    runner: process-only
  - name: test:fairtest:mounted
    invocation: pnpm test:fairtest:mounted
    owner: mounted-proofs
    stage: mounted
    runner: playwright-one-project
  # REQUIRED-CI MOUNT: ENFORCED for the mounted command. The Fairtest required-CI
  # job in .github/workflows/ci.yml invokes it twice (--target=product and
  # --target=component) after the clean app and Storybook builds, so a green CI
  # run proves the mounted rows ran. DEFERRED for the product-contract command,
  # which remains the required local contract but is not yet invoked by a
  # required workflow; two of its seven suites open real browsers and throwaway
  # loopback listeners, so it runs in one node --test invocation with
  # --test-concurrency=1.
  - name: test:fairtest:product-contract
    invocation: pnpm test:fairtest:product-contract
    owner: mounted-proofs
    stage: mounted
    runner: process-only
  # REQUIRED-CI MOUNT: ENFORCED for the browser-neutral verifier. The Fairtest
  # required-CI job invokes it after the mounted producers, so the verifier is
  # enforced rather than merely declared. The preflight command runs after it,
  # with `if: always()`, and the whole run root uploads with a pinned action.
  - name: test:fairtest:verify
    invocation: pnpm test:fairtest:verify
    owner: evidence-ci
    stage: verify
    runner: none
  - name: test:fairtest:preflight
    invocation: pnpm test:fairtest:preflight
    owner: evidence-ci
    stage: verify
    runner: none
  - name: test:fairtest:compat
    invocation: pnpm test:fairtest:compat
    owner: evidence-ci
    stage: verify
    runner: none
  # REQUIRED-CI MOUNT: ENFORCED. The Fairtest required-CI job runs this cheap
  # browser-free SurfaceGate compatibility gate in its contracts step, so a
  # floor, threshold, legacy return-key, digest, source-route, or importer
  # regression actually turns required CI red.
  - name: fairtest dev
    invocation: pnpm fairtest dev -- --target=product
    owner: local-bridge
    stage: local-only
    runner: local-bridge
# Runner and documentation sources. Playwright is the required repeatable
# runner. Puppeteer stays focused compatibility and local evidence only.
# The optional attach target is local exploration only, never a CI oracle.
runners:
  - name: fairtest-mounted-rows
    owner: mounted-proofs
    model: one-project-row-scoped
    themeBinding: row-key
    ciOracle: true
  - name: playwright-required-catalog
    owner: existing
    model: existing-catalog
    themeBinding: none
    ciOracle: true
  - name: puppeteer-focused-compat
    owner: evidence-ci
    model: focused-compat
    themeBinding: none
    ciOracle: false
  - name: agent-browser-optional-attach
    owner: local-bridge
    model: local-attach
    themeBinding: none
    ciOracle: false
# Tracked contributor guidance. Only these paths carry runner, command, or
# workflow meaning for this inventory. Any other guidance file is unknown.
guidance:
  - path: docs/testing/test-promotion.md
    owner: promotion-guardrails
    topic: promotion
  - path: scripts/journey/README.md
    owner: promotion-guardrails
    topic: runner-inventory
  - path: AGENTS.md
    owner: promotion-guardrails
    topic: terminology
  - path: CONTRIBUTING.md
    owner: promotion-guardrails
    topic: terminology
  - path: .github/workflows/ci.yml
    owner: evidence-ci
    topic: workflow
# Forbidden stale-guidance fragments. None of these phrases may appear in any
# tracked guidance file above: they describe the retired runner model
# (unfiltered Puppeteer catalog, two-project rows, project-name theme
# inference, agent-browser as a CI oracle). Each entry is matched
# case-insensitively against the full file text.
forbiddenGuidanceFragments:
  - name: stale-puppeteer-catalog
    fragment: unfiltered puppeteer catalog
  - name: stale-two-project-model
    fragment: two-project
  - name: stale-two-projects-plural
    fragment: two projects
  - name: stale-project-name-theme
    fragment: project-name
  - name: stale-agent-browser-oracle
    fragment: agent-browser as
