records:
  - name: example-mounted-product-proof
    answers:
      subject: The real mounted product can pass with a false theme, missing shell, stale served build, or unproven section.
      necessity: Pure value and contract tests cannot observe DOM structure, computed styles, browser input, service readiness, or served bytes, so a mounted row is required for this named risk.
      productionPath: The built dist/ Fairtrade graph product under the actual Playwright host via FAIRTEST_RUN_ROOT=<run-root> pnpm test:fairtest:mounted -- --target=product.
      cost: Two bounded theme rows, one browser and service lifecycle, one named map-section action, and six small artifacts per row, inside the existing job budget with no retries.
      lifetime: One immutable run root created fresh per run plus one loopback service, cleaned up in finally on success, failure, timeout, and interruption.
      concurrency: One product row at a time; row identity plus the immutable run root prevent stale or cross-run output.
      ciParity: The exact command runs after a clean build in the pinned Playwright container; no local demo or external service is assumed. The pinned job's mounted steps invoke it for both targets, so a green CI run proves the rows ran.
      evidence: Computed styles, ARIA tree, axe report, screenshot, resolution, normalized theme observation, and served-build provenance with asset digests.
      mutation: A wrong theme, missing selector or part, unregistered action, missing artifact, or stale served asset kills the row for the intended reason.
      exitCondition: Remove or simplify the mounted row when a lower-level gate or an existing journey proves the same named risk.
    lowerLayer:
      result: promote
      detail: Value, contract, and fixture checks cover shape, policy, and proof assembly only; none observes the mounted shell, served bytes, or real input, so the elaborate row is justified.
    decision:
      verdict: approve
      rationale: All ten answers are present, the lower layer cannot observe the named risk, and the execution policy is bounded to two rows with no retries.
    executionPolicy:
      runner: Row-scoped mounted runner against the built dist/ target only.
      budget: Two theme rows inside the existing job budget with no retries.
      cleanup: Adapter service and run root are released in a finally step on every exit path.
    exitCondition: Reuse an equivalent existing journey or delete the row once a lower-level gate proves the same named risk.
  - name: example-mounted-component-proof
    answers:
      subject: A mounted check that one component story mounts its root, answers one interaction, and reports ARIA and token evidence.
      necessity: Server-free checks cannot observe direct story mounting, real input behavior, or story theme globals.
      productionPath: The built storybook-static direct iframe for one named story and its documented root node.
      cost: Two bounded component rows and six small artifacts; no app service, product row, or catalog duplicate.
      lifetime: One run root and one loopback storybook port with deterministic cleanup on every exit path.
      concurrency: Component row identity is separate from product rows and cannot share a protected producer key.
      ciParity: The exact component command runs after a clean storybook build in the pinned container.
      evidence: Mounted root, interaction result, ARIA, computed tokens, axe output, screenshot, resolution, and provenance.
      mutation: A missing root, wrong theme, missing interaction, or product-shaped proof kills the component owner.
      exitCondition: Keep only named component risks; remove the row if an existing journey proves the same behavior without mounting.
    lowerLayer:
      result: promote
      detail: Unit checks cover adapter values only; none observes the mounted story root or real click behavior.
    decision:
      verdict: approve
      rationale: The component risk needs a mounted story target, the policy is component-only, and the exit condition is explicit.
    executionPolicy:
      runner: Row-scoped mounted runner against the built storybook target only.
      budget: Two theme rows inside the existing job budget with no retries.
      cleanup: Storybook service and run root are removed in a finally step on every exit path.
    exitCondition: Delete the row when an existing journey or lower-level component check proves the same named behavior.
  - name: example-browser-free-boundary
    answers:
      subject: A browser-free check that shared validation values stay free of browser, DOM, and app route knowledge.
      necessity: A mounted test cannot observe module resolution or source imports; only a direct source guard observes this boundary.
      productionPath: Frozen install followed by a browser-free command run from a clean checkout with browser packages unavailable.
      cost: Browser-free node checks over named fixtures; no service, browser, or temporary output beyond a scratch directory.
      lifetime: Temporary scratch directories are removed in a finally step; no persistent process or database is created.
      concurrency: Unique temporary roots and read-only fixture inputs; no shared package output is written.
      ciParity: The exact command runs in the pinned toolchain from a clean checkout.
      evidence: Machine-readable pass or fail plus fixture and mutation diagnostics naming the offending import.
      mutation: A browser or app import injected into the guarded surface fails at the owning guard for the intended symbol.
      exitCondition: Simplify the guard when a direct package or value check proves the same boundary without a dedicated script.
    lowerLayer:
      result: retain
      detail: A direct import scan already observes this boundary, so no mounted or elaborate layer is added for it.
    decision:
      verdict: reject
      rationale: The lower layer observes the risk, so promoting an elaborate test is refused under the lower-layer-first rule.
    executionPolicy:
      runner: Plain node command with no service, browser, or network access.
      budget: Seconds of local compute inside the existing browser-free contracts step.
      cleanup: Scratch directories are removed in a finally step on every exit path.
    exitCondition: Remove this record family if the boundary moves into a lower-level package check that proves the same invariant.
  - name: fairtest-type-program-coverage-guard
    answers:
      subject: The Fairtest type program must cover exactly the intended files, and no covered file may carry a suppression directive or an unrecorded explicit-any type position.
      necessity: A pragma-presence check alone cannot see a file that carries both the pragma and a refused suppression directive, and it cannot see the include globs narrowed underneath it; only a metadata scan plus a comparison against the compiler's own file list observes the real program membership.
      productionPath: node scripts/fairtest/assert-ts-check-coverage.mjs over the real tree, spawning the pinned tsc -p tsconfig.fairtest.json --listFiles for the program comparison.
      cost: One browser-free node process plus one tsc --listFiles invocation over the covered roots; no service, browser, network, or durable output.
      lifetime: No temporary files or directories are created; the tsc subprocess is bounded by spawnSync and exits before the guard returns.
      concurrency: Read-only over the tree; the tsc invocation writes nothing because the program sets noEmit true, so two runs cannot interfere.
      ciParity: The exact command pnpm test:fairtest:type-coverage runs from a clean checkout with the pinned typescript and yaml devDependencies in the browser-free contracts step of the pinned Fairtest CI job (test:fairtest:types, test:fairtest:type-coverage, test:fairtest:paths, test:fairtest:boundary), so a covered file that opts out or plants a suppression directive turns required CI red.
      evidence: A machine-readable pass line reporting walked, checked, and vendored counts, the acknowledged-any totals, and the parity result, plus named diagnostics for every rule.
      mutation: Eight named mutations (missing pragma, vendored banner added and removed, planted suppression directives, planted and dropped explicit any, dropped-from-program) each fail the named rule for the intended file or token.
      exitCondition: Fold the checks into a lower-level program or compiler integration if one can observe program membership and suppression metadata directly.
    lowerLayer:
      result: promote
      detail: A plain unit test cannot observe the compiler's actual program membership or a suppression directive the compiler honors silently, so the metadata comparison is justified.
    decision:
      verdict: approve
      rationale: The guard protects the type program's whole payoff, the lower layer cannot observe the same invariant, and its cost is one bounded browser-free process.
    executionPolicy:
      runner: Plain node command with the pinned typescript spawned as a child; no service, browser, or network access.
      budget: Seconds of local compute inside the existing browser-free contracts step; one tsc --listFiles over the covered roots.
      cleanup: No temporary state is created; the child process is bounded and reaped by spawnSync on every exit path.
    exitCondition: Fold the checks into a lower-level program or compiler integration if one can observe program membership and suppression metadata directly.
  - name: fairtest-target-dispatch-guard
    answers:
      subject: No scanned module under scripts/fairtest/ may branch on the host kind, except the two target-declaration modules and the mounted CLI dispatcher; the scan skips test modules. Every scanned module must read the kind, id, capabilities, fixtures, and actions from the target value's own fields.
      necessity: A value, contract, or fixture test observes the target object's shape and the adapter's behaviour, but it cannot see the source of an arbitrary app module; only a source scan over the real tree catches a new kind === 'product' / kind === 'component' branch that would become a second, disagreeing discriminator.
      productionPath: pnpm test:fairtest:dispatch (node scripts/fairtest/assert-target-dispatch.mjs) runs the guard as its own CLI command over the real scripts/fairtest directory, refusing a host-kind branch outside the declaration and view-construction modules.
      cost: The guard is one browser-free source scan with one readdir plus one readFile per scanned .mjs module; no service, browser, network, or durable output.
      lifetime: No temporary state on the passing path; the mutation branch creates one mkdtemp directory under the OS temp dir and removes it with rmSync in a finally step on every exit path.
      concurrency: Read-only over the shared tree; the mutation scratch directory is mkdtemp-unique, so parallel runs cannot share a path, and no port or identity is claimed.
      ciParity: The exact command pnpm test:fairtest:dispatch runs from a clean checkout under the pinned Node toolchain in the browser-free contracts step of the pinned Fairtest CI job, so a green CI run proves the guard ran and no host-kind branch sits outside the declaration and view-construction modules. The guarantee is that required CI names and runs the command; a deliberate edit to the guard, its corpus, or the workflow is out of scope.
      evidence: A machine-readable CLI pass line from node scripts/fairtest/assert-target-dispatch.mjs, which required CI runs as its own pnpm test:fairtest:dispatch command rather than a node --test case, naming the scanned module count, the detection cases behaved, and the named mutations that failed for their intended reason, plus, on refusal, a diagnostic naming the offending module, the matched branch expression, path context, and repair guidance; each named mutation asserts the diagnostic substring, the path context, and the repair guidance.
      mutation: The named mutations write one scratch module per evasion form (direct, reversed, bracket, parenthesized, switch-case, includes-array, alias, destructuring rename, plus a nested-direct module that pins the recursive walk) and assert the guard refuses each, naming the offending expression; every mutation is a scan case, not a chain-body case.
      exitCondition: Fold the rule into a compiler or lint constraint, or delete the guard once a lower-level package check observes the same host-kind branch boundary.
    lowerLayer:
      result: promote
      detail: The value and contract suites pin target shape and adapter composition, but none reads the source of an arbitrary app module, so only this source scan observes a stray host-kind branch; the elaborate check is justified.
    decision:
      verdict: approve
      rationale: All ten answers are present, the value layer cannot observe a branch in another module's source, and the guard is bounded to one browser-free scan with a uniquely named mutation.
    executionPolicy:
      runner: Browser-free node command run as its own pnpm test:fairtest:dispatch step; readdir/readFile over scripts/fairtest only.
      budget: One source scan of the app modules plus one scratch-directory mutation inside the existing browser-free contracts step; no added rows, retries, or services.
      cleanup: The mutation scratch directory is removed with rmSync in a finally step on every exit path; the passing path leaves no state.
    exitCondition: Fold the rule into a compiler or lint constraint, or delete the guard once a lower-level package check observes the same host-kind branch boundary.
  - name: fairtest-raw-path-literal-guard
    answers:
      subject: No module under scripts/fairtest/ or the Fairtest root guards may carry a bare repository-path literal equal to, or under, a declared root, outside scripts/fairtest/fairtest-paths.mjs and the fixture carriers the owner declares.
      necessity: A value or contract test observes the path values the harness reads but cannot see the source of an arbitrary module; only a source scan over the real tree catches a new hardcoded build root, child path, or testdata corpus that would drift from the single owner.
      productionPath: pnpm test:fairtest:paths (node scripts/fairtest/assert-fairtest-paths.mjs) scans the real scripts/fairtest tree including its test modules plus the Fairtest root guards with a lexer that skips comments and treats a substitution-free template literal as its text, then applies three named mutations in scratch modules.
      cost: One browser-free node process, one readdir plus one readFile per scanned .mjs module, and one scratch directory per named mutation (three); no service, browser, network, or durable output.
      lifetime: No temporary state on the passing path; each mutation creates one mkdtemp directory under the OS temp dir and removes it with rmSync in a finally step on every exit path.
      concurrency: Read-only over the shared tree; each mutation scratch directory is mkdtemp-unique, so parallel runs cannot share a path and no port or identity is claimed.
      ciParity: The exact command pnpm test:fairtest:paths runs from a clean checkout under the pinned Node toolchain with the pinned yaml devDependency in the browser-free contracts step of the pinned Fairtest CI job, so a stray hardcoded build root or testdata corpus turns required CI red.
      evidence: A machine-readable pass line naming the scanned module count, plus, on refusal, a diagnostic naming the module, line, literal, path context, and repair guidance; the named mutation asserts the literal and the repair substring.
      mutation: raw-literal-plant writes const DIST_ROOT = join(FAIRTEST_REPO_ROOT, 'dist') into a scratch module; test-file-literal-plant plants the same literal in a scratch test module; and path-escape-plant feeds a parent-directory traversal. Each runs the guard and asserts it names the literal or the refusal with the repair instead of passing.
      exitCondition: Fold the rule into a compiler or lint constraint, or delete the guard once a lower-level package check observes the same repository-path-literal boundary.
    lowerLayer:
      result: promote
      detail: The value and contract suites pin the path values the harness reads, but none reads the source of an arbitrary module, so only this scan observes a stray hardcoded path; the elaborate check is justified.
    decision:
      verdict: approve
      rationale: All ten answers are present, the lower layer cannot observe a stray literal in another module's source, and the guard is bounded to one browser-free scan with a uniquely named mutation.
    executionPolicy:
      runner: Browser-free node command scanning scripts/fairtest and the four root guards; no service, browser, or network access.
      budget: One source scan of the harness modules plus one scratch-directory mutation inside the existing browser-free contracts step.
      cleanup: The mutation scratch directory is removed with rmSync in a finally step on every exit path; the passing path leaves no state.
    exitCondition: Fold the rule into a compiler or lint constraint, or delete the guard once a lower-level package check observes the same repository-path-literal boundary.
  - name: fairtest-path-resolution-guard
    answers:
      subject: Every declared location in scripts/fairtest/fairtest-paths.mjs resolves to an absolute path inside FAIRTEST_REPO_ROOT, and a traversal or escape candidate is refused with the repository's path-context repair idiom.
      necessity: A value test can read the declared strings but cannot observe that the resolver keeps them inside the repository; only exercising the resolver over the whole inventory and over traversal inputs proves containment and refusal.
      productionPath: pnpm test:fairtest:paths (node scripts/fairtest/assert-fairtest-paths.mjs) resolves every declared location, runs the corpus resolution cases for traversal, absolute, empty, dot-segment, windows, and unknown-name inputs, and applies one named escape mutation.
      cost: One browser-free node process over an in-memory inventory plus nine small cases; no filesystem walk beyond the guard's own source scan, and no service, browser, or network.
      lifetime: No temporary files or directories are created by the resolution cases; the guard's scratch mutation is owned by the raw-literal guard.
      concurrency: Pure in-memory computation over a frozen record; read-only over the tree, so two runs cannot interfere.
      ciParity: The exact command pnpm test:fairtest:paths runs from a clean checkout under the pinned Node toolchain in the browser-free contracts step of the pinned Fairtest CI job, so a declared location that escapes FAIRTEST_REPO_ROOT or a resolved traversal turns required CI red.
      evidence: A machine-readable pass line naming the declared-location count, plus, on refusal, a diagnostic naming the candidate, path context, and repair guidance; each corpus case asserts its own diagnostic fragment.
      mutation: path-escape-plant feeds ../escape to resolveFairtestRepoPath and asserts the refusal names the parent-directory segment, path context, and repair instead of resolving it.
      exitCondition: Fold the rule into a package path helper or delete the guard once a lower-level package or compiler check proves the same containment invariant.
    lowerLayer:
      result: promote
      detail: A value test reads the declared strings but cannot observe that every one resolves inside the repository root or that traversal is refused, so exercising the resolver is justified.
    decision:
      verdict: approve
      rationale: All ten answers are present, the lower layer cannot observe resolution containment or a refusal, and the guard is bounded to one browser-free process over an in-memory inventory.
    executionPolicy:
      runner: Browser-free node command resolving the declared inventory and the corpus cases; no service, browser, or network access.
      budget: Seconds of local compute inside the existing browser-free contracts step; one pass over the declared inventory plus nine cases.
      cleanup: No temporary state is created; the mutation runs in memory and the process exits before the guard returns.
    exitCondition: Fold the rule into a package path helper or delete the guard once a lower-level package or compiler check proves the same containment invariant.
  - name: app-reduced-transparency-computed-check
    answers:
      subject: Under prefers-reduced-transparency reduce, no element on the built demo computes a backdrop blur, and the sticky nav computes the opaque --surface, in each theme.
      necessity: The incident was a cascade-layer loss. A normal fallback in @layer base lost to the blurred rules in the components layer, so it never applied. A source-text row sees the declaration and passes; only a computed read of the mounted page shows which layer wins.
      productionPath: The production build served by the vite preview that playwright.journey.config.mjs starts, at /?fb=off (with &theme=light in the light project), with the media feature set through CDP Emulation.setEmulatedMedia because Playwright's emulateMedia has no reduced-transparency option.
      cost: One browser context and one page load per theme project inside the existing journey step, under a second in CI, with a 30-second test timeout; no new service, port, or artifact on success.
      lifetime: One browser context closed in finally, which ends the CDP session with it; failure artifacts go to the gitignored scripts/journey/.artifacts.
      concurrency: The journey runs with one worker and no full parallelism; the check shares the journey's fixed app port and its local server reuse.
      ciParity: pnpm journey:ci in the gates job of the pinned Playwright container, after pnpm build.
      evidence: Every run prints the media match, the rendered theme, the resolved --surface, the nav background, a fresh probe element's blur, and the list of elements that still blur to the CI log; a failing assertion carries the same object.
      mutation: Deleting the global !important rule, replacing it with a normal .nav rule in @layer base, narrowing it to any list of selectors (the fresh probe element keeps its blur), or dropping the opaque nav background fails the check for the intended reason.
      exitCondition: Switch to page.emulateMedia when Playwright supports reduced transparency, and delete the check if the base UI stops using backdrop blur.
    lowerLayer:
      result: promote
      detail: A mobile-layout-style source-text row would catch a deleted declaration but not a move into a losing cascade layer; a mutation that moved the rule passed every existing gate before this check.
    decision:
      verdict: approve
      rationale: All ten answers are present, only a computed read observes the cascade risk, and the check adds one page load per theme to a journey that already runs.
    executionPolicy:
      runner: The existing Playwright journey config against the built app.
      budget: One page load per theme project with a 30-second timeout, inside the existing gates job.
      cleanup: The browser context is closed in finally on every exit path.
    exitCondition: Delete the check when the base UI no longer uses backdrop blur, or replace the CDP call once Playwright emulates the feature directly.
