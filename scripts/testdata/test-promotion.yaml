records:
  - name: example-mounted-product-proof
    answers:
      subject: The real mounted product can pass with a false theme, missing shell, stale served build, or unproven section.
      necessity: Pure value and contract tests cannot observe DOM structure, computed styles, browser input, service readiness, or served bytes, so a mounted row is required for this named risk.
      productionPath: The built dist/ Fairtrade graph product under the actual Playwright host via FAIRTEST_RUN_ROOT=<run-root> pnpm test:fairtest:mounted -- --target=product.
      cost: Two bounded theme rows, one browser and service lifecycle, one named map-section action, and six small artifacts per row, inside the existing job budget with no retries.
      lifetime: One immutable run root created fresh per run plus one loopback service, cleaned up in finally on success, failure, timeout, and interruption.
      concurrency: One product row at a time; row identity plus the immutable run root prevent stale or cross-run output.
      ciParity: The exact command runs after a clean build in the pinned Playwright container; no local demo or external service is assumed. Its required-CI mount is still deferred (the command prints declared-not-ci on every run), so a green CI run does not yet prove it.
      evidence: Computed styles, ARIA tree, axe report, screenshot, resolution, normalized theme observation, and served-build provenance with asset digests.
      mutation: A wrong theme, missing selector or part, unregistered action, missing artifact, or stale served asset kills the row for the intended reason.
      exitCondition: Remove or simplify the mounted row when a lower-level gate or an existing journey proves the same named risk.
    lowerLayer:
      result: promote
      detail: Value, contract, and fixture checks cover shape, policy, and proof assembly only; none observes the mounted shell, served bytes, or real input, so the elaborate row is justified.
    decision:
      verdict: approve
      rationale: All ten answers are present, the lower layer cannot observe the named risk, and the execution policy is bounded to two rows with no retries.
    executionPolicy:
      runner: Row-scoped mounted runner against the built dist/ target only.
      budget: Two theme rows inside the existing job budget with no retries.
      cleanup: Adapter service and run root are released in a finally step on every exit path.
    exitCondition: Reuse an equivalent existing journey or delete the row once a lower-level gate proves the same named risk.
  - name: example-mounted-component-proof
    answers:
      subject: A mounted check that one component story mounts its root, answers one interaction, and reports ARIA and token evidence.
      necessity: Server-free checks cannot observe direct story mounting, real input behavior, or story theme globals.
      productionPath: The built storybook-static direct iframe for one named story and its documented root node.
      cost: Two bounded component rows and six small artifacts; no app service, product row, or catalog duplicate.
      lifetime: One run root and one loopback storybook port with deterministic cleanup on every exit path.
      concurrency: Component row identity is separate from product rows and cannot share a protected producer key.
      ciParity: The exact component command runs after a clean storybook build in the pinned container.
      evidence: Mounted root, interaction result, ARIA, computed tokens, axe output, screenshot, resolution, and provenance.
      mutation: A missing root, wrong theme, missing interaction, or product-shaped proof kills the component owner.
      exitCondition: Keep only named component risks; remove the row if an existing journey proves the same behavior without mounting.
    lowerLayer:
      result: promote
      detail: Unit checks cover adapter values only; none observes the mounted story root or real click behavior.
    decision:
      verdict: approve
      rationale: The component risk needs a mounted story target, the policy is component-only, and the exit condition is explicit.
    executionPolicy:
      runner: Row-scoped mounted runner against the built storybook target only.
      budget: Two theme rows inside the existing job budget with no retries.
      cleanup: Storybook service and run root are removed in a finally step on every exit path.
    exitCondition: Delete the row when an existing journey or lower-level component check proves the same named behavior.
  - name: example-browser-free-boundary
    answers:
      subject: A browser-free check that shared validation values stay free of browser, DOM, and app route knowledge.
      necessity: A mounted test cannot observe module resolution or source imports; only a direct source guard observes this boundary.
      productionPath: Frozen install followed by a browser-free command run from a clean checkout with browser packages unavailable.
      cost: Browser-free node checks over named fixtures; no service, browser, or temporary output beyond a scratch directory.
      lifetime: Temporary scratch directories are removed in a finally step; no persistent process or database is created.
      concurrency: Unique temporary roots and read-only fixture inputs; no shared package output is written.
      ciParity: The exact command runs in the pinned toolchain from a clean checkout.
      evidence: Machine-readable pass or fail plus fixture and mutation diagnostics naming the offending import.
      mutation: A browser or app import injected into the guarded surface fails at the owning guard for the intended symbol.
      exitCondition: Simplify the guard when a direct package or value check proves the same boundary without a dedicated script.
    lowerLayer:
      result: retain
      detail: A direct import scan already observes this boundary, so no mounted or elaborate layer is added for it.
    decision:
      verdict: reject
      rationale: The lower layer observes the risk, so promoting an elaborate test is refused under the lower-layer-first rule.
    executionPolicy:
      runner: Plain node command with no service, browser, or network access.
      budget: Seconds of local compute inside the existing browser-free phase.
      cleanup: Scratch directories are removed in a finally step on every exit path.
    exitCondition: Remove this record family if the boundary moves into a lower-level package check that proves the same invariant.
  - name: fairtest-type-program-coverage-guard
    answers:
      subject: The Fairtest type program must cover exactly the intended files, and no covered file may carry a suppression directive or an unrecorded explicit-any type position.
      necessity: A pragma-presence check alone cannot see a file that carries both the pragma and a refused suppression directive, and it cannot see the include globs narrowed underneath it; only a metadata scan plus a comparison against the compiler's own file list observes the real program membership.
      productionPath: node scripts/fairtest/assert-ts-check-coverage.mjs over the real tree, spawning the pinned tsc -p tsconfig.fairtest.json --listFiles for the program comparison.
      cost: One browser-free node process plus one tsc --listFiles invocation over the covered roots; no service, browser, network, or durable output.
      lifetime: No temporary files or directories are created; the tsc subprocess is bounded by spawnSync and exits before the guard returns.
      concurrency: Read-only over the tree; the tsc invocation writes nothing because the program sets noEmit true, so two runs cannot interfere.
      ciParity: The exact command pnpm test:fairtest:type-coverage runs from a clean checkout with the pinned typescript and yaml devDependencies; it is declared here and not yet wired into required CI.
      evidence: A machine-readable pass line reporting walked, checked, and vendored counts, the acknowledged-any totals, and the parity result, plus named diagnostics for every rule.
      mutation: Eight named mutations (missing pragma, vendored banner added and removed, planted suppression directives, planted and dropped explicit any, dropped-from-program) each fail the named rule for the intended file or token.
      exitCondition: Fold the checks into a lower-level program or compiler integration if one can observe program membership and suppression metadata directly.
    lowerLayer:
      result: promote
      detail: A plain unit test cannot observe the compiler's actual program membership or a suppression directive the compiler honors silently, so the metadata comparison is justified.
    decision:
      verdict: approve
      rationale: The guard protects the type program's whole payoff, the lower layer cannot observe the same invariant, and its cost is one bounded browser-free process.
    executionPolicy:
      runner: Plain node command with the pinned typescript spawned as a child; no service, browser, or network access.
      budget: Seconds of local compute inside the existing browser-free phase; one tsc --listFiles over the covered roots.
      cleanup: No temporary state is created; the child process is bounded and reaped by spawnSync on every exit path.
    exitCondition: Fold the checks into a lower-level program or compiler integration if one can observe program membership and suppression metadata directly.
  - name: fairtest-target-dispatch-guard
    answers:
      subject: No app module outside the target-declaration and view-construction modules may branch on the host kind; every other module must read the kind, id, capabilities, fixtures, and actions from the target value's own fields.
      necessity: A value, contract, or fixture test observes the target object's shape and the adapter's behaviour, but it cannot see the source of an arbitrary app module; only a source scan over the real tree catches a new kind === 'product' / kind === 'component' branch that would become a second, disagreeing discriminator.
      productionPath: pnpm test:fairtest:product-contract (node scripts/fairtest/run-product-contract.mjs) runs scripts/fairtest/product-adapter.test.mjs, whose "refuses a host-kind branch outside the declaration and view-construction modules" case calls assertNoTargetKindDispatch over the real scripts/fairtest directory and then over a scratch tree carrying the planted mutation.
      cost: The guard is one browser-free source scan with one readdir plus one readFile per scanned .mjs module; no service, browser, network, or durable output.
      lifetime: No temporary state on the passing path; the mutation branch creates one mkdtemp directory under the OS temp dir and removes it with rmSync in a finally step on every exit path.
      concurrency: Read-only over the shared tree; the mutation scratch directory is mkdtemp-unique, so parallel runs cannot share a path, and no port or identity is claimed.
      ciParity: The exact command pnpm test:fairtest:product-contract runs from a clean checkout under the pinned Node toolchain; the runner inventory records it as the required local contract but as DEFERRED from required CI, so a green CI run does not yet prove the guard ran.
      evidence: A machine-readable node --test pass line plus, on refusal, a diagnostic naming the offending module, the matched branch expression, path context, and repair guidance; the mutation asserts each of those substrings.
      mutation: adapter-branches-on-target-kind plants a scratch module whose pick() does `if (target.kind === 'product')`, calls the guard on the scratch directory, and asserts the guard names the module and the branch instead of passing it.
      exitCondition: Fold the rule into a compiler or lint constraint, or delete the guard once a lower-level package check observes the same host-kind branch boundary.
    lowerLayer:
      result: promote
      detail: The value and contract suites pin target shape and adapter composition, but none reads the source of an arbitrary app module, so only this source scan observes a stray host-kind branch; the elaborate check is justified.
    decision:
      verdict: approve
      rationale: All ten answers are present, the value layer cannot observe a branch in another module's source, and the guard is bounded to one browser-free scan with a uniquely named mutation.
    executionPolicy:
      runner: Browser-free node --test case inside the product-contract suite; readdir/readFile over scripts/fairtest only.
      budget: One source scan of the app modules plus one scratch-directory mutation inside the existing product-contract run; no added rows, retries, or services.
      cleanup: The mutation scratch directory is removed with rmSync in a finally step on every exit path; the passing path leaves no state.
    exitCondition: Fold the rule into a compiler or lint constraint, or delete the guard once a lower-level package check observes the same host-kind branch boundary.
