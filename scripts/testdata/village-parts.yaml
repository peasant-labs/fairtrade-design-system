# Cases for the small page parts the local and village pages share. scripts/village-parts.test.mjs
# mounts the REAL component for each case and checks what renders.
#
# StatsStrip (src/ui/StatsStrip.jsx): one inline row of stat pairs. expected.pairs lists each
# pair's text in reading order; a number value is grouped with the en-US separator; an empty list
# renders nothing.
statsStrip:
  - name: StatsStrip with no pairs renders nothing
    items: []
    expected: {rendered: false, pairs: []}
  - name: StatsStrip with one pair
    items: [{value: 248, label: transcripts}]
    expected: {rendered: true, pairs: [248 transcripts]}
  - name: StatsStrip with many pairs, both reading orders
    items:
      - {value: 1284, label: sessions}
      - {value: 7, label: projects}
      - {value: '19.1M', label: tokens}
      - {label: longest streak, value: 3 wk, order: label-first}
      - {label: median session, value: 34m, order: label-first}
    expected: {rendered: true, pairs: ['1,284 sessions', 7 projects, 19.1M tokens, longest streak 3 wk, median session 34m]}

# CopyIconButton (src/ui/CopyIconButton.jsx): icon only, named for what it copies; after a copy it
# is named "copied" and a polite status says so; it renders nothing without a clipboard.
copyIconButton:
  - {name: CopyIconButton idle, clipboard: true, press: false, expected: {rendered: true, name: copy link, status: '', written: []}}
  - {name: CopyIconButton copied, clipboard: true, press: true, expected: {rendered: true, name: copied, status: copied, written: ['https://village.peasantlabs.org/transcripts/3f9c0a17']}}
  - {name: CopyIconButton without a clipboard, clipboard: false, press: false, expected: {rendered: false, written: []}}

# OverflowList (src/ui/OverflowList.jsx) with limit 2: the first items, then +N for the rest;
# pressing +N moves focus to the first item it revealed.
overflowList:
  - {name: OverflowList with zero items, items: [], expected: {items: [], more: null, empty: none}}
  - {name: OverflowList with one item, items: ['#42'], expected: {items: ['#42'], more: null}}
  - {name: OverflowList at the limit, items: ['#42', '#45'], expected: {items: ['#42', '#45'], more: null}}
  - {name: OverflowList over the limit, items: ['#42', '#45', '#51', '#60'], expected: {items: ['#42', '#45'], more: {text: '+2', name: show 2 more pull requests, after: ['#42', '#45', '#51', '#60'], focus: '#51'}}}
