expectedMutationCount: 9
requiredSurfaceCases:
  - turn-card
  - graph-turn-node
  - graph-legend
  - changes
requiredBrandCases:
  - claude
  - gemini
  - openai
  - cursor
  - opencode
  - strike
requiredAliasCases:
  - anthropic
  - claude-code
  - google
  - googlegemini
  - gemini-cli
  - codex
  - codex-cli
  - chatgpt
  - gpt
requiredInvalidHarnessCases:
  - company-name
  - unknown-provider
  - empty
mutations:
  - name: antigravity-accessible-name-is-observable
    target: provider-policy
    find: Google Antigravity
    replace: Gemini CLI
    expectedFailedCheckCount: 2
    expectedError: "antigravity: accessible name"
  - name: antigravity-accent-is-observable
    target: provider-policy
    find: 'antigravity: "teal"'
    replace: 'antigravity: "olive"'
    expectedFailedCheckCount: 4
    expectedError: "antigravity: accent"
  - name: strike-accessible-name-is-observable
    target: provider-policy
    strategy: mutate-strike-display-name
    expectedFailedCheckCount: 3
    expectedError: "strike: accessible name"
  - name: strike-brand-is-observable
    target: provider-policy
    strategy: mutate-strike-brand
    expectedFailedCheckCount: 5
    expectedError: "strike: brand"
  - name: strike-accent-is-observable
    target: provider-policy
    strategy: mutate-strike-accent
    expectedFailedCheckCount: 5
    expectedError: "strike: accent"
  - name: strike-mark-geometry-is-observable
    target: provider-policy
    strategy: mutate-strike-mark
    expectedFailedCheckCount: 4
    expectedError: "authoritative Strike mark"
  - name: invalid-present-cannot-fall-back-to-amber
    target: graph-visuals
    strategy: graph-turn-invalid-fallback
    expectedFailedCheckCount: 1
    expectedError: "did not fail loudly through graph-turn-node"
  - name: seven-provider-inventory-cannot-omit-strike
    target: provider-policy
    strategy: omit-strike-inventory
    expectedFailedCheckCount: 3
    expectedError: "mounted legend: expected 7 rows, received 6"
  - name: arbitrary-string-provider-cannot-pass-validation
    target: provider-policy
    strategy: accept-arbitrary-string
    expectedFailedCheckCount: 21
    expectedError: "did not fail loudly through public accent helper"
