# Served numbering in a positioned (v2) segment. The reader prints each row's served
# displayNumber and never computes one for a positioned row; the whole-document render
# keeps computing its own numbers. Every case is run by scripts/transcript-positioned-reader.test.mjs.
#
# One served segment of the main partition: positions are the served order, recorded
# indexes are the turns' own (deliberately unlike the positions), and one row came from a
# server that sent no number. Row 52 is blank system noise the whole-document filter drops;
# a served row is never dropped.
segment:
  index: 4
  rows:
    - {position: 40, recordedIndex: 1052, displayNumber: '7', role: user, content: Open the reader at the far deep link.}
    - {position: 41, recordedIndex: 1053, displayNumber: 7a, role: assistant, content: The window names its own run.}
    - {position: 42, recordedIndex: 1055, role: assistant, content: This row came from a server that sent no number.}
    - {position: 43, recordedIndex: 1056, displayNumber: 7b, role: system, content: ' '}
    - {position: 44, recordedIndex: 1057, displayNumber: '8', role: user, content: Check the history numbering next.}
# A history section's served rows restart at 1 in their own partition.
historySegment:
  index: 0
  sectionIndex: 0
  rows:
    - {position: 0, recordedIndex: 3, displayNumber: '1', role: user, content: An earlier request.}
    - {position: 1, recordedIndex: 4, displayNumber: 1a, role: assistant, content: An earlier reply.}
# The whole-document render numbers with the whole-document rule.
wholeDocument:
  turns:
    - {index: 0, role: user, content: first request}
    - {index: 1, role: assistant, content: first reply}
    - {index: 2, role: user, content: second request}
  labels: ['1', 1a, '2']
wireSegment:
  harness: claude-code
  previousSegment:
    - {index: 15, role: assistant, depth: 0, entryType: text, displayNumber: '9', content: Reply nine before the split., timestamp: '2026-11-12T08:59:00Z'}
  midSession:
    - {index: 17, role: assistant, depth: 0, entryType: text, sourceEntryRef: 'entry-17', displayNumber: 9a, content: Reply continuing prompt nine., timestamp: '2026-11-12T09:00:00Z', toolCalls: [{id: 'tc-9a', name: 'Bash', toolKind: 'execute', arguments: '{"command":"pnpm test"}', result: '"fail"', isError: true, exitCode: 1}]}
    - {index: 18, role: user, depth: 0, entryType: text, sourceEntryRef: 'entry-18', displayNumber: '10', content: Run the tenth prompt in this segment., timestamp: '2026-11-12T09:01:00Z'}
    - {index: 19, role: assistant, depth: 0, entryType: text, sourceEntryRef: 'entry-19', displayNumber: 10a, content: Reply to the tenth prompt., timestamp: '2026-11-12T09:02:00Z'}
  expectedLabels: [9a, '10', 10a]
  expectedFallbackLabels: ['1', '2', 2a]
  invalidDisplayNumbers: ['0', 1A, '', ' 1', 123, null]
# A value outside the served pattern ^[1-9][0-9]*[a-z]*$ is refused by the parser, and the
# reader discards the whole response.
malformedNumber: 7A
cases:
  - name: number-segment-prints-served-value
  - name: number-segment-never-cooks
  - name: number-segment-renders-exactly-served-rows
  - name: number-absent-on-v2-row-shows-no-number
  - name: number-malformed-value-discarded
  - name: number-whole-document-render-computes
  - name: number-accessible-name-includes-served-value
  - name: number-copy-link-unaffected
  - name: number-saved-label-keys-recorded-index
  - name: number-search-and-filter-unaffected
  - name: number-history-section-prints-own-numbering
  - name: segment-mode-refuses-analytics
  - name: wire-mid-session-keeps-display-number
  - name: wire-absent-display-number-computes
  - name: wire-partial-or-malformed-display-number-refused
  - name: wire-two-segments-either-order-keep-labels
  - name: wire-numbered-mounted-surfaces-agree
  - name: number-fixture-replay-js
    pending: true
    note: needs @peasant-labs/schema/fixtures/transcript-numbering, the numbering corpus export the next Schema release adds; enabled by the Fairtrade re-pin to that release
