# Regression guards for two real UAT-found mobile layout defects:
# (1) commit-row <button>s silently overflowing their narrow
# container instead of shrinking to it, and (2) the mounted transcript's
# non-scrolling chrome (title/meta chips/turns-toolbar) consuming almost the
# entire mobile viewport before any transcript content is visible; plus
# (3) the wide dialog's full-width sheet below the md breakpoint, and (4) the
# dialog head keeping its close button square and its title wrapping at 390px.
# Each row names the SOURCE file the fix lives in (never the built dist,
# which may minify/reorder declarations) and a literal substring that must be
# present — a future edit that reverts the fix (e.g. drops width:100% from a
# <button> row, or removes the mobile compaction rules) fails this test.
invariants:
  - id: cg-row-fills-container
    file: src/ui/CommitGraph.css
    description: >-
      .cg-row is a <button> — its UA-default intrinsic sizing ignores
      flex:1 1 auto on a non-flex parent, so without an explicit width it
      silently grows to its content's natural width and overflows .cg-content
      on a narrow viewport instead of shrinking to it (defeating .cg-msg's
      own overflow:hidden/ellipsis truncation).
    mustContainAll:
      - ".cg-row {"
      - "width: 100%;"
  - id: cg-older-fills-container
    file: src/ui/CommitGraph.css
    description: the "N older commits" ghost row button has the same <button> intrinsic-sizing gotcha as .cg-row.
    mustContainAll:
      - ".cg-older {"
      - "width: 100%;"
  - id: pgn-edge-contains-its-hidden-label
    file: src/index.css
    description: >-
      The narrow numbered-pagination edge control hides its lowercase label with the standard clip
      pattern, which positions the span absolutely. The control is declared a positioning context in
      the same media block, so the 1px box is laid out inside the control instead of against the
      initial containing block: an absolutely positioned box whose containing block sits outside the
      site root's overflow-x: clip is not clipped by it, and the label's static position (centred in
      a square control past the right edge of a 320px phone) widened the document to 324px whenever
      no ancestor transform was there to contain it - under prefers-reduced-motion: reduce, and under
      normal motion too once the section's scroll-reveal transform resolved to none. One literal covers
      the whole rule, so no declaration in it can be dropped while the row still passes.
    mustContainAll:
      - ".pgn-edge { padding: 0; width: var(--control-h-sm); position: relative; }"
  - id: txn-title-wraps-on-mobile
    file: src/index.css
    description: >-
      The primary session title keeps its reading size and wraps below the md breakpoint (width < 768px).
      Taller headers are preferable to hiding the user's content.
    mustContainAll:
      - ".txn-title {"
      - "display: block;"
      - "overflow-wrap: anywhere;"
  - id: txn-meta-wraps-on-mobile
    file: src/index.css
    description: >-
      Metadata wraps below the md breakpoint (width < 768px), each item whole on its line, without
      shrinking text. A sideways scroller hid the last items with nothing on screen to say so.
    mustContainAll:
      - ".txn-meta {\n    flex-wrap: wrap;"
      - ".txn-meta > * { white-space: nowrap; }"
  - id: txn-meta-keyboard-scroll-region
    file: src/ui/transcript/TranscriptViewer.jsx
    description: The metadata row is focusable and named for keyboard and screen-reader users.
    mustContainAll:
      - '<div className="txn-meta chips"'
      - 'tabIndex={0} role="region" aria-label="session metadata"'
  - id: txn-tabs-scroll-on-mobile
    file: src/index.css
    description: >-
      Session tabs remain a single sideways-scrollable row below the md breakpoint (width < 768px),
      and the row fades at its end so a cut tab reads as more to scroll to.
    mustContainAll:
      - ".txn-tabs { gap: var(--sp-4); flex-wrap: nowrap; overflow-x: auto; padding-right: var(--sp-6); mask-image: linear-gradient(to right, var(--ink) calc(100% - var(--sp-6)), transparent); }"
  - id: txn-tabs-keyboard-navigation
    file: src/ui/transcript/TranscriptViewer.jsx
    description: Session views keep a named tablist and keyboard tab navigation.
    mustContainAll:
      - '<div className="tabs txn-tabs"'
      - 'role="tablist" aria-label="session views" onKeyDown={onTabKey}'
  - id: txn-trace-head-compact-on-mobile
    file: src/index.css
    description: the "N turns / list·graph toggle" bar gets reduced padding below the md breakpoint (width < 768px), matching .txn-header's own mobile treatment.
    mustContainAll:
      - ".txn-trace-head { padding: var(--sp-2) var(--sp-3); }"
  - id: dialog-wide-sheet-on-mobile
    file: src/index.css
    description: >-
      below the md breakpoint the wide dialog (the publish popup) is a
      full-width sheet: its overlay drops the side padding and the panel
      takes width 100% with no side borders, so the panel is never wider
      than the viewport. The anchor ties the rule to the width < 768px media query.
    mustContainAll:
      - "@media (width < 768px) {\n    .dlg-overlay:has(> .dialog-wide) { padding: 0;"
      - ".dlg-overlay > .dialog.dialog-wide { width: 100%;"
      - "border-left: 0; border-right: 0;"
  - id: dialog-close-button-keeps-its-square
    file: src/index.css
    description: >-
      the dialog head's close button does not flex-shrink. Without flex none, the
      publish dialog's long title squeezed it to 19px wide at 390px, below the
      24px target. One literal, so deleting the declaration fails the row.
    mustContainAll:
      - ".dlg-head > .btn-icon { flex: none; }"
  - id: dialog-title-wraps-long-words
    file: src/index.css
    description: >-
      the dialog title can hold user content (a session title), so a long
      unbroken word wraps instead of pushing the close button out of the
      dialog at 390px.
    mustContainAll:
      - ".dlg-head h3 { @apply text-md; min-width: 0; overflow-wrap: anywhere; }"
  - id: dialog-head-markup-is-pinned
    file: src/ui/Dialog.jsx
    description: >-
      the two dialog-head rows target .dlg-head h3 and .dlg-head > .btn-icon, so
      the library dialog's markup strings are pinned too: the head div, and after
      it in the same component the h3 title and the btn-icon class. The row checks
      that these strings exist, not that the h3 and the button stay direct
      children of the head. An edit that keeps both selectors matching but
      rewrites these strings fails this row too; update the row.
    mustContainAll:
      - "<div className=\"dlg-head\">"
      - "<h3 id={labelId}>"
      - "btn-icon\""
  - id: site-dialog-head-markup-is-pinned
    file: src/Dialog.jsx
    description: >-
      the presentation site's own dialog uses the same head markup and the same
      two rules, so it is pinned the same way.
    mustContainAll:
      - "<div className=\"dlg-head\">"
      - "<h3 id={labelId}>"
      - "btn-icon\""
  - id: srow-text-stacks-on-mobile
    file: src/ui/Settings.css
    description: >-
      below the md breakpoint a SettingRow's text value (a value and its edit button, a folder
      list) reads under its label at the label's left edge. Beside the label it took the auto
      column and squeezed the label to about 80px at 390.
    mustContainAll:
      - ".srow-text-row > .srow-control { grid-column: 1 / -1; justify-self: start; justify-content: flex-start; }"
      - ".srow-text-row .srow-text { justify-content: flex-start; }"
