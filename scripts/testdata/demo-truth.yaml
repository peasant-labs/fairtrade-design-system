cases:
  - name: local village has independent dated observations
    module: /src/mockups/inuse/GraphApp.jsx
    component: default
    query: '?app=graph&section=village'
    probes:
      - {selector: '.vobs', text: Acme Platform}
      - {selector: '.vobs [data-domain="catalog"]', text: updated}
      - {selector: '.vobs [data-domain="history"]', text: '2026-10-15T09:00:00Z'}
      - {selector: 'nav[aria-label="peasant sections"]', text: back, absent: online}
  - name: published copies are transcripts
    module: /src/mockups/inuse/CommonsPullRequest.jsx
    component: PullRequestView
    probes:
      - {selector: '.pd-label', text: transcripts, absent: sessions}
      - {selector: '.pd-split-list', count: 1}
      - {selector: '.pd-split-hint', text: transcripts, absent: sessions}
      - {selector: '.pd-village', text: open pull request digest, absent: view on village}
  - name: analytics uses session vocabulary
    module: /src/mockups/inuse/GraphAnalytics.jsx
    component: AnalyticsView
    probes:
      - {selector: '.gan-root', text: sessions linked to commits, absent: acquisition signal}
      - {selector: '.gan-root', text: new sessions, absent: returning rate}
      - {selector: '.gan-root', text: weeks with sessions, absent: longest streak}
      # typical then tail, the comma on the typical value: "30m, 53m" (the row's gap is the space)
      - {selector: '.gan-typvals', text: '30m,53m', absent: /}
      - {selector: '.gan-foot', count: 0}
  - name: transcript counts use lowercase k
    module: /src/mockups/inuse/TranscriptApp.jsx
    component: default
    probes:
      - {selector: '.txn-app', text: 18.4k tokens}
  - name: village counts use lowercase k
    module: /src/mockups/inuse/CommonsExplore.jsx
    component: TranscriptDetailView
    probes:
      - {selector: '.cex-detail', text: 412.3k tokens, absent: 412.3K}
  - name: dates use lowercase month and year
    module: /src/ui/commons/Explore.jsx
    component: default
    probes:
      - {selector: '.cex-root', text: 'jun 14, 2026', absent: 'Jun 14'}
  - name: one overflow session is singular
    module: /src/ui/graph/SessionOverflowDisclosure.jsx
    component: default
    props:
      commitHash: aabbcc
      expanded: false
      overflow: [{sessionId: demo-session, title: Recorded session}]
    probes:
      - {selector: '.tlp-overflow-toggle', text: '+1 more session', absent: '+1 more sessions'}
  - name: returning provider has its mark
    module: /src/mockups/inuse/CommonsExplore.jsx
    component: TranscriptDetailView
    probes:
      - {selector: '.subtask-foot', text: returned to claude}
      - {selector: '.subtask-foot .brand', count: 1}
  - name: github account has its mark
    module: /src/mockups/inuse/CommonsPages.jsx
    component: AccountSettingsView
    probes:
      - {selector: '.srow-label .brand', count: 1}
  - name: offline home is stale and inert
    module: /src/mockups/inuse/GraphApp.jsx
    component: default
    query: '?section=home&local=offline'
    probes:
      - {selector: '.iu-page', text: last loaded 14:32:05}
      - {selector: '.iu-page input, .iu-page select, .iu-page button', disabled: true}
      - {selector: '.tbl-wrap', count: 1}
  - name: settings describes enabled and blocked rules
    module: /src/mockups/inuse/LocalHome.jsx
    component: SettingsView
    probes:
      - {selector: '.iu-page', absent: it never publishes on its own.}
      - {selector: '.iu-page', text: except acme/worker}
      - {selector: '.iu-page', text: automatic publishing is controlled by the folder rules below.}
  - name: transcript turn totals and phases agree
    module: /src/mockups/inuse/TranscriptApp.jsx
    component: default
    probes:
      - {selector: '.txn-app', text: 9 turns, absent: 8 turns}
      - {selector: '.rng', text: turns 1–3, absent: turns 0–2}
      - {selector: '.txn-app .subtask-foot', text: returned to claude}
      - {selector: '.txn-app .subtask-foot [data-brand="claude"]', count: 1}
      - {selector: '.txn-app .subtask-foot .lucide-corner-down-right', count: 1}
  - name: changes legend is literal
    module: /src/mockups/inuse/GraphMap.jsx
    component: ChangesView
    probes:
      - {selector: '.gmp-changes-legend', text: a star marks a recorded session, absent: flies a sparkle}
      - {selector: '.gmp-changes-legend .cg-dot-filled .cg-spark', count: 1}
  - name: local transcript replaces archived app name
    module: /src/mockups/inuse/InUseShell.jsx
    component: default
    probes:
      - {selector: 'div', absent: transcript-browser}
      - {selector: 'div', text: peasant transcript}
  - name: village title follows transcript fixture
    module: /src/mockups/inuse/CommonsApp.jsx
    component: default
    query: '?commons=transcript-detail'
    probes:
      - {selector: '.txn-app', text: Port the transcript canvas into the shared package, absent: Fix flaky ingest test}
      - {selector: '.txn-app .subtask-foot', text: returned to claude}
      - {selector: '.txn-app .subtask-foot [data-brand="claude"]', count: 1}
      - {selector: '.txn-app .subtask-foot .lucide-corner-down-right', count: 1}
  - name: direct publish success also sets published bar
    module: /src/mockups/inuse/TranscriptApp.jsx
    component: default
    query: '?publish=done'
    probes:
      - {selector: '.pub-bar', text: published, absent: not published}
  # Update mode names collectives that already read the transcript, so the picker's reason does not
  # belong on those rows; the picker's own, still unadded suggestions keep theirs.
  - name: update mode keeps no suggestion note on a collective that already reads
    module: /src/mockups/inuse/TranscriptApp.jsx
    component: default
    query: '?publish=ready&bar=published'
    probes:
      - {selector: '.pub-access-row', text: Acme Platform}
      - {selector: '.pub-access-row', absent: suggested}
      - {selector: '.pub-picker-row', text: 'curated, waits for the owner’s approval'}
  - name: first publish keeps the picker suggestion note on a reader row
    module: /src/mockups/inuse/TranscriptApp.jsx
    component: default
    query: '?publish=ready'
    probes:
      - {selector: '.pub-access-row', text: 'suggested, repo acme/ingest-api is linked'}
      - {selector: '.pub-picker-row', text: 'curated, waits for the owner’s approval'}
  # the ledger presentation is opt-in: the default demo stays classic, and the query flag is the
  # only way in, so a regression that flips either direction is caught here.
  - name: transcript demo stays classic without the ledger flag
    module: /src/mockups/inuse/TranscriptApp.jsx
    component: default
    probes:
      - {selector: '.txn-app', count: 1}
      - {selector: '.txn-minimap', count: 0}
      - {selector: '.txn-rail-turns', count: 0}
  - name: transcript demo opts into the ledger presentation
    module: /src/mockups/inuse/TranscriptApp.jsx
    component: default
    query: '?transcript=ledger'
    probes:
      - {selector: '.txn-app.txn-ledger', count: 1}
      - {selector: '.txn-sub', text: 'a public transcript from fairtrade, read as a ledger.'}
      - {selector: '.txn-rail-turn', count: 2}
