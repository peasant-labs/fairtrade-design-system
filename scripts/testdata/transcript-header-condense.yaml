# Mounted-source cases for the transcript session header that leaves once the full
# trace is scrolled. Geometry fields stand in for the live scroller's box so jsdom can
# reproduce the release guard: the header hides only while the stream keeps more than
# threshold + slack of overflow after the header's own height is released to it.
# steps: scroll:<offset> | tab:<id> | view:<list|graph> | focus:header | blur
# expectedCondensedTrail / expectedStickyTrail record the root state after EVERY step;
# the sticky trail is the rendered pinned scrubber, so it is false whenever the trace
# list itself is not mounted (another tab, graph view).
cases:
  - name: scrolling the trace past the threshold hides the session header
    turns: 6
    scrollHeight: 3000
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:120]
    expectedCondensedTrail: [true]
    expectedStickyTrail: [true]
  - name: scrolling under the threshold keeps the session header
    turns: 6
    scrollHeight: 3000
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:40]
    expectedCondensedTrail: [false]
    expectedStickyTrail: [false]
  - name: exactly the threshold keeps the session header
    turns: 6
    scrollHeight: 3000
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:56]
    expectedCondensedTrail: [false]
    expectedStickyTrail: [false]
  - name: short overflow pins the scrubber but keeps the session header
    turns: 6
    scrollHeight: 800
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:120]
    expectedCondensedTrail: [false]
    expectedStickyTrail: [true]
  - name: overflow just past the release slack hides the session header
    turns: 6
    scrollHeight: 811
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:120]
    expectedCondensedTrail: [true]
    expectedStickyTrail: [true]
  - name: overflow exactly at the release slack keeps the session header
    turns: 6
    scrollHeight: 810
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:120]
    expectedCondensedTrail: [false]
    expectedStickyTrail: [true]
  - name: scrolling back to the top restores the session header
    turns: 6
    scrollHeight: 3000
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:120, scroll:0]
    expectedCondensedTrail: [true, false]
    expectedStickyTrail: [true, false]
  - name: focus inside the session header keeps it visible while scrolling
    turns: 6
    scrollHeight: 3000
    clientHeight: 600
    headerHeight: 130
    steps: [focus:header, scroll:120, blur, scroll:130]
    expectedCondensedTrail: [false, false, false, true]
    expectedStickyTrail: [false, true, true, true]
  - name: leaving the full trace tab restores the session header
    turns: 6
    scrollHeight: 3000
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:120, tab:files]
    expectedCondensedTrail: [true, false]
    expectedStickyTrail: [true, false]
  - name: returning to the full trace re-derives the header from the fresh scroller
    turns: 6
    scrollHeight: 3000
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:120, tab:files, tab:trace, scroll:130]
    expectedCondensedTrail: [true, false, true, true]
    expectedStickyTrail: [true, false, true, true]
  - name: graph view restores the session header
    turns: 6
    scrollHeight: 3000
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:120, view:graph]
    expectedCondensedTrail: [true, false]
    expectedStickyTrail: [true, false]
  - name: returning to list view from graph restores the reading position and the condensed header
    turns: 6
    scrollHeight: 3000
    clientHeight: 600
    headerHeight: 130
    steps: [scroll:120, view:graph, view:list]
    expectedCondensedTrail: [true, false, true]
    expectedStickyTrail: [true, false, true]
