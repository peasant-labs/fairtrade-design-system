expectedCaseCount: 12
caseNames:
  - defaults survive json roundtrip
  - selection also focuses the navigator
  - keyboard semantic selection uses the reducer
  - expansion ids are normalized
  - filter retains deep matching context
  - open in map is atomic
  - grain change clears expansion
  - canvas and navigator share selection
  - viewport accepts finite values and rejects invalid scale
  - replace never carries stale fields
  - file grain stays aggregate until explicit expansion
  - explicit expansion reaches file grain within one folder

actionSamples:
  - {name: replace, action: {type: replace, state: {}}}
  - {name: hydrate, action: {type: hydrate, state: {}}}
  - {name: set presentation, action: {type: set-presentation, presentation: canvas}}
  - {name: select, action: {type: select, id: internal}}
  - {name: clear selection, action: {type: clear-selection}}
  - {name: focus, action: {type: focus, id: null}}
  - {name: set filter, action: {type: set-filter, filter: ingest}}
  - {name: set expanded, action: {type: set-expanded, ids: [internal]}}
  - {name: toggle expanded, action: {type: toggle-expanded, id: internal}}
  - {name: set grain, action: {type: set-grain, grain: file}}
  - {name: set viewport, action: {type: set-viewport, viewport: {scale: 1, panX: 0, panY: 0}}}
  - {name: open in map, action: {type: open-in-map, id: internal}}
  - {name: reveal, action: {type: reveal, id: internal, grain: file, expandedIds: [internal]}}

