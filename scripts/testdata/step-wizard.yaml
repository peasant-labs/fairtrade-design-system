# Cases for the step wizard (src/ui/StepWizard.jsx). scripts/step-wizard.test.mjs mounts the REAL
# components for each case and checks what a reader and a host reach: the place each step's label
# is given under its marker and the words it is set in (the geometry that follows from a place, and
# whether every word fits, is measured in a browser, in the LabelsInsideFrame and TenStops stories),
# the controlled frame's regions and count, and the uncontrolled wizard that is built on the frame.
#
# `steps` is the pool a case draws its first `count` steps from.
steps:
  - {id: welcome, label: welcome}
  - {id: projects, label: projects}
  - {id: sessions, label: sessions}
  - {id: redaction, label: redaction}
  - {id: review, label: review}
  - {id: license, label: license}
  - {id: collectives, label: collectives}
  - {id: share, label: share}
  - {id: confirm, label: confirm}
  - {id: done, label: done}

cases:
  # kind places: StepIndicator over the first `count` steps; `expected.places` is the place of each
  # label in order, `expected.gaps` the gap count the rail hands the stylesheet for the label shares.
  - {name: label places for 1 step, kind: places, count: 1, expected: {places: [only], gaps: '1'}}
  - {name: label places for 2 steps, kind: places, count: 2, expected: {places: [start, end], gaps: '1'}}
  - {name: label places for 3 steps, kind: places, count: 3, expected: {places: [start, middle, end], gaps: '2'}}
  - {name: label places for 4 steps, kind: places, count: 4, expected: {places: [start, middle, middle, end], gaps: '3'}}
  - {name: label places for 5 steps, kind: places, count: 5, expected: {places: [start, middle, middle, middle, end], gaps: '4'}}
  - {name: label places for 6 steps, kind: places, count: 6, expected: {places: [start, middle, middle, middle, middle, end], gaps: '5'}}
  - {name: label places for 7 steps, kind: places, count: 7, expected: {places: [start, middle, middle, middle, middle, middle, end], gaps: '6'}}
  - {name: label places for 8 steps, kind: places, count: 8, expected: {places: [start, middle, middle, middle, middle, middle, middle, end], gaps: '7'}}
  - {name: label places for 9 steps, kind: places, count: 9, expected: {places: [start, middle, middle, middle, middle, middle, middle, middle, end], gaps: '8'}}
  - {name: label places for 10 steps, kind: places, count: 10, expected: {places: [start, middle, middle, middle, middle, middle, middle, middle, middle, end], gaps: '9'}}

  # kind regions: the controlled frame with every slot filled.
  - name: the frame lays out head, body and foot
    kind: regions
    count: 3
    current: projects
    props: {aria-label: set up the commons, className: host-frame}
    bodyProps: {id: host-body, role: group, aria-label: 'step 2', className: host-body}
    expected:
      order: [swz-head, swz-body, swz-foot]
      frame: {tag: SECTION, label: set up the commons, classes: [swz, host-frame]}
      rail: {tag: NAV, label: set up the commons progress}
      head: head note
      body: the body
      footStart: back slot
      footEnd: continue slot
      bodyAttributes: {id: host-body, role: group, label: 'step 2', classes: [swz-body, host-body]}

  # kind count: the count under each position, as words for assistive technology and as drawn.
  - {name: the count reads the current step, kind: count, count: 4, current: welcome, expected: {words: step 1 of 4, drawn: step 1 / 4, currentMarkers: 1}}
  - {name: the count follows the current step, kind: count, count: 4, current: redaction, expected: {words: step 4 of 4, drawn: step 4 / 4, currentMarkers: 1}}
  - {name: a current step that names no step counts as step 0, kind: count, count: 3, current: nowhere, expected: {words: step 0 of 3, drawn: step 0 / 3, currentMarkers: 0}}

  # kind names: the accessible names the frame hands its regions.
  - {name: the rail is named after the frame by default, kind: names, count: 2, current: welcome, props: {aria-label: contribute}, expected: {frame: contribute, rail: contribute progress}}
  - {name: the frame and rail have names with no host label, kind: names, count: 2, current: welcome, props: {}, expected: {frame: step wizard, rail: step wizard progress}}

  # kind names with `component: wizard`: the uncontrolled wizard names its regions the way the frame
  # does, so there is one default rail name and not a second one of its own.
  - {name: the wizard names its rail after itself by default, kind: names, component: wizard, count: 2, current: welcome, props: {}, expected: {frame: step wizard, rail: step wizard progress}}
  - {name: the wizard names its rail after the name the host gives it, kind: names, component: wizard, count: 2, current: welcome, props: {aria-label: contribute}, expected: {frame: contribute, rail: contribute progress}}

  # kind names with `component: indicator`: the rail on its own has no frame to take a name from, so it
  # is named `progress` unless the host gives it one.
  - {name: a standalone rail is named progress by default, kind: names, component: indicator, count: 2, current: welcome, props: {}, expected: {rail: progress}}
  - {name: a standalone rail keeps the name the host gives it, kind: names, component: indicator, count: 2, current: welcome, props: {aria-label: contribute}, expected: {rail: contribute}}

  # kind head: a head the host leaves empty (null, false or true, which React draws as nothing) draws
  # no head slot, so no margin is left under the rail.
  - {name: an empty head draws no head slot, kind: head, count: 2, current: welcome, heads: [null, false, true], expected: {slots: 0}}

  # kind words: StepIndicator over `labels` (or the first `count` pool steps). `expected.words` is
  # each label as the runs it is set in, `expected.middle` and `expected.edge` the longest word the
  # rail hands the stylesheet for its middle labels and for its first and last labels, in
  # characters. A word never breaks, and a rail that cannot fit every word hides all its labels
  # together in the stylesheet while they stay in the accessible name; the geometry of that hide is
  # measured in a browser, in the LabelsInsideFrame and TenStops stories.
  - name: no-label-breaks-inside-a-word
    kind: words
    labels: [welcome, auto-ingest new branches, share]
    expected:
      words: [[welcome], [auto-ingest, new, branches], [share]]
      middle: 11
      edge: 7

  - name: labels-hide-together-when-a-word-does-not-fit
    kind: words
    labels: [welcome, review the scan, done]
    expected:
      words: [[welcome], [review, the, scan], [done]]
      middle: 6
      edge: 7

  - name: hidden-labels-stay-in-the-accessible-name
    kind: words
    count: 10
    expected:
      words: [[welcome], [projects], [sessions], [redaction], [review], [license], [collectives], [share], [confirm], [done]]
      middle: 11
      edge: 7

  # kind jump: a completed or reachable marker reports its id, a locked one does not.
  - name: a reachable marker jumps and a locked one does not
    kind: jump
    count: 4
    current: projects
    completed: [welcome]
    reachable: [welcome, projects, sessions]
    clicks: [sessions, redaction, welcome]
    expected: {jumps: [sessions, welcome], locked: [redaction]}

  # kind wizard: the uncontrolled wizard, built on the frame, walks its steps.
  - name: the wizard walks continue and back through the frame
    kind: wizard
    count: 3
    expected:
      first: {words: step 1 of 3, primary: continue, backDisabled: true}
      second: {words: step 2 of 3, primary: continue, backDisabled: false}
      last: {words: step 3 of 3, primary: submit, backDisabled: false}
      backTo: {words: step 2 of 3}
      completed: [welcome, projects, sessions]
