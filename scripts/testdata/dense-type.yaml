# Chrome is mono 14; prose, code and messages are at least 16. No literal fallbacks.
register:
  chrome: {fontToken: --fs-label, familyToken: --font-mono, minimumPx: 14}
  reading: {fontToken: --fs-body, familyToken: --font-body, minimumPx: 16}
  code: {fontToken: --fs-body, familyToken: --font-mono, minimumPx: 16}
source:
  - name: unannotated headings preserve user case
    kind: headingCase
    mutation: global heading lowercasing returns
  - name: owned micro consumers are converted
    kind: ownedMicro
    mutation: a micro consumer returns
  - name: retirement never leaves a dangling consumer
    kind: retirement
    mutation: declaration removed before consumers
  - name: dense font literals meet the chrome floor
    kind: literals
    mutation: a dense label shrinks to eleven pixels
deferredConsumers:
  - src/ui/Redaction.css
  - src/ui/ConsentDialog.css
  - src/index.css:.menu-cap
responsive:
  - name: collective grid
    file: src/index.css
    selector: .cex-coll-grid
    desktop: 'grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)'
    query: '@media (width < 768px)'
    narrow: 'grid-template-columns: 1fr'
  - name: transcript grid
    file: src/index.css
    selector: .cex-grid
    desktop: 'grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)'
    query: '@media (width < 768px)'
    narrow: 'grid-template-columns: 1fr'
publishContract:
  # Default desktop split, with stacked columns only below the phone boundary.
  query: '@media (width < 480px)'
  desktopSplit: 'grid-template-columns: 1fr 1fr'
  narrowSplit: 'grid-template-columns: 1fr'
  desktopDivider: 'border-left: var(--bd)'
  narrowDivider: 'border-left: 0'
  widths: [320, 390]
  themes: [dark, light]
  acceptance: >-
    Open the actual publish dialog, show the where split, and expand scanner help.
    Primary labels and confidence help wrap with no line clamp or hidden overflow.
    All controls remain within the dialog and reachable by keyboard. The split has
    one column at both widths; its divider does not consume primary text space.
    Dialog scrollWidth is no greater than clientWidth (one pixel rounding tolerance).
    Bind and read back data-theme before measuring. Test a long repository name.
measurements:
  # the phone title is a clamp, not free-flowing prose: it is held to two lines at --fs-md (18px) so
  # a long title can never take the header over half a 390x844 viewport. The clamp itself is guarded
  # by the phone-header journey and the transcript reading-layout gate.
  - name: transcript title
    query: app=transcript
    selector: .txn-title
    minimumPx: 18
    mutation: title shrinks and clamps
  - name: transcript prose
    query: app=transcript
    selector: .txn-body .txn-md-prose
    minimumPx: 16
    mutation: speech shrinks
    familyToken: --font-body
    paragraphGap: true
  - name: adjacent transcript paragraphs
    query: app=transcript&transcript=ledger-reading
    selector: '.txn-body .txn-md-prose + .txn-md-prose'
    minimumPx: 16
    mutation: adjacent speech shrinks
    familyToken: --font-body
    paragraphGap: true
  - name: transcript toolbar
    query: app=transcript
    selector: .txn-trace-head
    minimumPx: 14
    mutation: toolbar overflows
    reflow: true
    # the bar leaves a phone (width < 768px), so the type floor is measured on desktop
    desktopOnly: true
  - name: filter rail
    query: app=transcript
    selector: .txn-filters
    minimumPx: 14
    mutation: filter rail overflows
    reflow: true
    desktopOnly: true
  - name: commit subjects
    query: app=graph&section=changes
    selector: .cg-msg
    minimumPx: 16
    wrap: true
    mutation: commit subject clamps
    reflow: true
  # the derived trail leaves a phone (it repeats the title), so the trail's density and reflow guard
  # runs at the desktop width, where the trail is mounted.
  - name: transcript breadcrumbs
    query: app=transcript
    selector: .txn-crumb
    minimumPx: 14
    reflow: true
    desktopOnly: true
    mutation: breadcrumb has zero width
    reflowMutation: zero-width
  - name: transcript actions
    query: app=transcript
    selector: .txn-actions
    minimumPx: 14
    reflow: true
    mutation: actions overflow
  - name: transcript footer
    query: app=transcript
    selector: .txn-footer
    minimumPx: 14
    reflow: true
    mutation: footer covers the content
    reflowMutation: overlay
  - name: analytics labels
    query: app=graph&section=analytics
    selector: .gan-tile
    minimumPx: 14
    reflow: true
    mutation: tile labels overflow
  - name: code map toolbar
    query: app=graph&section=map
    selector: .mc-toolbar
    minimumPx: 14
    reflow: true
    mutation: map toolbar overflows
  - name: map navigation controls
    query: app=graph&section=map
    selector: .rs-toolbar
    minimumPx: 14
    reflow: true
    mutation: navigation toolbar overflows
  - name: map navigation labels
    query: app=graph&section=map
    selector: .gmp-navigator-path
    minimumPx: 14
    wrap: true
    mutation: navigation path clamps
  - name: settings controls
    query: app=graph&section=settings
    selector: .iu-view
    minimumPx: 14
    reflow: true
    mutation: settings grow wider than their page
  - name: commons prose
    query: app=commons&commons=collectives
    selector: .cmg-note
    minimumPx: 16
    familyToken: --font-body
    mutation: commons note shrinks
  - name: commons sections
    query: app=commons&commons=collectives
    selector: .cmg-section-title
    minimumPx: 20
    wrap: true
    headingGap: true
    mutation: commons heading shrinks
  - name: analytics toggles
    query: app=graph&section=analytics
    selector: .gan-seg
    minimumPx: 14
    mutation: toggle shrinks
  - name: analytics headings
    query: app=graph&section=analytics
    selector: .gan-card-title
    minimumPx: 20
    wrap: true
    mutation: heading shrinks
widths: [320, 390, 1440]
themes: [dark, light]
toolGroupLabels: [file edits, bash]
expandedTools:
  name: expanded tool reading font floor
  query: app=transcript
  width: 390
  readings:
    - buttonText: pnpm -r typecheck
      selector: .txn-tc-desc
      text: workspace-wide typescript check
      minimumPx: 16
    - buttonText: docs-writer
      selector: .txn-fetch-md
      text: 'Write the README contract section for'
      minimumPx: 16
collapsedSearch:
  name: search reveals only its matching collapsed turn
  query: app=transcript&transcript=classic
  width: 390
  turn: 0
  otherTurn: 2
  text: Port the transcript canvas
  count: 1/1
case:
  name: checkpoint message keeps case
  query: app=transcript
  selector: .txn-cp-msg
  text: 'Fix OAuth API Handling Without Losing User Content'
  mutation: checkpoint inherits lowercase chrome
