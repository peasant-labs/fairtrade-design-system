# Expected engine labels; semantic ids are not display labels.
categories:
  - {name: credential category, member: Secrets, labelMember: Credential, category: secrets, label: CREDENTIAL}
  - {name: personal information category, member: PII, labelMember: PII, category: pii, label: PII}
  - {name: path category, member: Paths, labelMember: Path, category: paths, label: PATH}
  - {name: project category, member: Project, labelMember: Internal, category: project, label: INTERNAL}
confidence: 0.99
confidenceText: confidence 0.99
confidenceHelp: how sure the scanner is that this is a real match
exports:
  - RedactionCategory
  - RedactionCategoryLabel
  - AllRedactionCategories
  - AllRedactionCategoryLabels
  - isRedactionCategory
  - parseRedactionCategory
  - parseRedactionCategoryLabel
  - redactionCategoryFromLabel
  - redactionCategoryLabel
frozen:
  - RedactionCategory
  - RedactionCategoryLabel
  - AllRedactionCategories
  - AllRedactionCategoryLabels
unknown:
  - {name: unknown category, category: future-category}
  - {name: missing category, category: null}
  - {name: prototype property is not a category, category: constructor}
  - {name: display label is not a wire category, category: CREDENTIAL}
  - {name: unknown category blocks retry, category: future-category, state: stopped}
  - {name: wrong case category, category: Secrets}
  - {name: empty category, category: ''}
  - {name: object category, category: {key: secrets}}
invalidLabels:
  - {name: semantic key is not a label, label: secrets}
  - {name: wrong case label, label: credential}
  - {name: padded label, label: ' CREDENTIAL '}
  - {name: prototype label, label: constructor}
  - {name: missing label, label: null}
  - {name: object label, label: {key: CREDENTIAL}}
