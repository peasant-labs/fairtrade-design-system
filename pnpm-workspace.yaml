# pnpm workspace. The root (.) is the publishable @peasant-labs/fairtrade runtime
# package plus the local presentation app. packages/* enrolls workspace children;
# packages/tokens is a generated artifact directory, not a package. A fairtest
# private workspace source package, if added, stays unpublished and outside the
# runtime exports, dependencies, and packed files.
packages:
  - '.'
  - 'packages/*'

# pnpm 11 install policy.
# Build scripts: pnpm 11 makes ignored build scripts a hard error
# (ERR_PNPM_IGNORED_BUILDS) unless each package is reviewed here.
# Policy: no build script runs. Every package pnpm reports is marked
# false (explicitly denied, not silently skipped). Their binaries come
# from optional prebuilt platform packages, not from the build script.
# https://pnpm.io/settings/build#allowbuilds
allowBuilds:
  esbuild: false

# Supply-chain age gate: block a package until it has been published
# for at least 3 days. First-party packages are exempt so a same-day
# fairtrade/schema release is not blocked by its own policy.
# https://pnpm.io/settings/dependency-resolution#minimumreleaseage
# https://pnpm.io/settings/dependency-resolution#minimumreleaseageexclude
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@peasant-labs/*'

# Node engine enforcement: pnpm 11 enforces a project's declared `engines` at
# install time (ERR_PNPM_UNSUPPORTED_ENGINE), so an out-of-contract Node fails
# the install instead of only warning. Install-time only: this does NOT gate
# test execution on an already-installed tree, so a Fairtest command run under
# an out-of-contract Node with dependencies present still produces a confusing
# partial-suite result. The setting lives here because pnpm 11 reads non-auth
# settings from pnpm-workspace.yaml, not from .npmrc.
# https://pnpm.io/settings/cli#enginestrict
engineStrict: true
