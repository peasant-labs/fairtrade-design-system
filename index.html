<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- ====================================================================
     SEO + social-share metadata.
     PLACEHOLDER DOMAIN: every absolute url below uses the base
       https://fairtrade-design-system.up.railway.app
     The real Railway domain is not finalized. Replace that base in the
     canonical, og:url, og:image and twitter:image tags with the live
     domain at deploy time. og:image / twitter:image MUST stay ABSOLUTE
     (crawlers do not resolve relative paths). og-image.png + the icons
     are generated by scripts/gen-og.mjs.
==================================================================== -->

<!-- core seo -->
<title>fairtrade - an open-source design system for agent products</title>
<meta name="description" content="an open-source design system for building agent products of every kind: orchestration, analysis, transcripts, pr review, and more. react + tailwind, dark-first, square, neuroinclusive, with a documented component library." />
<meta name="robots" content="index,follow" />
<link rel="canonical" href="https://fairtrade-design-system.up.railway.app/" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#070706" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />

<!-- open graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="fairtrade design system" />
<meta property="og:title" content="fairtrade - an open-source design system for agent products" />
<meta property="og:description" content="an open-source design system for building agent products of every kind: orchestration, analysis, transcripts, pr review, and more. react + tailwind, dark-first, square, neuroinclusive, with a documented component library." />
<meta property="og:url" content="https://fairtrade-design-system.up.railway.app/" />
<meta property="og:image" content="https://fairtrade-design-system.up.railway.app/og-image.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="the fairtrade wordmark on a dark canvas with a faint amber grid and a wheat-stalk mark, captioned an open-source design system for agent products." />
<meta property="og:locale" content="en_US" />

<!-- twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="fairtrade - an open-source design system for agent products" />
<meta name="twitter:description" content="an open-source design system for building agent products of every kind: orchestration, analysis, transcripts, pr review, and more. react + tailwind, dark-first, square, neuroinclusive, with a documented component library." />
<meta name="twitter:image" content="https://fairtrade-design-system.up.railway.app/og-image.png" />
<meta name="twitter:image:alt" content="the fairtrade wordmark on a dark canvas with a faint amber grid and a wheat-stalk mark, captioned an open-source design system for agent products." />

<!-- icons -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Atkinson+Hyperlegible+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script>(function(){var q=(location.search.match(/theme=(\w+)/)||[])[1];if(q==='light')document.documentElement.setAttribute('data-theme','light');if(/[?&]cap/.test(location.search))document.documentElement.setAttribute('data-cap','1');})();</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
