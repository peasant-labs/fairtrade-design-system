name: ci

on:
  push:
    branches: [main, 'tier-**']
  pull_request:
  workflow_dispatch:

# read-only: this workflow validates the gates, it never deploys or writes Pages
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick a runner
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          if ! online=$(gh api /orgs/peasant-labs/actions/runners --paginate \
              --jq '.runners[] | select(.status == "online") | select(any(.labels[]; .name == "container")) | .name' 2>/dev/null | wc -l); then
            echo "::warning::runner availability query failed; using the fallback"
            online=0
          fi
          echo "online runners: ${online}"
          if [ "${online}" -gt 0 ]; then
            echo 'runner=["self-hosted","container"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Report chosen runner
        env:
          CHOSEN: ${{ steps.pick.outputs.runner }}
        run: 'echo "chosen: $CHOSEN"'

  # Continuous gate on the PUBLISHABLE artifact. Before this, the library build
  # chain (vite.lib + vite.lib-css + finalize + tsc + smoke-lib + contrast-on-dist
  # + the pack-content assertion) ran ONLY at prepack/publish time — so a PR that
  # broke the exports/files map or the lib build was green in CI and only failed
  # when someone next published (the 0.0.1 incident). This validates the exact
  # tarball that would publish, on every PR/push, independent of who publishes.
  lib:
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Contract gate: checkJs + strict + noImplicitAny on the transcript wire
      # contract / TranscriptViewModel type-test. Runs first so a contract leak
      # fails early with a clear attribution (not buried in the Vite/tsc build).
      # Also called as the first step of build:lib below; explicit here for CI
      # step attribution.
      - name: Contract type gate (wire contract + VM leak assertions)
        run: pnpm test:contract

      # Full library build: vite lib + CSS, finalize (CSS content assertion),
      # tsc declarations, smoke-lib (render + types-emit assertion), contrast on
      # the shipped dist/lib/tokens.css, and the pack-content assertion.
      - name: Build library (publishable artifact)
        run: pnpm build:lib

      # Belt-and-suspenders: assert the npm tarball file set matches exports[].
      - name: Assert pack contents (exports <-> tarball)
        run: pnpm pack:check

  gates:
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 30
    # The official Playwright image carries the browsers (pinned to the same
    # 1.63.0 the repo tests against) and their system dependencies, so jobs
    # never apt-install at runtime and never download browsers. --ipc=host
    # and --init are Playwright's recommended Chromium flags. The image ships
    # Node 24, so setup-node below still provides the repo's Node 26. This is
    # the same container village's journey job runs in.
    container:
      # mcr.microsoft.com/playwright:v1.63.0-noble, linux/amd64 manifest.
      image: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host --init
    env:
      # Playwright builds its temp profiles under TMPDIR; the pool checks the
      # repo out under a deep work path that would exceed the unix socket path
      # limit. Point temp files at /tmp so the browser gates can launch.
      TMPDIR: /tmp
      # The one Fairtest run identity and the one run root. Every Fairtest
      # command in this job reads exactly these; no command re-declares a root
      # or an id. The root is absolute and its final segment is the run id, so
      # the envelope can tell its own root apart from another run's.
      FAIRTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      FAIRTEST_RUN_ROOT: ${{ github.workspace }}/review-capture/fairtest/${{ github.run_id }}-${{ github.run_attempt }}
      # The explicit Fairtest budget inside this unchanged 30-minute job. The
      # run envelope records the same total and per-stage minutes; a drift
      # between this declaration, the envelope, and the job timeout fails the
      # workflow guard.
      FAIRTEST_BUDGET_MINUTES: "24"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # gate 0: generated artifacts and the published token package must stay in sync.
      - name: Check generated artifacts and token package are fresh
        run: pnpm gen:check

      # gate 1: contrast (pure JS, no browser) + production build -> dist/.
      # base='/' is correct here (CI serves at the root, not the Pages subpath),
      # so VITE_BASE is intentionally unset.
      - name: Build (contrast gate + vite build)
        run: pnpm build

      # The job container already carries Playwright's own Chromium for the
      # pinned @playwright/test. The two remaining puppeteer probes (timeline)
      # read it from CHROME_PATH; the journeys below use it directly with no
      # CHROME_PATH plumbing at all. Resolve the path through Playwright's own
      # registry rather than globbing its install directory.
      - name: Point CHROME_PATH at the container browser
        run: |
          CHROME="$(pnpm exec node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          test -x "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      # gate 2: the twenty interaction checks, ported from scripts/validate.mjs
      # onto the journey harness (scripts/journey/app-validate.journey.mjs).
      # The journey config serves dist/ on :5180 itself, so no manual
      # vite-preview/wait-on steps that could drift from the asserted URL.
      - name: Build Storybook
        run: pnpm build-storybook

      # Fairtest durable evidence: one immutable run envelope, the browser-free
      # pre-service contracts (inventory, list, selection, selection receipt),
      # the bounded product/component producer, then verification, an always-run
      # preflight, and a pinned whole-root upload. The 24-minute Fairtest budget
      # is declared in guards/run-envelope.json and enforced by the preflight;
      # the enclosing 30-minute job is unchanged.
      - name: Fairtest run envelope
        run: pnpm test:fairtest:init

      # The browser-free contracts run before any service starts: the promotion
      # record, the four child contract commands, the runner inventory, the
      # run-envelope wiring guard (which pins the upload SHA and always-run
      # steps), and the SurfaceGate compatibility gate.
      - name: Fairtest browser-free contracts
        run: |
          pnpm test:fairtest:promotion
          pnpm --filter @peasant-labs/fairtest test:core
          pnpm --filter @peasant-labs/fairtest test:adapter
          pnpm --filter @peasant-labs/fairtest test:evidence
          pnpm --filter @peasant-labs/fairtest test:bridge-contract
          pnpm test:fairtest:inventory
          pnpm test:fairtest:envelope
          pnpm test:fairtest:compat

      - name: Fairtest inventory and selection (browser-free, before services)
        run: |
          pnpm test:fairtest:list:ci
          pnpm test:fairtest:list:local
          pnpm test:fairtest:select
          pnpm test:fairtest:selection-receipt

      # The bounded producer starts the one adapter-managed loopback service and
      # writes a fresh producer/ subtree; JOURNEY_HTML=0 keeps report generation
      # out of the budget. retries: 0 is declared by the one-project Fairtest
      # Playwright config.
      - name: Fairtest mounted product producer
        env:
          JOURNEY_HTML: "0"
        run: pnpm test:fairtest:mounted -- --target=product

      - name: Fairtest mounted component producer
        env:
          JOURNEY_HTML: "0"
        run: pnpm test:fairtest:mounted -- --target=component

      - name: Fairtest evidence verification
        run: pnpm test:fairtest:verify

      # Always runs, including after a producer failure, so the retained partial
      # producer output is reported before the upload. It fails closed when any
      # owned subtree is missing or inconsistent.
      - name: Fairtest evidence preflight
        if: always()
        run: pnpm test:fairtest:preflight

      # Uploads the WHOLE run root, including partial producer output on
      # failure. The action is pinned to a full commit SHA, the upload fails
      # when no files are found, and retention is bounded.
      - name: Fairtest evidence upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fairtest-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FAIRTEST_RUN_ROOT }}
          if-no-files-found: error
          retention-days: 14

      # gate 3: element journeys (story smoke over the whole catalog, the
      # twenty app checks, the SessionGroupDisclosure interaction) through
      # Playwright's bundled Chromium. Real user input absorbs what
      # check-map-pointer.mjs proved separately with a raw CDP mouse, so the
      # puppeteer story smoke and map gate are retired from CI (the scripts
      # stay for local use).
      - name: Journey gates
        run: pnpm journey:ci

      - name: Timeline route gate (production build + source mutation)
        run: pnpm test:timeline-rendered && pnpm test:timeline-session-route:mutations

      - name: Upload Storybook build on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7
