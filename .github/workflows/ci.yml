name: ci

on:
  push:
    branches: [main, 'tier-**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# read-only: this workflow validates the gates, it never deploys or writes Pages
permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-runner:
    uses: peasant-labs/infra/.github/workflows/runner-router.yml@71e687cef7eede9a63659be98ce9adac3c563398
    with:
      fallback: '["ubuntu-latest"]'
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # Continuous gate on the PUBLISHABLE artifact. Before this, the library build
  # chain (vite.lib + vite.lib-css + finalize + tsc + smoke-lib + contrast-on-dist
  # + the pack-content assertion) ran ONLY at prepack/publish time — so a PR that
  # broke the exports/files map or the lib build was green in CI and only failed
  # when someone next published (the 0.0.1 incident). This validates the exact
  # tarball that would publish, on every PR/push, independent of who publishes.
  lib:
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Contract gate: checkJs + strict + noImplicitAny on the transcript wire
      # contract / TranscriptViewModel type-test. Runs first so a contract leak
      # fails early with a clear attribution (not buried in the Vite/tsc build).
      # Also covered by test:lib below; explicit here for CI
      # step attribution.
      - name: Contract type gate (wire contract + VM leak assertions)
        run: pnpm test:contract

      # Build the library and declarations before testing the built artifact.
      - name: Build library (publishable artifact)
        if: "!(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'release('))"
        run: pnpm build:lib

      # Release PRs validate the same packaging path npm publication uses.
      - name: Validate release package (canonical prepack)
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'release(')
        run: pnpm prepack

      # Belt-and-suspenders: assert the npm tarball file set matches exports[].
      - name: Assert pack contents (exports <-> tarball)
        run: pnpm pack:check

      - name: Test library (behavior, mutations, and built rendering)
        run: pnpm test:lib

  fairtest:
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 40
    # The official Playwright image carries the browsers and their system
    # dependencies, so jobs never apt-install at runtime and never download
    # browsers. --ipc=host and --init are Playwright's recommended flags.
    container:
      image: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host --init
    env:
      TMPDIR: /tmp
      # The one Fairtest run identity and the one run root. Every Fairtest
      # command in this job reads exactly these.
      FAIRTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      FAIRTEST_RUN_ROOT: ${{ github.workspace }}/review-capture/fairtest/${{ github.run_id }}-${{ github.run_attempt }}
      # The explicit Fairtest budget inside the 40-minute job. The run envelope
      # records the same total and per-stage minutes.
      FAIRTEST_BUDGET_MINUTES: "12"
      # The mounted-row worker budget. Each worker binds its own loopback port.
      FAIRTEST_MOUNTED_WORKERS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Capture Fairtest runner facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNNER_JOB_NAME: fairtest
          ROUTER_REASON: ${{ needs.determine-runner.outputs.reason }}
        run: node scripts/journey/runner-facts.mjs capture

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # gate 0: generated artifacts and the published token package must stay in sync.
      - name: Check generated artifacts and token package are fresh
        run: pnpm gen:check

      # gate 1: contrast (pure JS, no browser) + production build -> dist/.
      - name: Build (contrast gate + vite build)
        run: pnpm build

      # gate 2: the component rows serve the built Storybook artifact.
      - name: Build Storybook
        run: pnpm build-storybook

      # Fairtest durable evidence: one immutable run envelope, the browser-free
      # pre-service contracts, the bounded producer, verification, an always-run
      # preflight, and a pinned whole-root upload.
      - name: Fairtest run envelope
        run: pnpm test:fairtest:init

      - name: Fairtest browser-free contracts
        run: |
          pnpm test:fairtest:types
          pnpm test:fairtest:type-coverage
          pnpm test:fairtest:paths
          pnpm test:fairtest:boundary
          pnpm test:fairtest:dispatch
          pnpm test:fairtest:promotion
          pnpm --filter @peasant-labs/fairtest test:core
          pnpm --filter @peasant-labs/fairtest test:adapter
          pnpm --filter @peasant-labs/fairtest test:evidence
          pnpm --filter @peasant-labs/fairtest test:bridge-contract
          pnpm --filter @peasant-labs/fairtest test:capture
          pnpm test:fairtest:inventory
          pnpm test:fairtest:envelope
          pnpm test:fairtest:compat

      - name: Fairtest inventory and selection (browser-free, before services)
        run: |
          pnpm test:fairtest:list:ci
          pnpm test:fairtest:list:local
          pnpm test:fairtest:select
          pnpm test:fairtest:selection-receipt

      - name: Fairtest process lifecycle
        env:
          FAIRTEST_CI_PROCESS: "1"
        run: pnpm test:fairtest:process

      - name: Fairtest mounted producer
        env:
          JOURNEY_HTML: "0"
        run: pnpm test:fairtest:mounted -- --target=all

      - name: Fairtest evidence verification
        run: pnpm test:fairtest:verify

      - name: Fairtest evidence preflight
        if: always()
        run: pnpm test:fairtest:preflight

      - name: Fairtest evidence upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fairtest-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FAIRTEST_RUN_ROOT }}
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Fairtest timing report
        if: always()
        run: |
          mkdir -p /tmp/fairtest-timing
          node scripts/journey/runner-facts.mjs merge /tmp/fairtest-timing/report.json

      - name: Upload Fairtest timing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fairtest-timing
          path: /tmp/fairtest-timing/report.json
          if-no-files-found: error
          retention-days: 7

  journeys:
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [dark, light]
    # The same pinned Playwright image as the Fairtest job. The theme projects run
    # on two runners, so the full catalog keeps its 3-worker cap per runner.
    container:
      image: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host --init
    env:
      TMPDIR: /tmp
      JOURNEY_SCREENSHOT: "off"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Capture journey runner facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNNER_JOB_NAME: journeys (${{ matrix.project }})
          ROUTER_REASON: ${{ needs.determine-runner.outputs.reason }}
        run: node scripts/journey/runner-facts.mjs capture

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # gate 1: contrast (pure JS, no browser) + production build -> dist/.
      - name: Build (contrast gate + vite build)
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Journey catalog name manifest
        run: |
          node scripts/journey/catalog-gate.mjs
          node --test scripts/journey/catalog-gate.test.mjs scripts/journey/runner-facts.test.mjs scripts/journey/recording-policy.test.mjs

      # Each theme runs its complete catalog at the measured 3-worker optimum.
      - name: Journey gates
        run: pnpm journey:ci --workers=3 --project=${{ matrix.project }}

      # The timeline route gate does not fan out: one project runs it so the
      # production probe and source mutation are not duplicated.
      - name: Timeline route gate (production build + source mutation)
        if: matrix.project == 'dark'
        run: |
          export CHROME_PATH="$(pnpm exec node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          test -x "$CHROME_PATH"
          pnpm test:timeline-rendered && pnpm test:timeline-session-route:mutations

      - name: Prepare journey timing report
        if: always()
        run: |
          mkdir -p scripts/journey/.artifacts
          node scripts/journey/runner-facts.mjs merge scripts/journey/.artifacts/report.json

      - name: Upload journey timing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-timing-${{ matrix.project }}
          path: scripts/journey/.artifacts/report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload journey artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-artifacts-${{ matrix.project }}
          path: scripts/journey/.artifacts
          retention-days: 7

      - name: Upload Storybook build on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storybook-static-${{ matrix.project }}
          path: storybook-static
          retention-days: 7

  gates:
    # The required check stays named "gates"; it fails if either the Fairtest
    # job or any journey shard fails. It uses the hosted runner, not the pool.
    needs: [fairtest, journeys]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both gate jobs
        run: |
          test "${{ needs.fairtest.result }}" = "success"
          test "${{ needs.journeys.result }}" = "success"
