name: ci

on:
  push:
    branches: [main, 'tier-**']
  pull_request:
  workflow_dispatch:

# read-only: this workflow validates the gates, it never deploys or writes Pages
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Continuous gate on the PUBLISHABLE artifact. Before this, the library build
  # chain (vite.lib + vite.lib-css + finalize + tsc + smoke-lib + contrast-on-dist
  # + the pack-content assertion) ran ONLY at prepack/publish time — so a PR that
  # broke the exports/files map or the lib build was green in CI and only failed
  # when someone next published (the 0.0.1 incident). This validates the exact
  # tarball that would publish, on every PR/push, independent of who publishes.
  lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Contract gate: checkJs + strict + noImplicitAny on the transcript wire
      # contract / TranscriptViewModel type-test. Runs first so a contract leak
      # fails early with a clear attribution (not buried in the Vite/tsc build).
      # Also called as the first step of build:lib below; explicit here for CI
      # step attribution.
      - name: Contract type gate (wire contract + VM leak assertions)
        run: pnpm test:contract

      # Full library build: vite lib + CSS, finalize (CSS content assertion),
      # tsc declarations, smoke-lib (render + types-emit assertion), contrast on
      # the shipped dist/lib/tokens.css, and the pack-content assertion.
      - name: Build library (publishable artifact)
        run: pnpm build:lib

      # Belt-and-suspenders: assert the npm tarball file set matches exports[].
      - name: Assert pack contents (exports <-> tarball)
        run: pnpm pack:check

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # gate 0: generated artifacts and the published token package must stay in sync.
      - name: Check generated artifacts and token package are fresh
        run: pnpm gen:check

      # gate 1: contrast (pure JS, no browser) + production build -> dist/.
      # base='/' is correct here (CI serves at the root, not the Pages subpath),
      # so VITE_BASE is intentionally unset.
      - name: Build (contrast gate + vite build)
        run: pnpm build

      # puppeteer-core bundles no browser; validate.mjs / sbsmoke.mjs read the
      # binary path from CHROME_PATH (falls back to the local macOS default).
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # setup-chrome's tool-cache install ships a chrome-sandbox helper without
      # the setuid bit, and the runner kernel restricts unprivileged user
      # namespaces — Chrome refuses to start rather than drop sandboxing. Give
      # the helper exactly what Chrome's own error prescribes (root-owned,
      # mode 4755) so the browser gates keep running SANDBOXED (no --no-sandbox).
      - name: Configure Chrome sandbox helper
        run: |
          SANDBOX="$(dirname "${{ steps.chrome.outputs.chrome-path }}")/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"

      # gate 2: the 20-check interactive validator, driven against the BUILT app.
      # serve dist/ on a fixed port, wait for it, then pass the URL explicitly so
      # the served port and the asserted URL can never drift.
      - name: Serve built app (vite preview)
        run: pnpm exec vite preview --port 5180 --strictPort &

      - name: Wait for app to be ready
        run: npx --yes wait-on http://localhost:5180 --timeout 60000

      - name: Validate (20-check puppeteer gate)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/validate.mjs "http://localhost:5180/?fb=off"

      # gate 3: storybook builds (the type/parse gate for src/ui/*).
      - name: Build Storybook
        run: pnpm build-storybook

      # gate 4: storybook smoke. sbsmoke.mjs self-serves storybook-static on its
      # own port, loads all stories headless, runs their play() tests, and exits
      # non-zero on a real assertion error (benign resource 404s are separated out).
      - name: Storybook smoke (render + play)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/sbsmoke.mjs

      # gate 4b: REAL-input map gate. play() tests dispatch synthetic events,
      # which skip pointer-capture retargeting — the one mechanism that made
      # the zoom cluster render fine yet never receive a click. This drives a
      # genuine CDP mouse against the built MapCanvas story.
      - name: Map pointer gate (real mouse)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/check-map-pointer.mjs

      - name: Upload Storybook build on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7
