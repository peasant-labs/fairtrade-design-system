name: deploy pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # GitHub Pages serves a project site under /<repo>/; drop this (or set "/")
          # for a custom domain or a root deploy.
          VITE_BASE: /peasant-design-system/
      # nest the compiled component library inside the site so the nav "storybook"
      # link resolves to /<repo>/storybook/. storybook's built assets are relative,
      # so it hosts correctly under the subpath with no base config. runs AFTER the
      # vite build (which empties dist/) so it is not clobbered.
      - name: Build Storybook into dist/storybook
        run: pnpm exec storybook build --output-dir dist/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
