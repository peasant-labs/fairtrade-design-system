# Publish @peasant-labs/fairtrade to npm when a release tag is pushed.
#
# Trigger: a `fairtrade-vX.Y.Z[-rcN]` annotated tag minted by release-pr.yml
# after a valid maintainer-authored release PR merges to main. The releaser App
# pushes the tag so this OIDC consumer runs; the default workflow token would
# not trigger this workflow. Pushing the tag replaces the old interactive
# `pnpm publish` + OTP step.
#
# Gates: `npm publish` runs this package's `prepack` = `pnpm build:lib`, the
# full library gate chain (contract type-tests, code-map/timeline/transcript
# behavior + mutation gates, css-token lint, contrast on the shipped dist,
# smoke-lib/transcript/map/changes, pack-content assertion). A red gate means
# no publish. The version-consistency guard below additionally refuses a tag
# whose version does not byte-match package.json's committed version.
#
# Authentication: npm Trusted Publishing (OIDC) - NOT a long-lived NPM_TOKEN
# secret. GitHub mints a short-lived OIDC token for this job, scoped to the
# `npm-publish` GitHub Actions environment that the npm Trusted Publisher
# registration is bound to; the npm CLI (>= 11.5.1, bundled with Node 26)
# exchanges it with the registry when no auth token is configured, so there is
# no secret to provision, rotate, or leak. Trusted publishing automatically
# adds provenance once the source repository is public; npm does not support
# provenance for private source repositories. package.json carries the exact
# canonical repository URL and the prepack gate rejects drift. Install/build
# stay on the repo's pinned pnpm (10.x, which lacks
# native OIDC publish support - the npm CLI is used for the one publish step
# only). One-time, maintainer-side registrations (the `npm-publish` GitHub
# environment; this repo + workflow + environment as the package's Trusted
# Publisher on npmjs.com) are documented in AGENTS.md, "npm publication".
name: npm-publish

on:
  push:
    tags: ['fairtrade-v*']

permissions:
  contents: read

jobs:
  npm-publish:
    name: publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read # checkout only; no tag/commit is pushed from this job
      id-token: write # mint the OIDC token npm Trusted Publishing exchanges
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Node 26 (maintainer-pinned; fall back to 24 only if 26 is ever
      # unavailable). Its bundled npm supports OIDC trusted publishing
      # (>= 11.5). The library build itself is version-agnostic within
      # active LTS/current.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Guard canonical Fairtrade release tag grammar
        run: node scripts/release-guard.mjs parse-tag "$TAG"

      - name: Guard tag <-> package.json version consistency
        run: |
          set -euo pipefail
          tag_version="${TAG#fairtrade-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::tag ${TAG} names version ${tag_version} but package.json is ${pkg_version}; retag the release commit or fix the version bump"
            exit 1
          fi

      - name: Determine the npm dist-tag from the version kind
        id: disttag
        run: |
          set -euo pipefail
          # A prerelease version (any -suffix, e.g. 0.1.0-rc1) publishes under
          # `next`; a final X.Y.Z takes `latest`.
          version="${TAG#fairtrade-v}"
          case "${version}" in
            *-*) echo "tag=next"    >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest"  >> "$GITHUB_OUTPUT" ;;
          esac

      # npm (not pnpm) for the publish step only — see the header comment.
      # prepack runs `pnpm build:lib`, so the full gate chain executes against
      # the exact tarball being published.
      - name: Publish @peasant-labs/fairtrade to npm (OIDC trusted publishing)
        run: |
          set -euo pipefail
          npm publish --access public --tag "${{ steps.disttag.outputs.tag }}"
          echo "::notice::published @peasant-labs/fairtrade@${TAG#fairtrade-v} under dist-tag ${{ steps.disttag.outputs.tag }} via OIDC trusted publishing"

      - name: Verify the published provenance result
        env:
          PROVENANCE_ERROR_FILE: ${{ runner.temp }}/fairtrade-provenance-npm-view-error
          REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
        run: |
          set -euo pipefail
          package="@peasant-labs/fairtrade@${TAG#fairtrade-v}"
          case "${REPOSITORY_VISIBILITY}" in
            public) attempts=12 ;;
            private|internal) attempts=1 ;;
            *) echo "::error::cannot verify ${package} provenance because GitHub reported unknown repository visibility ${REPOSITORY_VISIBILITY}"; exit 1 ;;
          esac

          : > "${PROVENANCE_ERROR_FILE}"
          npm_view_failed=0
          for attempt in $(seq 1 "${attempts}"); do
            if predicate="$(npm view "${package}" dist.attestations.provenance.predicateType --json 2>"${PROVENANCE_ERROR_FILE}")"; then
              npm_view_failed=0
            else
              npm_view_failed=1
              predicate=""
            fi
            if [ "${predicate}" = '"https://slsa.dev/provenance/v1"' ]; then
              echo "::notice::verified SLSA provenance attestation for ${package}"
              exit 0
            fi
            if [ "${attempt}" -lt "${attempts}" ]; then sleep 5; fi
          done

          if [ "${REPOSITORY_VISIBILITY}" = "public" ]; then
            if [ "${npm_view_failed}" -eq 1 ]; then
              npm_view_error="$(tr '\n' ' ' < "${PROVENANCE_ERROR_FILE}")"
              echo "::error::${package} was published, but its SLSA provenance attestation could not be verified because npm view failed: ${npm_view_error}"
            else
              echo "::error::${package} published without the required SLSA provenance attestation; verify package.json repository metadata and the npm Trusted Publisher registration before cutting another version"
            fi
            exit 1
          fi
          if [ "${npm_view_failed}" -eq 1 ]; then
            npm_view_error="$(tr '\n' ' ' < "${PROVENANCE_ERROR_FILE}")"
            echo "::warning::${package} was published, but npm view could not check its provenance result: ${npm_view_error}"
            exit 0
          fi
          echo "::warning::${package} published without an npm provenance attestation, as expected while the source repository is ${REPOSITORY_VISIBILITY}; make the audited source public before the first attested release"
