# Refresh the GitHub Release notes from the CHANGELOG on every release tag.
#
# Trigger: a `fairtrade-vX.Y.Z[-rcN]` annotated tag minted by release-batch.yml
# on the landed release commit (see AGENTS.md, "release & npm publication").
# The tag is computed: titles carry intent only, one serialized job plans the
# number, and the standing bot release PR is its only writer. The release
# job only pushes the tag; this workflow creates the GitHub Release for the
# tag that triggered it, or updates its notes on a re-run. Runs
# independently of npm-publish.yml: an npm publish failure never blocks this
# Release, and this Release failing never blocks npm publication.
#
# Job graph: `verify`, `notes` and `release` sit behind `guard` via `needs`,
# and `release` also needs `verify`, so the
# publish step can never run against an unparsed/misclassified tag. Only
# `release` holds the write-capable default token, so it runs no general
# step: `notes` builds the notes without the token and hands them over as an
# artifact.
#
#   push fairtrade-vX.Y.Z[-rcN]
#           |
#           v
#         guard  (scripts/release-guard.mjs parse-tag; fails closed on a
#           |     non-matching tag)
#           v
#   verify, notes  (release-intent verify-tag on the default branch;
#           |       changelog section -> notes/notes.md -> artifact)
#           |
#           v
#        release  (artifact -> gh release view, then create or edit)
#
# Mirrors peasant-labs/schema's release.yml guard -> publish shape, without
# the CLI/contract-gate stages this repo does not have.
name: Release

on:
  push:
    tags: ['fairtrade-v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    # The tag's parsed version and release kind ("rc" | "final"), derived
    # once here by the tested `release-guard parse-tag` (parseReleaseTag over
    # the anchored tag grammar under the release config's tag prefix), and the
    # changelog path the release config names. Downstream steps consume these
    # outputs rather than re-deriving them with an untested shell substring
    # match or restating a path.
    outputs:
      version: ${{ steps.parse.outputs.version }}
      kind: ${{ steps.parse.outputs.kind }}
      changelog: ${{ steps.config.outputs.changelog }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release-guard.mjs
            src/ui/closed-value.js
            .github/release-intent.yaml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      # The release config is the one place the tag prefix and the changelog
      # path are written. yq ships on the GitHub-hosted Ubuntu runner; -e fails
      # the step on a missing key instead of passing on "null".
      - name: Read the release config
        id: config
        run: |
          set -euo pipefail
          tag_prefix="$(yq -e '.tag_prefix' .github/release-intent.yaml)"
          changelog="$(yq -e '.changelog' .github/release-intent.yaml)"
          {
            echo "tag_prefix=${tag_prefix}"
            echo "changelog=${changelog}"
          } >> "$GITHUB_OUTPUT"

      - name: Parse + classify the tag
        id: parse
        env:
          TAG_PREFIX: ${{ steps.config.outputs.tag_prefix }}
        run: node scripts/release-guard.mjs parse-tag "$TAG" "$TAG_PREFIX"

  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the repository (full history and tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check out the release-intent tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: peasant-labs/infra
          ref: f2d3e5591e198ffeb1603d75115127632a94b68b
          path: infra-tool
          sparse-checkout: |
            tools/release
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: infra-tool/tools/release/go.mod
          cache-dependency-path: infra-tool/tools/release/go.sum

      - name: Build release-intent
        working-directory: infra-tool/tools/release
        run: |
          go build -o "${RUNNER_TEMP}/release-intent" ./cmd/release-intent
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # Pushing a tag needs only the right to write tags, so the tag may name a
      # commit that never landed. The tool checks the name against the
      # default branch's release config and that the default branch reaches
      # the tag's commit; nothing publishes until it passes.
      - name: Verify the tag is a release tag on the default branch
        run: release-intent verify-tag --tag "${GITHUB_REF_NAME}" --branch "origin/${DEFAULT_BRANCH}"

  notes:
    name: release notes
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      CHANGELOG: ${{ needs.guard.outputs.changelog }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Extract the changelog section for this version
        run: |
          set -euo pipefail
          mkdir -p notes
          node scripts/release-notes.mjs "$VERSION" "$CHANGELOG" > notes/notes.md

      - name: Append the npm publication line
        run: |
          set -euo pipefail
          {
            echo ""
            echo "Published as \`@peasant-labs/fairtrade@${VERSION}\` on npm."
          } >> notes/notes.md

      - name: Hand the notes to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: notes
          overwrite: true
          retention-days: 1

  # The publish job holds the write-capable default token, so it runs only
  # pinned allowed actions and one gh release command per step. The create
  # passes --verify-tag and names the tag that triggered this run, so this
  # workflow can only publish a Release for a tag that already exists and
  # never makes or moves one.
  release:
    name: publish GitHub Release
    needs: [guard, verify, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create/update the GitHub Release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes

      - name: Look for an existing GitHub Release (idempotent re-run)
        id: view
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Update the notes of the existing GitHub Release
        if: steps.view.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.kind == 'rc' }}
          LATEST: ${{ needs.guard.outputs.kind == 'final' }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes/notes.md --prerelease="$PRERELEASE" --latest="$LATEST"

      - name: Create the GitHub Release
        if: steps.view.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.kind == 'rc' }}
          LATEST: ${{ needs.guard.outputs.kind == 'final' }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes/notes.md --prerelease="$PRERELEASE" --latest="$LATEST"
