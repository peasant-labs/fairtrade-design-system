# Cut release: the maintainer's button for forcing a release with nothing to
# change. A dispatch with a level makes the bot push an empty commit to its
# own branch and open the cut-release PR with auto-merge on; that PR then
# lands through the queue like any releasing PR and the release job builds
# the release PR from it. The level rides in the landed commit, never in a
# number, so a rebuild can always reproduce the request. The button decides
# nothing by branch literal: its branch below is the push target the release
# config names for the cut-release kind, and every write step runs only while
# tag mode is on. The title travels through environment variables, never
# through `${{ }}` interpolation into a script.
name: cut-release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Bump level for the forced release
        required: true
        type: choice
        options: [patch, minor]

concurrency:
  group: cut-release
  cancel-in-progress: false

# read-only at the job level: the branch push and the PR writes below use the
# minted releaser App token.
permissions:
  contents: read

jobs:
  cut:
    # A dispatch on any other branch would run that branch's copy of this file
    # with the App key, and a run while tag mode is off must change nothing.
    if: github.ref == 'refs/heads/main' && vars.RELEASE_BATCH_MODE == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint the releaser App token
        id: mint
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PEASANT_RELEASER_APP_ID }}
          private-key: ${{ secrets.PEASANT_RELEASER_APP_PRIVATE_KEY }}
          owner: peasant-labs
          repositories: fairtrade-design-system

      - name: Push an empty release commit to the bot branch
        if: vars.RELEASE_BATCH_MODE == 'tag'
        env:
          APP_TOKEN: ${{ steps.mint.outputs.token }}
          LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B automation/cut-release origin/main
          git config user.name peasant-release-bot
          git config user.email bots@peasant-labs.invalid
          git commit --allow-empty -m "release[${LEVEL}]: cut a release"
          git -c http.extraheader="AUTHORIZATION: bearer ${APP_TOKEN}" push --force-with-lease origin HEAD:automation/cut-release

      # An already-open cut-release PR with this title is left open: the push
      # above updated it. One with another level is closed by branch and
      # recreated, so the title always names the requested level. A bot job
      # never edits a PR; it updates its own by pushing its branch.
      - name: Open the cut-release PR
        if: vars.RELEASE_BATCH_MODE == 'tag'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          LEVEL: ${{ inputs.level }}
          REQUESTED_BY: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          title="release[${LEVEL}]: cut a release"
          body="Forced ${LEVEL} release requested by @${REQUESTED_BY} through the cut-release button. Landing this empty commit makes the release job build the release PR."
          open="$(gh pr list --head automation/cut-release --state open --json number,title --jq '.[0] // empty | [.number, .title] | @tsv')"
          number="${open%%$'\t'*}"
          open_title="${open#*$'\t'}"
          if [ -n "${number}" ] && [ "${open_title}" != "${title}" ]; then
            # A `;`-terminated segment: the checker resolves the closed and
            # opened PR to the bot branch named on this line.
            gh pr close automation/cut-release;
            number=""
          fi
          if [ -z "${number}" ]; then
            gh pr create --head automation/cut-release --base main --title "${title}" --body "${body}";
          fi

      - name: Arm auto-merge on the cut-release PR
        if: vars.RELEASE_BATCH_MODE == 'tag'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail
          # A `;`-terminated segment, like the open step: the checker resolves
          # the merged PR to the bot branch named on this line.
          gh pr merge --auto --squash automation/cut-release;
