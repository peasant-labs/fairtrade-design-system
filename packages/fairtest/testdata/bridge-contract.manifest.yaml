# Required-name inventory and executable mutations for bridge-contract.yaml.
expectedCaseCount: 9
requiredCaseNames:
  - local-identity-valid
  - process-identity-valid
  - identity-bad-kind
  - declaration-valid
  - declaration-cross-kind
  - declaration-missing-capability
  - readiness-valid
  - readiness-bad-channel
  - cleanup-valid
expectedMutationCount: 8
requiredMutationNames:
  - removing the declaration-valid record breaks the required inventory
  - duplicating a case name breaks uniqueness
  - renaming the check discriminator breaks the case shape
  - deleting the declaration breaks the case shape
  - flipping the readiness channel breaks the behavioral runner
  - adding an unknown case field breaks exact membership
  - inventing a check kind breaks the closed vocabulary
  - appending a trailing document breaks single-document loading
mutations:
  - name: removing the declaration-valid record breaks the required inventory
    kind: delete-record
    target: declaration-valid
    expectedField: declaration-valid
  - name: duplicating a case name breaks uniqueness
    kind: duplicate-name
    target: local-identity-valid
    expectedField: local-identity-valid
  - name: renaming the check discriminator breaks the case shape
    kind: rename-field
    target: readiness-valid
    field: check
    newField: kind
    expectedField: check
  - name: deleting the declaration breaks the case shape
    kind: delete-field
    target: declaration-valid
    field: declaration
    expectedField: declaration
  - name: flipping the readiness channel breaks the behavioral runner
    kind: bad-value
    target: readiness-valid
    field: readiness.port
    value: 0
    expectedField: port
  - name: adding an unknown case field breaks exact membership
    kind: unknown-field
    target: local-identity-valid
    field: theme
    value: light
    expectedField: theme
  - name: inventing a check kind breaks the closed vocabulary
    kind: bad-value
    target: cleanup-valid
    field: check
    value: invented-check
    expectedField: check
  - name: appending a trailing document breaks single-document loading
    kind: trailing-document
    target: document
    expectedField: document
