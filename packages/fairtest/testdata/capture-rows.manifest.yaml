# Required-name inventory and executable mutations for capture-rows.yaml.
expectedCaseCount: 10
requiredCaseNames:
  - certified capture run verifies
  - dropped artifact fails
  - tampered artifact digest fails
  - missing proof fails
  - cross-root provenance fails
  - shot reference without a file fails
  - target with neither shot nor reason fails
  - target with both a shot and a reason fails
  - a shot whose bytes differ from its digest fails
  - a restated theme observation fails
expectedMutationCount: 7
requiredMutationNames:
  - removing the cross-root case breaks the required inventory
  - duplicating a case name breaks uniqueness
  - renaming the check discriminator breaks the case shape
  - deleting the mutation name breaks the case shape
  - adding an unknown case field breaks exact membership
  - inventing a check kind breaks the closed vocabulary
  - appending a trailing document breaks single-document loading
mutations:
  - name: removing the cross-root case breaks the required inventory
    kind: delete-record
    target: cross-root provenance fails
    expectedField: cross-root provenance fails
  - name: duplicating a case name breaks uniqueness
    kind: duplicate-name
    target: certified capture run verifies
    expectedField: certified capture run verifies
  - name: renaming the check discriminator breaks the case shape
    kind: rename-field
    target: tampered artifact digest fails
    field: check
    newField: kind
    expectedField: check
  - name: deleting the mutation name breaks the case shape
    kind: delete-field
    target: dropped artifact fails
    field: mutation
    expectedField: mutation
  - name: adding an unknown case field breaks exact membership
    kind: unknown-field
    target: missing proof fails
    field: origins
    value: extra
    expectedField: origins
  - name: inventing a check kind breaks the closed vocabulary
    kind: bad-value
    target: cross-root provenance fails
    field: check
    value: invented-check
    expectedField: check
  - name: appending a trailing document breaks single-document loading
    kind: trailing-document
    target: document
    expectedField: document
